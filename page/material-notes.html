<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Notes</title>

  <!-- Markdown Renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-color: #f8f9ff;
      --surface-color: #ffffff;
      --surface-variant: #e0e2ec;
      --surface-container-high: #e1e2ec;
      --text-primary: #191c20;
      --text-secondary: #43474e;
      --text-muted: #73777f;
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --primary-container: #d3e3fd;
      --on-primary-container: #041e49;
      --border-color: #c4c6d0;
      --divider-color: #e0e2ec;
      --pin-bg: #fff0d4;
      --pin-text: #825500;
      --restore-bg: #cce8e7;
      --restore-text: #002020;
      --trash-bg: #ffdad6;
      --trash-text: #410002;
      --fab-bg: #0b57d0;
      --fab-text: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
      --drawer-bg: #f3f6fc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121318;
        --surface-color: #1b1c22;
        --surface-variant: #2f3038;
        --surface-container-high: #31333c;
        --text-primary: #e2e2e9;
        --text-secondary: #c4c6cf;
        --text-muted: #8e9099;
        --primary: #a8c7ff;
        --on-primary: #002e69;
        --primary-container: #004494;
        --on-primary-container: #d3e3fd;
        --border-color: #43474e;
        --divider-color: #2b2c34;
        --pin-bg: #3d2a00;
        --pin-text: #ffde9f;
        --restore-bg: #004f4f;
        --restore-text: #cce8e7;
        --trash-bg: #601410;
        --trash-text: #ffdad6;
        --fab-bg: #a8c7ff;
        --fab-text: #002e69;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        --drawer-bg: #1e2024;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: row;
      position: relative;
      width: 100%;
    }

    /* MAIN CONTENT COLUMN */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .top-app-bar {
      height: 56px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 20;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .icon-btn:hover { background-color: var(--surface-variant); }
    .icon-btn:active { background-color: var(--border-color); }

    .search-container {
      display: none;
      padding: 8px 12px;
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
    }

    .search-container.active { display: block; }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background-color: var(--surface-variant);
      border-radius: 20px;
      padding: 4px 12px;
      gap: 8px;
    }

    .search-input-wrapper input {
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      width: 100%;
      padding: 6px 0;
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      background-color: var(--drawer-bg);
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
    }

    .drawer.active { transform: translateX(0); }

    .drawer-header {
      padding: 20px 16px 12px 16px;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary);
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-menu {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border-radius: 24px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background-color 0.15s ease;
      user-select: none;
    }

    .drawer-item:hover { background-color: var(--surface-variant); }
    .drawer-item.active {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
    }

    .drawer-item .badge {
      margin-left: auto;
      font-size: 0.75rem;
      background: var(--surface-variant);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .drawer-divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 10px 8px;
    }

    .drawer-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 8px 16px 4px 16px;
    }

    /* RESPONSIVE LAYOUT FOR PC / WIDE SCREENS */
    @media (min-width: 768px) {
      .drawer {
        position: relative;
        transform: none !important;
        z-index: 10;
        flex-shrink: 0;
      }

      .drawer-overlay {
        display: none !important;
      }

      .menu-toggle-btn {
        display: none !important;
      }
    }

    .main-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .list-item-wrapper {
      position: relative;
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--divider-color);
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
    }

    .swipe-bg-left, .swipe-bg-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .swipe-bg-left { left: 0; justify-content: flex-start; gap: 8px; }
    .swipe-bg-right { right: 0; justify-content: flex-end; gap: 8px; }

    .swipe-bg-left.trash-mode { background-color: var(--restore-bg); color: var(--restore-text); }
    .swipe-bg-left.normal-mode { background-color: var(--trash-bg); color: var(--trash-text); }
    .swipe-bg-right.trash-mode { background-color: var(--trash-bg); color: var(--trash-text); }
    .swipe-bg-right.normal-mode { background-color: var(--pin-bg); color: var(--pin-text); }

    .list-item-content {
      position: relative;
      background-color: var(--surface-color);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
      cursor: pointer;
      will-change: transform;
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .item-pin-icon { color: var(--pin-text); display: flex; align-items: center; }

    .item-snippet {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .fab {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--fab-bg);
      color: var(--fab-text);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease;
    }

    .fab:active { transform: scale(0.95); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      padding: 20px;
      text-align: center;
      gap: 12px;
    }

    .editor-screen {
      position: absolute;
      inset: 0;
      background-color: var(--surface-color);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .editor-screen.active { transform: translateY(0); }

    .editor-header {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background-color: var(--surface-color);
    }

    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    .editor-title {
      border: none;
      background: transparent;
      outline: none;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      width: 100%;
    }

    .editor-textarea {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: monospace, system-ui;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-primary);
      resize: none;
      min-height: 200px;
    }

    .markdown-body {
      flex: 1;
      line-height: 1.6;
      color: var(--text-primary);
      font-size: 0.95rem;
      overflow-y: auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.6);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--text-primary);
      color: var(--surface-color);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 100;
      box-shadow: var(--shadow-md);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .toast.active { transform: translateX(-50%) translateY(0); }

    .bin-banner {
      background-color: var(--trash-bg);
      color: var(--trash-text);
      padding: 8px 14px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    /* LARGER BUTTONS WITH MORE PADDING & SAME TEXT SIZE */
    .btn-sm {
      padding: 8px 18px;
      border-radius: 16px;
      border: none;
      background-color: var(--primary);
      color: var(--on-primary);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
    }

    .btn-sm:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="app">
    
    <!-- DRAWER MENU & BACKDROP -->
    <div id="drawerOverlay" class="drawer-overlay"></div>
    <aside id="navDrawer" class="drawer">
      <div class="drawer-header">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Material Notes</span>
      </div>

      <nav class="drawer-menu">
        <div onclick="selectFilter('all')" id="navAll" class="drawer-item active">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>All Notes</span>
          <span id="cntAll" class="badge">0</span>
        </div>

        <div onclick="selectFilter('pinned')" id="navPinned" class="drawer-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H8l1 5-2 3v2h5v6l1 1 1-1v-6h5v-2l-2-3 1-5z"/></svg>
          <span>Pinned</span>
          <span id="cntPinned" class="badge">0</span>
        </div>

        <div onclick="selectFilter('trash')" id="navTrash" class="drawer-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Bin</span>
          <span id="cntTrash" class="badge">0</span>
        </div>

        <div class="drawer-divider"></div>
        <div class="drawer-section-title">Backup & Restore</div>
        
        <div onclick="exportBackupJSON()" class="drawer-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export Backup (JSON)</span>
        </div>

        <label class="drawer-item" style="cursor:pointer;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Restore Backup (JSON)</span>
          <input type="file" accept=".json" onchange="importBackupJSON(event)" style="display:none;">
        </label>
      </nav>
    </aside>

    <!-- MAIN CONTENT VIEWPORT -->
    <div class="main-content">
      
      <!-- TOP APP BAR -->
      <header class="top-app-bar">
        <div style="display:flex; align-items:center; gap:8px;">
          <button onclick="toggleDrawer()" class="icon-btn menu-toggle-btn" aria-label="Open Navigation Drawer" title="Open Drawer">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span id="screenTitle" class="app-title">Notes</span>
        </div>

        <div style="display:flex; align-items:center; gap:4px;">
          <button onclick="toggleSearch()" class="icon-btn" aria-label="Search Notes" title="Search">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="sortBtn" onclick="toggleSortMenu()" class="icon-btn" aria-label="Sort Options" title="Sort">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="11" y1="5" x2="21" y2="5"/><line x1="11" y1="12" x2="18" y2="12"/><line x1="11" y1="19" x2="15" y2="19"/><polyline points="3 17 6 20 9 17"/><line x1="6" y1="4" x2="6" y2="20"/></svg>
          </button>
        </div>
      </header>

      <!-- SEARCH INPUT BAR -->
      <div id="searchBar" class="search-container">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="text" placeholder="Search title and content..." oninput="handleSearch(this.value)">
          <button onclick="clearSearch()" aria-label="Clear Search" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- SORT DROPDOWN -->
      <div id="sortMenu" style="display:none; position:absolute; top:56px; right:12px; background:var(--surface-color); border:1px solid var(--border-color); border-radius:12px; box-shadow:var(--shadow-md); z-index:30; width:180px; padding:6px 0;">
        <div style="padding:6px 14px; font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase;">Sort Notes By</div>
        <div onclick="setSortMode('updated')" style="padding:8px 14px; font-size:0.85rem; cursor:pointer;" class="drawer-item">Date Modified</div>
        <div onclick="setSortMode('created')" style="padding:8px 14px; font-size:0.85rem; cursor:pointer;" class="drawer-item">Date Created</div>
        <div onclick="setSortMode('title')" style="padding:8px 14px; font-size:0.85rem; cursor:pointer;" class="drawer-item">Title (A-Z)</div>
        <div onclick="setSortMode('title-desc')" style="padding:8px 14px; font-size:0.85rem; cursor:pointer;" class="drawer-item">Title (Z-A)</div>
      </div>

      <main class="main-viewport">
        <!-- Bin Banner -->
        <div id="binBanner" class="bin-banner" style="display:none;">
          <span>Notes in Bin are kept until permanently deleted.</span>
          <button onclick="promptEmptyBin()" class="btn-sm">Empty</button>
        </div>

        <!-- Compact List View -->
        <div id="notesContainer" class="notes-list"></div>

        <!-- Floating Action Button -->
        <button id="addNoteFab" onclick="createNewNote()" class="fab" aria-label="Create New Note" title="Create New Note">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </main>

      <!-- EDITOR SCREEN -->
      <section id="editorScreen" class="editor-screen">
        <header class="editor-header">
          <button onclick="closeEditor()" class="icon-btn" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>

          <div style="display:flex; align-items:center; gap:4px;">
            <button onclick="toggleMarkdownPreview()" id="previewToggleBtn" class="icon-btn" aria-label="Toggle Markdown Preview" title="Toggle Preview">
              <svg id="previewIconEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="previewIconEdit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>

            <button onclick="toggleActiveNotePin()" id="editorPinBtn" class="icon-btn" aria-label="Pin Note" title="Pin Note"></button>

            <button onclick="promptDeleteActiveNote()" id="editorDeleteBtn" class="icon-btn" aria-label="Delete Note" title="Delete Note">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </header>

        <div class="editor-body">
          <input id="editorTitle" type="text" placeholder="Title" oninput="debouncedSave()" class="editor-title">
          <textarea id="editorContent" placeholder="Write markdown content here..." oninput="debouncedSave()" class="editor-textarea"></textarea>
          <div id="markdownPreview" class="markdown-body" style="display:none;"></div>
        </div>
      </section>

    </div>

  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast">Action completed</div>

  <script>
    /* REUSED SIDEBAR BIN ICON UNIFIED FOR SWIPE ACTION */
    const SVG_PIN_UNPINNED = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H8l1 5-2 3v2h5v6l1 1 1-1v-6h5v-2l-2-3 1-5z"/></svg>`;
    const SVG_PIN_PINNED = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 3H8l1 5-2 3v2h5v6l1 1 1-1v-6h5v-2l-2-3 1-5z"/></svg>`;
    const SVG_RESTORE = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;
    const SVG_TRASH = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;

    class StorageEngine {
      constructor() {
        this.db = null;
        this.useLocalStorage = false;
        this.dbName = 'MaterialNotesDB';
        this.version = 1;
      }

      async init() {
        return new Promise((resolve) => {
          if (!window.indexedDB) {
            this.useLocalStorage = true;
            resolve();
            return;
          }

          try {
            const req = window.indexedDB.open(this.dbName, this.version);
            req.onerror = () => { this.useLocalStorage = true; resolve(); };
            req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('notes')) {
                db.createObjectStore('notes', { keyPath: 'id' });
              }
            };
          } catch(err) {
            this.useLocalStorage = true;
            resolve();
          }
        });
      }

      async getAllNotes() {
        if (this.useLocalStorage) {
          return JSON.parse(localStorage.getItem('mn_notes') || '[]');
        }
        return new Promise((resolve) => {
          const tx = this.db.transaction('notes', 'readonly');
          const store = tx.objectStore('notes');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      }

      async saveAllNotes(notesArray) {
        if (this.useLocalStorage) {
          localStorage.setItem('mn_notes', JSON.stringify(notesArray));
          return;
        }
        const tx = this.db.transaction('notes', 'readwrite');
        const store = tx.objectStore('notes');
        store.clear();
        notesArray.forEach(note => store.put(note));
      }
    }

    const SAMPLE_NOTES = [
      {
        id: 'sample-1',
        title: 'Welcome to Material Notes',
        content: 'This note app is built with **Material Design 3**.\n\n- Light & Dark Mode\n- **Markdown rich text rendering**\n- Drag list items left to pin or right to delete!',
        isPinned: true,
        isTrashed: false,
        createdAt: Date.now() - 300000,
        updatedAt: Date.now() - 100000
      },
      {
        id: 'sample-2',
        title: 'Markdown Formatting Guide',
        content: '# Heading 1\n## Heading 2\n\nInline `code` and code blocks:\n```javascript\nconsole.log("Hello Material!");\n```\n> Blockquote text here',
        isPinned: false,
        isTrashed: false,
        createdAt: Date.now() - 200000,
        updatedAt: Date.now() - 50000
      }
    ];

    const storage = new StorageEngine();
    let notes = [];
    let currentFilter = 'all';
    let sortMode = 'updated';
    let activeNoteId = null;
    let searchQuery = '';
    let isPreviewMode = false;
    let saveTimeout = null;

    function debouncedSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentNote, 300);
    }

    function pushNavState(type, extraData = {}) {
      history.pushState({ type, ...extraData }, '');
    }

    function handleBackAction() {
      if (history.state && history.state.type && history.state.type !== 'main') {
        history.back();
      } else {
        closeModalUI();
        closeEditorUI();
        closeDrawerUI();
        closeSortMenuUI();
      }
    }

    window.addEventListener('popstate', (e) => {
      const state = e.state;
      if (!state || state.type === 'main') {
        closeModalUI();
        closeEditorUI();
        closeDrawerUI();
        closeSortMenuUI();
      } else if (state.type === 'drawer') {
        closeModalUI();
        closeEditorUI();
        closeSortMenuUI();
        openDrawerUI();
      } else if (state.type === 'editor') {
        closeModalUI();
        closeDrawerUI();
        closeSortMenuUI();
        if (activeNoteId !== state.noteId) {
          openEditorUI(state.noteId);
        }
      } else if (state.type === 'modal') {
        closeSortMenuUI();
        document.getElementById('modalBackdrop').classList.add('active');
      } else if (state.type === 'sortMenu') {
        document.getElementById('sortMenu').style.display = 'block';
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      history.replaceState({ type: 'main' }, '');
      await storage.init();
      notes = await storage.getAllNotes();

      if (notes.length === 0) {
        notes = [...SAMPLE_NOTES];
        await storage.saveAllNotes(notes);
      }

      updateNavigationCounts();
      renderNotesList();

      document.getElementById('drawerOverlay').addEventListener('click', () => handleBackAction());
      document.getElementById('modalBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modalBackdrop') handleBackAction();
      });

      document.addEventListener('click', (e) => {
        const sortMenu = document.getElementById('sortMenu');
        const sortBtn = document.getElementById('sortBtn');
        if (sortMenu && sortMenu.style.display === 'block' && !sortMenu.contains(e.target) && !sortBtn.contains(e.target)) {
          handleBackAction();
        }
      });
    });

    function toggleDrawer() {
      if (document.getElementById('navDrawer').classList.contains('active')) {
        handleBackAction();
      } else {
        openDrawerUI();
        pushNavState('drawer');
      }
    }

    function openDrawerUI() {
      document.getElementById('navDrawer').classList.add('active');
      document.getElementById('drawerOverlay').classList.add('active');
    }

    function closeDrawerUI() {
      document.getElementById('navDrawer').classList.remove('active');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function selectFilter(filter) {
      currentFilter = filter;
      handleBackAction();

      document.getElementById('screenTitle').textContent = 
        filter === 'all' ? 'Notes' :
        filter === 'pinned' ? 'Pinned' : 'Bin';

      document.getElementById('binBanner').style.display = filter === 'trash' ? 'flex' : 'none';

      const fab = document.getElementById('addNoteFab');
      if (fab) {
        fab.style.display = filter === 'all' ? 'flex' : 'none';
      }

      document.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('active'));
      if (filter === 'all') document.getElementById('navAll').classList.add('active');
      if (filter === 'pinned') document.getElementById('navPinned').classList.add('active');
      if (filter === 'trash') document.getElementById('navTrash').classList.add('active');

      renderNotesList();
    }

    function updateNavigationCounts() {
      const activeNotes = notes.filter(n => !n.isTrashed);
      document.getElementById('cntAll').textContent = activeNotes.length;
      document.getElementById('cntPinned').textContent = activeNotes.filter(n => n.isPinned).length;
      document.getElementById('cntTrash').textContent = notes.filter(n => n.isTrashed).length;
    }

    function renderNotesList() {
      updateNavigationCounts();
      const container = document.getElementById('notesContainer');
      container.innerHTML = '';

      let filtered = notes.filter(n => {
        if (currentFilter === 'trash') return n.isTrashed;
        if (n.isTrashed) return false;
        if (currentFilter === 'pinned') return n.isPinned;
        return true;
      });

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        filtered = filtered.filter(n => {
          const titleText = (n.title || '').toLowerCase();
          const contentText = (n.content || '').toLowerCase();
          return titleText.includes(q) || contentText.includes(q);
        });
      }

      filtered.sort((a, b) => {
        if (currentFilter === 'all' && a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        if (sortMode === 'title') return (a.title || '').localeCompare(b.title || '');
        if (sortMode === 'title-desc') return (b.title || '').localeCompare(a.title || '');
        if (sortMode === 'created') return b.createdAt - a.createdAt;
        return b.updatedAt - a.updatedAt;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>No notes found</p>
          </div>
        `;
        return;
      }

      const isBin = currentFilter === 'trash';

      filtered.forEach(note => {
        const wrapper = document.createElement('div');
        wrapper.className = 'list-item-wrapper';

        wrapper.innerHTML = `
          <div class="swipe-bg-left ${isBin ? 'trash-mode' : 'normal-mode'}">
            ${isBin ? SVG_RESTORE : SVG_TRASH}
            <span>${isBin ? 'Restore Note' : 'Move to Bin'}</span>
          </div>
          <div class="swipe-bg-right ${isBin ? 'trash-mode' : 'normal-mode'}">
            <span>${isBin ? 'Delete Permanently' : (note.isPinned ? 'Unpin Note' : 'Pin Note')}</span>
            ${isBin ? SVG_TRASH : (note.isPinned ? SVG_PIN_PINNED : SVG_PIN_UNPINNED)}
          </div>
          <div class="list-item-content">
            <div class="item-header">
              <span class="item-title">${escapeHtml(note.title || 'Untitled')}</span>
              ${note.isPinned ? `<span class="item-pin-icon" title="Pinned">${SVG_PIN_PINNED}</span>` : ''}
            </div>
            <div class="item-snippet">${escapeHtml(note.content || 'Empty note')}</div>
          </div>
        `;

        attachSwipeGestures(wrapper, note.id);
        container.appendChild(wrapper);
      });
    }

    function attachSwipeGestures(wrapper, noteId) {
      const contentEl = wrapper.querySelector('.list-item-content');
      const bgLeft = wrapper.querySelector('.swipe-bg-left');
      const bgRight = wrapper.querySelector('.swipe-bg-right');

      let startX = 0;
      let startY = 0;
      let deltaX = 0;
      let isDragging = false;
      let isHorizontal = false;

      function onPointerDown(e) {
        if (e.button !== undefined && e.button !== 0) return;
        startX = e.clientX;
        startY = e.clientY;
        deltaX = 0;
        isDragging = true;
        isHorizontal = false;
        contentEl.style.transition = 'none';
        contentEl.setPointerCapture(e.pointerId);
      }

      function onPointerMove(e) {
        if (!isDragging) return;

        const diffX = e.clientX - startX;
        const diffY = e.clientY - startY;

        if (!isHorizontal) {
          if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 8) {
            isHorizontal = true;
          } else if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 8) {
            isDragging = false;
            return;
          }
        }

        if (isHorizontal) {
          deltaX = diffX;
          contentEl.style.transform = `translateX(${deltaX}px)`;

          if (deltaX > 0) {
            bgLeft.style.opacity = Math.min(1, deltaX / 60);
            bgRight.style.opacity = '0';
          } else {
            bgRight.style.opacity = Math.min(1, Math.abs(deltaX) / 60);
            bgLeft.style.opacity = '0';
          }
        }
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;

        if (contentEl.hasPointerCapture(e.pointerId)) {
          contentEl.releasePointerCapture(e.pointerId);
        }

        contentEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        const isBin = currentFilter === 'trash';
        const itemWidth = wrapper.clientWidth || 300;
        const threshold = itemWidth * 0.5;

        if (deltaX > threshold) {
          contentEl.style.transform = 'translateX(100%)';
          setTimeout(() => {
            if (isBin) {
              handleRestoreNote(noteId);
            } else {
              handleMoveToBin(noteId);
            }
          }, 150);
        } else if (deltaX < -threshold) {
          contentEl.style.transform = 'translateX(-100%)';
          setTimeout(() => {
            if (isBin) {
              handlePermanentDelete(noteId);
            } else {
              handleTogglePin(noteId);
            }
          }, 150);
        } else {
          if (!isHorizontal && Math.abs(deltaX) < 5) {
            openEditor(noteId);
          }
          contentEl.style.transform = 'translateX(0px)';
          bgLeft.style.opacity = '0';
          bgRight.style.opacity = '0';
        }
      }

      contentEl.addEventListener('pointerdown', onPointerDown);
      contentEl.addEventListener('pointermove', onPointerMove);
      contentEl.addEventListener('pointerup', onPointerUp);
      contentEl.addEventListener('pointercancel', onPointerUp);
    }

    async function handleTogglePin(noteId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.isPinned = !note.isPinned;
        note.updatedAt = Date.now();
        await storage.saveAllNotes(notes);

        if (activeNoteId === noteId) {
          updateEditorPinBtnState(note.isPinned);
        }

        renderNotesList();
        showToast(note.isPinned ? 'Note Pinned' : 'Note Unpinned');
      }
    }

    async function handleMoveToBin(noteId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.isPinned = false;
        note.isTrashed = true;
        note.updatedAt = Date.now();
        await storage.saveAllNotes(notes);
        renderNotesList();
        showToast('Moved to Bin');
      }
    }

    async function handleRestoreNote(noteId) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        note.isTrashed = false;
        note.updatedAt = Date.now();
        await storage.saveAllNotes(notes);
        renderNotesList();
        showToast('Note restored');
      }
    }

    async function handlePermanentDelete(noteId) {
      notes = notes.filter(n => n.id !== noteId);
      await storage.saveAllNotes(notes);
      renderNotesList();
      showToast('Permanently deleted');
    }

    function promptDeleteActiveNote() {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;

      const isBin = note.isTrashed;
      const modalTitle = isBin ? 'Delete Permanently?' : 'Move to Bin?';
      const modalDesc = isBin ? 'This note will be permanently deleted and cannot be recovered.' : 'This note will be moved to the Bin.';
      const actionText = isBin ? 'Delete' : 'Move';

      openModal(`
        <div class="modal-title">${modalTitle}</div>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">${modalDesc}</p>
        <div style="display:flex; justify-content:flex-end; gap:12px;">
          <button onclick="closeModal()" class="btn-sm" style="background:var(--surface-variant); color:var(--text-primary);">Cancel</button>
          <button onclick="confirmDeleteActiveNote()" class="btn-sm" style="background:var(--trash-bg); color:var(--trash-text);">${actionText}</button>
        </div>
      `);
    }

    async function confirmDeleteActiveNote() {
      if (!activeNoteId) return;
      const noteId = activeNoteId;
      const note = notes.find(n => n.id === noteId);
      closeModal();
      if (!note) return;

      if (note.isTrashed) {
        await handlePermanentDelete(noteId);
      } else {
        await handleMoveToBin(noteId);
      }
      closeEditor();
    }

    function createNewNote() {
      const newNote = {
        id: 'note-' + Date.now(),
        title: '',
        content: '',
        isPinned: false,
        isTrashed: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      notes.unshift(newNote);
      storage.saveAllNotes(notes);
      openEditor(newNote.id);
    }

    function openEditor(noteId) {
      if (activeNoteId === noteId && document.getElementById('editorScreen').classList.contains('active')) {
        return;
      }
      openEditorUI(noteId);
      pushNavState('editor', { noteId });
    }

    function openEditorUI(noteId) {
      activeNoteId = noteId;
      const note = notes.find(n => n.id === noteId);
      if (!note) return;

      document.getElementById('editorTitle').value = note.title || '';
      document.getElementById('editorContent').value = note.content || '';
      
      isPreviewMode = false;
      document.getElementById('editorContent').style.display = 'block';
      document.getElementById('markdownPreview').style.display = 'none';
      document.getElementById('previewIconEye').style.display = 'block';
      document.getElementById('previewIconEdit').style.display = 'none';

      updateEditorPinBtnState(note.isPinned);
      document.getElementById('editorScreen').classList.add('active');
    }

    function updateEditorPinBtnState(isPinned) {
      const btn = document.getElementById('editorPinBtn');
      if (isPinned) {
        btn.innerHTML = SVG_PIN_PINNED;
        btn.title = "Unpin Note";
      } else {
        btn.innerHTML = SVG_PIN_UNPINNED;
        btn.title = "Pin Note";
      }
    }

    function closeEditor() {
      closeEditorUI();
      if (history.state && history.state.type === 'editor') {
        history.back();
      }
    }

    function closeEditorUI() {
      saveCurrentNote();
      document.getElementById('editorScreen').classList.remove('active');
      activeNoteId = null;
      renderNotesList();
    }

    async function saveCurrentNote() {
      if (!activeNoteId) return;
      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;

      const newTitle = document.getElementById('editorTitle').value;
      const newContent = document.getElementById('editorContent').value;

      if (note.title !== newTitle || note.content !== newContent) {
        note.title = newTitle;
        note.content = newContent;
        note.updatedAt = Date.now();
        await storage.saveAllNotes(notes);
      }
    }

    function toggleMarkdownPreview() {
      isPreviewMode = !isPreviewMode;
      const contentEl = document.getElementById('editorContent');
      const previewEl = document.getElementById('markdownPreview');
      const eyeIcon = document.getElementById('previewIconEye');
      const editIcon = document.getElementById('previewIconEdit');

      if (isPreviewMode) {
        saveCurrentNote();
        const note = notes.find(n => n.id === activeNoteId);
        const rawMarkdown = note ? note.content : '';
        previewEl.innerHTML = marked.parse(rawMarkdown || '*No content*');
        
        contentEl.style.display = 'none';
        previewEl.style.display = 'block';
        eyeIcon.style.display = 'none';
        editIcon.style.display = 'block';
      } else {
        contentEl.style.display = 'block';
        previewEl.style.display = 'none';
        eyeIcon.style.display = 'block';
        editIcon.style.display = 'none';
      }
    }

    function toggleActiveNotePin() {
      if (!activeNoteId) return;
      handleTogglePin(activeNoteId);
    }

    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      const isActive = bar.classList.toggle('active');
      if (isActive) {
        document.getElementById('searchInput').focus();
      } else {
        clearSearch();
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      renderNotesList();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      renderNotesList();
    }

    function toggleSortMenu() {
      const menu = document.getElementById('sortMenu');
      if (menu.style.display === 'block') {
        handleBackAction();
      } else {
        menu.style.display = 'block';
        pushNavState('sortMenu');
      }
    }

    function closeSortMenuUI() {
      document.getElementById('sortMenu').style.display = 'none';
    }

    function setSortMode(mode) {
      sortMode = mode;
      handleBackAction();
      renderNotesList();
    }

    /* MODAL PROMPT WITH ENLARGED TOUCH-FRIENDLY BUTTONS */
    function promptEmptyBin() {
      openModal(`
        <div class="modal-title">Empty Bin?</div>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">All notes in Bin will be permanently deleted.</p>
        <div style="display:flex; justify-content:flex-end; gap:12px;">
          <button onclick="closeModal()" class="btn-sm" style="background:var(--surface-variant); color:var(--text-primary);">Cancel</button>
          <button onclick="emptyBin(); closeModal();" class="btn-sm" style="background:var(--trash-bg); color:var(--trash-text);">Empty</button>
        </div>
      `);
    }

    async function emptyBin() {
      notes = notes.filter(n => !n.isTrashed);
      await storage.saveAllNotes(notes);
      renderNotesList();
      showToast('Bin emptied');
    }

    function exportBackupJSON() {
      const data = { notes, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `material_notes_backup_${Date.now()}.json`;
      a.click();
      showToast('Backup exported');
    }

    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.notes) notes = parsed.notes;
          await storage.saveAllNotes(notes);
          renderNotesList();
          showToast('Backup restored');
        } catch(err) {
          showToast('Failed to parse backup JSON');
        }
      };
      reader.readAsText(file);
    }

    function openModal(contentHtml) {
      document.getElementById('modalCard').innerHTML = contentHtml;
      document.getElementById('modalBackdrop').classList.add('active');
      pushNavState('modal');
    }

    function closeModal() {
      handleBackAction();
    }

    function closeModalUI() {
      document.getElementById('modalBackdrop').classList.remove('active');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2000);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
