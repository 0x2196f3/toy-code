
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notepad - Web</title>
<script>
(function(){try{var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.setAttribute('data-theme',d?'dark':'light');
document.documentElement.setAttribute('data-mode','auto');}catch(e){}})();
</script>
<style>
:root{
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f6f8; --panel:#ffffff; --editor-bg:#ffffff; --field:#ffffff;
  --fg:#1d2430; --fg-dim:#5b6572; --fg-faint:#98a2b0;
  --border:#d9dee6; --hover:#eceff4; --active:#e2e7ee;
  --accent:#2f6fed; --accent-soft:rgba(47,111,237,.13);
  --danger:#d93843; --danger-soft:rgba(217,56,67,.14);
  --mark:rgba(255,213,0,.55); --mark-cur:rgba(255,170,0,.75);
  --sel:rgba(47,111,237,.22); --line-hl:rgba(47,111,237,.09);
  --code-bg:#eff1f4;
  --hl-com:#6e7781; --hl-kw:#cf222e; --hl-str:#0a3069; --hl-num:#0550ae;
  --hl-typ:#953800; --hl-fn:#8250df; --hl-tag:#116329; --hl-var:#b35900;
  --shadow:0 8px 28px rgba(15,23,42,.16);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1317; --panel:#161b22; --editor-bg:#12171d; --field:#10151b;
  --fg:#dbe2ea; --fg-dim:#93a0ae; --fg-faint:#5c6875;
  --border:#28313c; --hover:#1b222b; --active:#232c37;
  --accent:#5b8dff; --accent-soft:rgba(91,141,255,.17);
  --danger:#ff6b74; --danger-soft:rgba(255,107,116,.17);
  --mark:rgba(255,199,0,.30); --mark-cur:rgba(255,170,0,.55);
  --sel:rgba(91,141,255,.33); --line-hl:rgba(91,141,255,.09);
  --code-bg:#1a212a;
  --hl-com:#8b949e; --hl-kw:#ff7b72; --hl-str:#a5d6ff; --hl-num:#79c0ff;
  --hl-typ:#ffa657; --hl-fn:#d2a8ff; --hl-tag:#7ee787; --hl-var:#e3b341;
  --shadow:0 8px 28px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--ui);font-size:14px;background:var(--bg);
  color:var(--fg);overflow:hidden;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
body.dragging{user-select:none;-webkit-user-select:none}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-s{width:13px;height:13px}

#topbar{position:relative;z-index:30;background:var(--panel);
        border-bottom:1px solid var(--border)}
.tb-row{display:flex;align-items:center;gap:3px;padding:6px 10px;flex-wrap:wrap}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 5px;flex:none}
.flex-spacer{flex:1}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;
       color:var(--accent);font-weight:650;font-size:14.5px;letter-spacing:.2px}
.brand .ic{width:21px;height:21px}

.tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;
      border-radius:8px;border:1px solid transparent;background:transparent;
      font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn:active{background:var(--active)}
.tbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;
          width:34px;height:34px;border-radius:8px;border:1px solid transparent;
          background:transparent;cursor:pointer}
.icon-btn:hover{background:var(--hover)}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.primary:hover{filter:brightness(1.08)}

#fmtSelect{height:34px;margin:0 4px 0 0;font-size:13px;font-family:inherit;
           background:var(--field);color:var(--fg);border:1px solid var(--border);
           border-radius:8px;padding:0 6px;outline:none;flex:none;max-width:160px;cursor:pointer}
#fmtSelect:focus{border-color:var(--accent)}

#findBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
         padding:6px 10px;border-top:1px solid var(--border);background:var(--panel)}
.tin{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--field);
     color:var(--fg);padding:0 10px;font-size:13px;outline:none;font-family:inherit}
.tin:focus{border-color:var(--accent)}
#findInput{width:min(260px,42vw)}
#replInput{width:min(220px,36vw)}
.chip{height:30px;min-width:34px;padding:0 8px;border-radius:7px;border:1px solid var(--border);
      background:var(--panel);color:var(--fg-dim);font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
#matchCount{font:600 12.5px var(--mono);min-width:54px;text-align:center;color:var(--fg-dim)}
#matchCount.err{color:var(--danger)}

.popover{position:absolute;top:100%;margin-top:6px;background:var(--panel);
         border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);
         padding:12px;z-index:40;display:flex;flex-direction:column;gap:5px;min-width:238px}
.pop-title{font-size:11px;font-weight:700;text-transform:uppercase;
           letter-spacing:.7px;color:var(--fg-faint);margin-bottom:4px}
.row{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 2px;
     cursor:pointer;user-select:none;-webkit-user-select:none}
.row input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}
.pop-actions{display:flex;justify-content:flex-end;margin-top:8px}

#main{flex:1;display:flex;min-height:0;--split:50%;--sv:55%}
#editorPane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
            background:var(--editor-bg)}
#main.pv #editorPane{flex:0 0 var(--split)}
#divider{flex:0 0 7px;display:none;position:relative;background:var(--bg);
         border-left:1px solid var(--border);border-right:1px solid var(--border);
         cursor:col-resize;touch-action:none}
#main.pv #divider{display:block}
#divider::after{content:"";position:absolute;top:50%;left:50%;width:3px;height:28px;
                transform:translate(-50%,-50%);border-radius:2px;background:var(--border)}
#previewPane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}

#tabs{display:flex;align-items:flex-end;gap:2px;background:var(--panel);
      border-bottom:1px solid var(--border);overflow-x:auto;padding:4px 6px 0;
      scrollbar-width:none;flex:none;min-height:38px}
#tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 11px;
     font-size:13px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--fg-dim);
     white-space:nowrap;max-width:230px;border:1px solid transparent;
     border-bottom:none;position:relative;top:1px}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.active{background:var(--editor-bg);color:var(--fg);border-color:var(--border)}
.tname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tclose{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
        border:none;border-radius:5px;background:transparent;color:inherit;cursor:pointer;flex:none}
.tclose:hover{background:var(--active);color:var(--danger)}
.tadd{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
      margin:0 2px 4px;border:none;border-radius:7px;background:transparent;
      color:var(--fg-dim);cursor:pointer;flex:none}
.tadd:hover{background:var(--hover);color:var(--accent)}

#editorShell{flex:1;display:flex;min-height:0}
#gutter{position:relative;overflow:hidden;flex:none;min-width:40px;background:var(--editor-bg);
        border-right:1px solid var(--border);user-select:none;-webkit-user-select:none}
#gutterInner{padding:12px 10px 12px 0;text-align:right;position:relative;
             font:500 13px/20px var(--mono);color:var(--fg-faint);font-variant-ligatures:none}
#lineNos{margin:0;color:inherit;white-space:pre}
.lmark{position:absolute;left:0;right:0;top:12px;height:20px;pointer-events:none}
#curLineMark{background:var(--line-hl)}
#errLineMark{background:var(--danger-soft);box-shadow:inset 2px 0 0 var(--danger);display:none}

#codeArea{flex:1;position:relative;min-width:0}
#canvas{position:absolute;inset:0;overflow:hidden}
#hlLayer{position:absolute;top:0;left:0;margin:0;padding:12px 16px;min-width:100%;
         width:max-content;pointer-events:none;font:500 13px/20px var(--mono);
         tab-size:2;color:var(--fg);font-variant-ligatures:none}
#hlLayer code{font:inherit;background:none;padding:0}
#app:not(.overlay) #hlLayer{display:none}
#editor{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;
        padding:12px 16px;background:transparent;color:var(--fg);
        caret-color:var(--fg);font:500 13px/20px var(--mono);resize:none;outline:none;
        white-space:pre;overflow:auto;tab-size:2;font-variant-ligatures:none}
#app.overlay #editor{color:transparent;-webkit-text-fill-color:transparent}
#editor::selection{background:var(--sel)}
#editor::-webkit-scrollbar{width:12px;height:12px}
#editor::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;
  border:3px solid transparent;background-clip:content-box}
#editor::-webkit-scrollbar-corner{background:transparent}

.fm{background:var(--mark);border-radius:2px}
.fm-cur{background:var(--mark-cur);outline:1.5px solid var(--accent)}

.hljs{background:transparent;color:inherit}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--hl-com)}
.hljs-comment,.hljs-quote{font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-doctag,.hljs-meta .hljs-keyword,
.hljs-template-tag,.hljs-deletion{color:var(--hl-kw)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-meta .hljs-string{color:var(--hl-str)}
.hljs-number,.hljs-literal,.hljs-link,.hljs-attribute,.hljs-attr{color:var(--hl-num)}
.hljs-type,.hljs-built_in,.hljs-builtin-name,.hljs-title.class_,
.hljs-class .hljs-title{color:var(--hl-typ)}
.hljs-title,.hljs-title.function_,.hljs-function .hljs-title,
.hljs-selector-id,.hljs-selector-class,.hljs-symbol{color:var(--hl-fn)}
.hljs-tag,.hljs-name,.hljs-section{color:var(--hl-tag)}
.hljs-variable,.hljs-template-variable,.hljs-property,
.hljs-selector-attr,.hljs-selector-pseudo{color:var(--hl-var)}
.hljs-emphasis{font-style:italic}
.hljs-strong{font-weight:700}

.fab{position:absolute;right:14px;width:38px;height:38px;border-radius:50%;
     background:var(--panel);border:1px solid var(--border);color:var(--fg-dim);
     box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
     cursor:pointer;opacity:0;visibility:hidden;transform:translateY(6px);
     transition:opacity .18s,transform .18s,visibility .18s;z-index:6}
.fab.vis{opacity:1;visibility:visible;transform:translateY(0)}
.fab:hover{color:var(--accent);border-color:var(--accent)}
.fab:active{transform:scale(.94)}
#fabTop{bottom:60px}
#fabBottom{bottom:14px}

.pv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
         padding:5px 8px 5px 14px;border-bottom:1px solid var(--border);flex:none;
         font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
         color:var(--fg-faint)}
#previewBody{flex:1;overflow:auto;padding:16px 22px 40px}
#previewBody::-webkit-scrollbar{width:10px}
#previewBody::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.prose{font-size:14.5px;line-height:1.65;word-wrap:break-word}
.prose>*:first-child{margin-top:0}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{margin:1.25em 0 .5em;line-height:1.3}
.prose h1{font-size:1.85em}.prose h2{font-size:1.45em}.prose h3{font-size:1.22em}
.prose h4{font-size:1.08em}.prose h5{font-size:1em}.prose h6{font-size:.92em;color:var(--fg-dim)}
.prose h1,.prose h2{padding-bottom:.3em;border-bottom:1px solid var(--border)}
.prose p{margin:.65em 0}
.prose a{color:var(--accent)}
.prose code{font-family:var(--mono);font-size:.87em;background:var(--code-bg);
            padding:.15em .4em;border-radius:5px}
.prose pre{background:var(--code-bg);border:1px solid var(--border);border-radius:9px;
           padding:12px 14px;overflow:auto;margin:.9em 0}
.prose pre code{background:none;padding:0;font-size:.87em}
.prose blockquote{margin:.9em 0;padding:.15em 1em;border-left:3px solid var(--border);
                  color:var(--fg-dim)}
.prose ul,.prose ol{padding-left:1.6em;margin:.6em 0}
.prose li{margin:.22em 0}
.prose table{border-collapse:collapse;margin:.9em 0;display:block;max-width:100%;overflow:auto}
.prose th,.prose td{border:1px solid var(--border);padding:6px 12px}
.prose th{background:var(--hover)}
.prose hr{border:none;border-top:1px solid var(--border);margin:1.5em 0}
.prose img{max-width:100%}
.prose input[type=checkbox]{accent-color:var(--accent);margin-right:.35em}

#statusbar{display:flex;align-items:center;gap:2px;padding:0 8px;height:28px;flex:none;
           background:var(--panel);border-top:1px solid var(--border);
           font-size:12px;color:var(--fg-dim);white-space:nowrap;overflow:hidden}
.sb-item{padding:0 8px;flex:none}
.sb-item.on{color:var(--accent);font-weight:600}

#toast{position:fixed;left:50%;bottom:44px;transform:translate(-50%,10px);opacity:0;
       background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;
       font-size:13px;z-index:99;pointer-events:none;transition:opacity .18s,transform .18s;
       max-width:86vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{background:var(--danger);color:#fff}
#dropOverlay{position:fixed;inset:0;z-index:90;background:rgba(10,15,25,.45);
             display:flex;align-items:center;justify-content:center}
#dropOverlay>div{border:2px dashed var(--accent);border-radius:14px;background:var(--panel);
                 padding:36px 52px;font-size:15px;font-weight:600;color:var(--fg)}

@media (max-width:900px){.brand-name{display:none}}
@media (max-width:760px){
  .tbtn .lbl{display:none}
  .tbtn{padding:0 9px}
  #main.pv{flex-direction:column}
  #main.pv #editorPane{flex:0 0 var(--sv)}
  #previewPane{border-left:none}
  #divider{cursor:row-resize;border:none;border-top:1px solid var(--border);
           border-bottom:1px solid var(--border)}
  #divider::after{width:28px;height:3px}
  #findInput{width:min(200px,46vw)}
  #replInput{width:min(160px,40vw)}
}
@media (max-width:520px){
  .hide-xs{display:none}
  .tb-row{padding:5px 6px;gap:2px}
  .brand{padding-right:2px}
}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-note" viewBox="0 0 24 24">
    <path d="M5 5c0-1.1.9-2 2-2h7l5 5v12c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2z"/>
    <path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 17h4.5"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 24 24">
    <path d="M3.5 6.5c0-1.1.9-2 2-2h4l2 2.5h7c1.1 0 2 .9 2 2v8.5c0 1.1-.9 2-2 2h-13c-1.1 0-2-.9-2-2z"/>
  </symbol>
  <symbol id="i-save" viewBox="0 0 24 24">
    <path d="M12 3.5v10.5"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/>
    <path d="M4 16.5v2c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-2"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M15 5.5V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h.5"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/>
    <path d="M6.5 7l.8 12.2c.05.75.66 1.3 1.4 1.3h6.6c.74 0 1.35-.55 1.4-1.3L17.5 7"/>
    <path d="M10 11v6M14 11v6"/>
  </symbol>
  <symbol id="i-find" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
  </symbol>
  <symbol id="i-sort" viewBox="0 0 24 24">
    <path d="M4 6h10M4 12h7M4 18h5"/><path d="M17 8v11"/><path d="m13.5 15.5 3.5 3.5 3.5-3.5"/>
  </symbol>
  <symbol id="i-braces" viewBox="0 0 24 24">
    <path d="M8.5 3.5c-2 0-3 1.2-3 3v3c0 1.4-.8 2.5-2.5 2.5 1.7 0 2.5 1.1 2.5 2.5v3c0 1.8 1 3 3 3"/>
    <path d="M15.5 3.5c2 0 3 1.2 3 3v3c0 1.4.8 2.5 2.5 2.5-1.7 0-2.5 1.1-2.5 2.5v3c0 1.8-1 3-3 3"/>
  </symbol>
  <symbol id="i-eye" viewBox="0 0 24 24">
    <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/>
    <circle cx="12" cy="12" r="2.8"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a7 7 0 0 0 9.5 9.5Z"/>
  </symbol>
  <symbol id="i-auto" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/>
    <path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
</svg>

<div id="app">

  <header id="topbar">
    <div class="tb-row">
      <div class="brand"><svg class="ic"><use href="#i-note"/></svg><span class="brand-name">Notepad</span></div>
      <span class="tb-sep"></span>
      <select id="fmtSelect" title="Format / language of current tab"></select>
      <span class="tb-sep hide-xs"></span>
      <button id="btnOpen"   class="tbtn" title="Open files (or drop them anywhere)"><svg class="ic"><use href="#i-folder"/></svg><span class="lbl">Open</span></button>
      <button id="btnSave"   class="tbtn" title="Download current tab as file (Ctrl+S)"><svg class="ic"><use href="#i-save"/></svg><span class="lbl">Save</span></button>
      <button id="btnCopy"   class="tbtn" title="Copy entire content"><svg class="ic"><use href="#i-copy"/></svg><span class="lbl">Copy</span></button>
      <button id="btnClear"  class="tbtn" title="Clear all content of this tab"><svg class="ic"><use href="#i-trash"/></svg><span class="lbl">Clear</span></button>
      <span class="tb-sep hide-xs"></span>
      <button id="btnFind"   class="tbtn" title="Find and replace (Ctrl+F)"><svg class="ic"><use href="#i-find"/></svg><span class="lbl">Find</span></button>
      <button id="btnSort"   class="tbtn" title="Sort lines of current tab"><svg class="ic"><use href="#i-sort"/></svg><span class="lbl">Sort</span></button>
      <button id="btnJson"   class="tbtn" hidden title="Validate and pretty-print JSON"><svg class="ic"><use href="#i-braces"/></svg><span class="lbl">Format</span></button>
      <button id="btnMd"     class="tbtn" hidden title="Toggle live markdown preview"><svg class="ic"><use href="#i-eye"/></svg><span class="lbl">Preview</span></button>
      <span class="flex-spacer"></span>
      <button id="btnTheme"  class="icon-btn" title="Theme: auto / light / dark"><svg class="ic"><use id="themeUse" href="#i-auto"/></svg></button>
    </div>

    <div id="findBar" hidden>
      <input id="findInput" class="tin" type="text" placeholder="Find" enterkeyhint="search"
             autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
      <button id="optCase" class="chip" title="Match case">Aa</button>
      <button id="optRe"   class="chip" title="Regular expression">.*</button>
      <span id="matchCount"></span>
      <button id="btnPrev" class="icon-btn" title="Previous match (Shift+Enter)" style="width:30px;height:30px"><svg class="ic ic-s"><use href="#i-up"/></svg></button>
      <button id="btnNext" class="icon-btn" title="Next match (Enter)" style="width:30px;height:30px"><svg class="ic ic-s"><use href="#i-down"/></svg></button>
      <span class="tb-sep hide-xs"></span>
      <input id="replInput" class="tin" type="text" placeholder="Replace with"
             autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
      <button id="btnRepl"    class="tbtn" title="Replace current match">Replace</button>
      <button id="btnReplAll" class="tbtn" title="Replace all matches">All</button>
      <span class="flex-spacer"></span>
      <button id="btnFindClose" class="icon-btn" title="Close (Esc)" style="width:30px;height:30px"><svg class="ic ic-s"><use href="#i-x"/></svg></button>
    </div>

    <div id="sortPop" class="popover" hidden>
      <div class="pop-title">Sort lines</div>
      <label class="row"><input type="checkbox" id="sortNoEmpty"> Remove empty lines</label>
      <label class="row"><input type="checkbox" id="sortCs"> Case sensitive</label>
      <label class="row"><input type="checkbox" id="sortDedupe"> Remove duplicates</label>
      <label class="row"><input type="checkbox" id="sortDesc"> Descending order</label>
      <div class="pop-actions"><button id="sortApply" class="tbtn primary">Apply</button></div>
    </div>
  </header>

  <main id="main">
    <section id="editorPane">
      <div id="tabs" role="tablist"></div>
      <div id="editorShell">
        <div id="gutter"><div id="gutterInner"><div id="curLineMark" class="lmark"></div><div id="errLineMark" class="lmark"></div><div id="lineNos">1</div></div></div>
        <div id="codeArea">
          <div id="canvas">
            <pre id="hlLayer" aria-hidden="true"><code id="hlCode"></code></pre>
            <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off"
                      autocapitalize="off" autocorrect="off" aria-label="Text editor"></textarea>
          </div>
          <button id="fabTop"    class="fab" title="Scroll to top"><svg class="ic"><use href="#i-up"/></svg></button>
          <button id="fabBottom" class="fab" title="Scroll to bottom"><svg class="ic"><use href="#i-down"/></svg></button>
        </div>
      </div>
    </section>

    <div id="divider" title="Drag to resize"></div>

    <aside id="previewPane" hidden>
      <div class="pv-head"><span>Live Preview</span>
        <button id="pvClose" class="icon-btn" title="Close preview" style="width:26px;height:26px"><svg class="ic ic-s"><use href="#i-x"/></svg></button>
      </div>
      <div id="previewBody" class="prose"></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span class="sb-item hide-xs" id="stLang">Plain Text</span>
    <span class="sb-item" id="stPos">Ln 1, Col 1</span>
    <span class="sb-item hide-xs" id="stSel">Sel 0</span>
    <span class="flex-spacer"></span>
    <span class="sb-item" id="stLines">Lines 1</span>
    <span class="sb-item" id="stWords">Words 0</span>
    <span class="sb-item hide-xs" id="stChars">Chars 0</span>
    <span class="sb-item hide-xs" id="stEol">LF</span>
    <span class="sb-item hide-xs" id="stEnc">UTF-8</span>
  </footer>
</div>

<div id="toast" role="status"></div>
<div id="dropOverlay" hidden><div>Drop files to open</div></div>
<input type="file" id="fileInput" multiple style="display:none"

<script>
(function(){
'use strict';

var HAS_HLJS   = (typeof hljs !== 'undefined');
var HAS_MARKED = (typeof marked !== 'undefined');
var HAS_PURIFY = (typeof DOMPurify !== 'undefined');
if(HAS_HLJS && hljs.configure){ try{ hljs.configure({ignoreUnescapedHTML:true}); }catch(e){} }

var LH = 20;
var SYNC_LIMIT   = 25000;
var NATIVE_LIMIT = 60000;
var MAX_MATCHES  = 5000;

var FORMATS = {
  plaintext:{label:'Plain Text', ext:['txt'],              hl:null},
  json:     {label:'JSON',       ext:['json'],             hl:'json'},
  markdown: {label:'Markdown',   ext:['md','markdown'],    hl:'markdown'},
  ini:      {label:'INI',        ext:['ini','cfg','conf','toml'], hl:'ini'},
  yaml:     {label:'YAML',       ext:['yaml','yml'],       hl:'yaml'},
  xml:      {label:'XML',        ext:['xml'],              hl:'xml'},
  html:     {label:'HTML',       ext:['html','htm','svg'], hl:'xml'},
  c:        {label:'C',          ext:['c','h'],            hl:'c'},
  cpp:      {label:'C++',        ext:['cpp','cc','cxx','hpp','hh'], hl:'cpp'},
  csharp:   {label:'C#',         ext:['cs'],               hl:'csharp'},
  dart:     {label:'Dart',       ext:['dart'],             hl:'dart'},
  go:       {label:'Go',         ext:['go'],               hl:'go'},
  java:     {label:'Java',       ext:['java'],             hl:'java'},
  lua:      {label:'Lua',        ext:['lua'],              hl:'lua'},
  matlab:   {label:'MATLAB',     ext:['m'],                hl:'matlab'},
  php:      {label:'PHP',        ext:['php'],              hl:'php'},
  ruby:     {label:'Ruby',       ext:['rb'],               hl:'ruby'},
  python:   {label:'Python',     ext:['py'],               hl:'python'},
  rust:     {label:'Rust',       ext:['rs'],               hl:'rust'},
  sql:      {label:'SQL',        ext:['sql'],              hl:'sql'},
  typescript:{label:'TypeScript',ext:['ts','tsx'],         hl:'typescript'}
};

var state = {
  tabs:[], cur:-1,
  mode:'auto',
  previewOpen:false,
  split:50,
  errLine:0,
  findOpen:false, q:'', cs:false, re:false,
  matches:[], mi:-1,
  overlayBroken:false
};
var nameSeq={};

function $(id){ return document.getElementById(id); }
var app=$('app'),
    ta=$('editor'), hlCode=$('hlCode'), hlLayer=$('hlLayer'),
    gutter=$('gutter'), gutterInner=$('gutterInner'), lineNos=$('lineNos'),
    curMark=$('curLineMark'), errMark=$('errLineMark'),
    tabsEl=$('tabs'), mainEl=$('main'), divider=$('divider'),
    previewPane=$('previewPane'), previewBody=$('previewBody'),
    fmtSel=$('fmtSelect'), stLang=$('stLang'),
    stPos=$('stPos'), stSel=$('stSel'), stLines=$('stLines'),
    stWords=$('stWords'), stChars=$('stChars'),
    btnJson=$('btnJson'), btnMd=$('btnMd'), btnFind=$('btnFind'), btnSort=$('btnSort'),
    findBar=$('findBar'), findInput=$('findInput'), replInput=$('replInput'),
    optCase=$('optCase'), optRe=$('optRe'), matchCount=$('matchCount'),
    sortPop=$('sortPop'), toastEl=$('toast'), dropOverlay=$('dropOverlay'),
    fileInput=$('fileInput'), themeUse=$('themeUse'),
    fabTop=$('fabTop'), fabBottom=$('fabBottom');

function esc(s){
  return s.replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function debounce(fn,ms){
  var t=null;
  return function(){ var a=arguments; clearTimeout(t);
    t=setTimeout(function(){ fn.apply(null,a); },ms); };
}
var toastTimer=null;
function toast(msg,isErr){
  toastEl.textContent=msg;
  toastEl.className='show'+(isErr?' error':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toastEl.className=''; },2400);
}
function countWords(v){
  var n=0,inW=false,i,c;
  for(i=0;i<v.length;i++){
    c=v.charCodeAt(i);
    if(c===32||c===9||c===10||c===13||c===11||c===12){ inW=false; }
    else if(!inW){ inW=true; n++; }
  }
  return n;
}
function lineCount(){ var v=ta.value; return v===''?1:v.split('\n').length; }
function countNL(v,off){ var l=0,i; for(i=0;i<off;i++){ if(v.charCodeAt(i)===10)l++; } return l; }

function measureCharW(){
  try{
    var cs=getComputedStyle(ta),s=document.createElement('span');
    s.textContent='MMMMMMMMMM';
    s.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';
    s.style.fontFamily=cs.fontFamily; s.style.fontSize=cs.fontSize;
    s.style.fontWeight=cs.fontWeight; s.style.lineHeight=cs.lineHeight;
    document.body.appendChild(s);
    var w=s.getBoundingClientRect().width/10;
    if(s.parentNode)s.parentNode.removeChild(s);
    return (w>2&&w<30)?w:7.8;
  }catch(e){ return 7.8; }
}
var CHAR_W=measureCharW();

Object.keys(FORMATS).forEach(function(k){
  var o=document.createElement('option');
  o.value=k; o.textContent=FORMATS[k].label;
  fmtSel.appendChild(o);
});
fmtSel.addEventListener('change',function(){
  var t=tab(); if(!t)return;
  t.fmt=fmtSel.value; state.errLine=0; errMark.style.display='none';
  syncFormatUI(); refreshEditorChrome(true); renderPreviewSoon();
});

function tab(){ return state.tabs[state.cur]; }
function fmt(){ var t=tab(); return t?t.fmt:'plaintext'; }
function uniqueName(f){
  f=(f&&FORMATS[f])?f:'plaintext';
  nameSeq[f]=(nameSeq[f]||0)+1;
  return f+'-'+nameSeq[f]+'.'+FORMATS[f].ext[0];
}

function commitCurrent(){
  var t=tab(); if(!t)return;
  t.content=ta.value; t.scroll={t:ta.scrollTop,l:ta.scrollLeft};
}
function addTab(name,f,content){
  f=f||'plaintext';
  state.tabs.push({name:name||uniqueName(f),fmt:f,content:content||'',scroll:{t:0,l:0}});
  switchTab(state.tabs.length-1);
}
function switchTab(i){
  if(state.cur===i){ renderTabs(); return; }
  commitCurrent();
  state.cur=i; state.errLine=0; errMark.style.display='none';
  var t=state.tabs[i];
  ta.value=t.content||'';
  document.title=(t.name||'Untitled')+' - Notepad';
  renderTabs(); syncFormatUI(); refreshEditorChrome(true);
  requestAnimationFrame(function(){
    ta.scrollTop=t.scroll.t||0; ta.scrollLeft=t.scroll.l||0;
    syncScroll(); updateCursor();
  });
}
function closeTab(i){
  var t=state.tabs[i]; if(!t)return;
  var len=(i===state.cur)?ta.value.length:(t.content||'').length;
  if(len>0 && !confirm('Close tab "'+t.name+'"? Its content is not saved anywhere.'))return;
  state.tabs.splice(i,1);
  if(state.cur===i){
    state.cur=-1;
    if(!state.tabs.length){ addTab('',fmt(),''); }
    else{ switchTab(Math.min(i,state.tabs.length-1)); }
  }else{
    if(i<state.cur)state.cur--;
    renderTabs();
  }
}
function renderTabs(){
  tabsEl.textContent='';
  state.tabs.forEach(function(t,i){
    var el=document.createElement('div');
    el.className='tab'+(i===state.cur?' active':'');
    el.setAttribute('role','tab');
    el.title=t.name+' (double-click to rename)';
    var nm=document.createElement('span'); nm.className='tname'; nm.textContent=t.name;
    var x=document.createElement('button'); x.className='tclose'; x.type='button';
    x.setAttribute('aria-label','Close tab');
    x.innerHTML='<svg class="ic ic-s"><use href="#i-x"/></svg>';
    el.appendChild(nm); el.appendChild(x);
    el.addEventListener('click',function(){ switchTab(i); });
    el.addEventListener('dblclick',function(){
      var n=prompt('Rename tab:',t.name);
      if(n&&n.trim()){ t.name=n.trim();
        if(i===state.cur)document.title=t.name+' - Notepad';
        renderTabs(); }
    });
    el.addEventListener('auxclick',function(ev){ if(ev.button===1)closeTab(i); });
    x.addEventListener('click',function(ev){ ev.stopPropagation(); closeTab(i); });
    tabsEl.appendChild(el);
  });
  var add=document.createElement('button');
  add.className='tadd'; add.type='button'; add.title='New tab (inherits current format)';
  add.innerHTML='<svg class="ic ic-s"><use href="#i-plus"/></svg>';
  add.addEventListener('click',function(){ addTab('',fmt(),''); ta.focus(); });
  tabsEl.appendChild(add);
}

var gutterLines=-1, gutterDigits=0;
function renderGutter(){
  var n=lineCount();
  if(n!==gutterLines){
    gutterLines=n;
    var parts=new Array(n),i;
    for(i=0;i<n;i++)parts[i]=i+1;
    lineNos.textContent=parts.join('\n');
    var d=String(n).length;
    if(d!==gutterDigits){
      gutterDigits=d;
      gutter.style.width=Math.max(46,Math.round(d*CHAR_W)+24)+'px';
    }
  }
  positionMarks();
}
function currentLine(){
  var p=ta.selectionStart,v=ta.value,l=1,i;
  for(i=0;i<p;i++){ if(v.charCodeAt(i)===10)l++; }
  return l;
}
function positionMarks(){
  curMark.style.transform='translateY('+((currentLine()-1)*LH)+'px)';
  errMark.style.transform='translateY('+((state.errLine-1)*LH)+'px)';
  errMark.style.display=state.errLine>0?'block':'none';
}

function langId(){
  var f=FORMATS[fmt()];
  return (f&&f.hl)?f.hl:null;
}
function overlayUsable(){
  if(state.overlayBroken)return false;
  if(ta.value.length>NATIVE_LIMIT)return false;
  var id=langId();
  var langOk=!!(id&&HAS_HLJS&&hljs.getLanguage&&hljs.getLanguage(id));
  var findNeed=state.findOpen&&!!state.q;
  return langOk||findNeed;
}
function updateLangStatus(){
  if(!stLang)return;
  var f=FORMATS[fmt()];
  var on=overlayUsable();
  stLang.textContent=(f?f.label:'Plain Text')+(on?': syntax on':'');
  stLang.classList.toggle('on',on);
}
function applyOverlayMode(){
  var on=overlayUsable();
  if(app.classList.contains('overlay')!==on)app.classList.toggle('overlay',on);
  updateLangStatus();
  return on;
}
function hlSafe(s,id){
  try{ return hljs.highlight(s,{language:id,ignoreIllegals:true}).value; }
  catch(e){ return esc(s); }
}
function buildHTML(v){
  var id=langId(),ok=id&&HAS_HLJS&&hljs.getLanguage&&hljs.getLanguage(id);
  var ms=(state.findOpen&&state.q)?state.matches:null;
  var seg=function(s){ return ok?hlSafe(s,id):esc(s); };
  if(!ms||!ms.length)return seg(v)+'\n';
  var out='',pos=0,i,s,e;
  for(i=0;i<ms.length;i++){
    s=ms[i][0]; e=ms[i][1];
    if(s>pos)out+=seg(v.slice(pos,s));
    out+='<span class="fm'+(i===state.mi?' fm-cur':'')+'">'+esc(v.slice(s,e))+'</span>';
    pos=e;
  }
  if(pos<v.length)out+=seg(v.slice(pos));
  return out+'\n';
}
function renderLayer(){
  if(!applyOverlayMode())return;
  try{ hlCode.innerHTML=buildHTML(ta.value); }
  catch(e){
    state.overlayBroken=true;
    app.classList.remove('overlay');
    updateLangStatus();
    console.warn('[Notepad] highlight overlay disabled after error:',e);
    toast('Syntax coloring disabled (renderer error)',true);
  }
  syncScroll();
}
var scheduleRender=debounce(renderLayer,180);

function onEditLight(){
  if(state.errLine)state.errLine=0;
  renderGutter(); updateStats();
}
function refreshEditorChrome(immediateLayer){
  onEditLight();
  if(immediateLayer)renderLayer(); else scheduleRender();
  refreshFindSoon(); renderPreviewSoon(); updateCursor();
}
function syncScroll(){
  var t=ta.scrollTop,l=ta.scrollLeft;
  hlLayer.style.transform='translate('+(-l)+'px,'+(-t)+'px)';
  gutterInner.style.transform='translateY('+(-t)+'px)';
  updateFabs();
}

function updateStats(){
  var v=ta.value;
  stLines.textContent='Lines '+lineCount();
  stWords.textContent='Words '+countWords(v);
  stChars.textContent='Chars '+v.length;
}
function updateCursor(){
  var p=ta.selectionStart,v=ta.value,nl=v.lastIndexOf('\n',p-1);
  stPos.textContent='Ln '+(countNL(v,p)+1)+', Col '+(p-nl);
  stSel.textContent='Sel '+(ta.selectionEnd-p);
  positionMarks();
}

function updateFabs(){
  var over=ta.scrollHeight>ta.clientHeight+LH*2;
  fabTop.classList.toggle('vis',over&&ta.scrollTop>LH*2);
  fabBottom.classList.toggle('vis',over&&(ta.scrollTop+ta.clientHeight<ta.scrollHeight-LH*2));
}
fabTop.addEventListener('click',function(){ ta.scrollTo({top:0,behavior:'smooth'}); });
fabBottom.addEventListener('click',function(){ ta.scrollTo({top:ta.scrollHeight,behavior:'smooth'}); });

function collectMatches(){
  var v=ta.value,q=state.q,i;
  state.matches=[]; state.mi=-1;
  if(!state.findOpen||!q)return;
  if(state.re){
    var rx;
    try{ rx=new RegExp(q,(state.cs?'':'i')+'gm'); }
    catch(e){ matchCount.textContent='bad regex'; matchCount.classList.add('err'); return; }
    matchCount.classList.remove('err');
    var m;
    while((m=rx.exec(v))){
      if(m[0].length===0){ rx.lastIndex++; continue; }
      state.matches.push([m.index,m.index+m[0].length]);
      if(state.matches.length>=MAX_MATCHES)break;
    }
  }else{
    var hay=state.cs?v:v.toLowerCase(), needle=state.cs?q:q.toLowerCase();
    i=0;
    while((i=hay.indexOf(needle,i))!==-1){
      state.matches.push([i,i+needle.length]);
      i+=needle.length;
      if(state.matches.length>=MAX_MATCHES)break;
    }
  }
}
function updateMatchLabel(){
  if(!state.findOpen)return;
  if(!state.q){ matchCount.textContent=''; return; }
  if(!state.matches.length){ matchCount.textContent='0/0'; return; }
  var capped=state.matches.length>=MAX_MATCHES;
  matchCount.textContent=(state.mi+1)+'/'+state.matches.length+(capped?'+':'');
}
function revealMatch(select){
  var m=state.matches[state.mi]; if(!m)return;
  var lineIdx=countNL(ta.value,m[0]);
  ta.scrollTop=Math.max(0,lineIdx*LH-ta.clientHeight/3);
  syncScroll();
  if(select){ ta.focus(); ta.setSelectionRange(m[0],m[1]); }
}
function runFind(rerender){
  applyOverlayMode();
  collectMatches();
  if(state.q&&state.matches.length){
    if(state.mi<0)state.mi=0;
    state.mi=clamp(state.mi,0,state.matches.length-1);
  }else state.mi=-1;
  updateMatchLabel();
  if(rerender!==false)renderLayer();
  if(state.mi>=0)revealMatch(false);
}
var refreshFindSoon=debounce(function(){ if(state.findOpen&&state.q)runFind(false); },220);
function nav(d){
  if(!state.findOpen||!state.matches.length)return;
  state.mi=(state.mi+d+state.matches.length)%state.matches.length;
  updateMatchLabel(); renderLayer(); revealMatch(true);
}
function openFind(){
  state.findOpen=true; findBar.hidden=false; btnFind.classList.add('on');
  findInput.value=state.q;
  runFind(false);
  findInput.focus(); findInput.select();
}
function closeFind(){
  state.findOpen=false; findBar.hidden=true; btnFind.classList.remove('on');
  state.matches=[]; state.mi=-1; matchCount.textContent='';
  applyOverlayMode(); renderLayer();
}
function replaceOne(){
  if(!state.findOpen)return;
  var m=state.matches[state.mi];
  if(!m){ nav(1); return; }
  var rep=replInput.value, keep=m[0]+rep.length;
  ta.value=ta.value.slice(0,m[0])+rep+ta.value.slice(m[1]);
  onEditLight(); renderLayer(); runFind(false);
  var best=-1,i;
  for(i=0;i<state.matches.length;i++){
    if(state.matches[i][0]>=keep-1){ best=i; break; }
  }
  state.mi=best;
  if(state.mi<0&&state.matches.length)state.mi=state.matches.length-1;
  updateMatchLabel(); renderLayer();
  if(state.mi>=0)revealMatch(false);
  toast('Replaced 1 occurrence');
}
function replaceAll(){
  if(!state.findOpen)return;
  var n=state.matches.length;
  if(!n){ toast('Nothing to replace'); return; }
  var rep=replInput.value,v=ta.value,out='',pos=0,i;
  for(i=0;i<n;i++){ out+=v.slice(pos,state.matches[i][0])+rep; pos=state.matches[i][1]; }
  out+=v.slice(pos);
  ta.value=out;
  refreshEditorChrome(true); runFind(false);
  toast('Replaced '+n+' occurrence'+(n>1?'s':''));
}
findInput.addEventListener('input',debounce(function(){
  state.q=findInput.value; state.mi=-1; runFind(true);
},110));
findInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); nav(e.shiftKey?-1:1); }
});
replInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); replaceOne(); }
});
optCase.addEventListener('click',function(){
  state.cs=!state.cs; optCase.classList.toggle('on',state.cs); state.mi=-1; runFind(true);
});
optRe.addEventListener('click',function(){
  state.re=!state.re; optRe.classList.toggle('on',state.re); state.mi=-1; runFind(true);
});
$('btnPrev').addEventListener('click',function(){ nav(-1); });
$('btnNext').addEventListener('click',function(){ nav(1); });
$('btnRepl').addEventListener('click',replaceOne);
$('btnReplAll').addEventListener('click',replaceAll);
$('btnFindClose').addEventListener('click',closeFind);
btnFind.addEventListener('click',function(){
  if(state.findOpen)closeFind(); else openFind();
});

btnSort.addEventListener('click',function(e){
  e.stopPropagation();
  sortPop.hidden=!sortPop.hidden;
  if(!sortPop.hidden){
    sortPop.style.left=clamp(btnSort.offsetLeft,4,
      (sortPop.offsetParent?sortPop.offsetParent.clientWidth:400)-250)+'px';
  }
});
document.addEventListener('pointerdown',function(e){
  if(sortPop.hidden)return;
  if(sortPop.contains(e.target)||btnSort.contains(e.target))return;
  sortPop.hidden=true;
});
$('sortApply').addEventListener('click',function(){
  var desc=$('sortDesc').checked, cs=$('sortCs').checked,
      dedupe=$('sortDedupe').checked, noEmpty=$('sortNoEmpty').checked;
  var lines=ta.value.split('\n'),i;
  if(noEmpty){
    var kept=[];
    for(i=0;i<lines.length;i++){ if(lines[i].trim().length>0)kept.push(lines[i]); }
    lines=kept;
  }
  var cmp=cs
    ?function(a,b){ return a<b?-1:(a>b?1:0); }
    :function(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); return a<b?-1:(a>b?1:0); };
  lines.sort(cmp);
  if(desc)lines.reverse();
  if(dedupe){
    var seen=Object.create(null),out=[];
    for(i=0;i<lines.length;i++){
      var k=cs?lines[i]:lines[i].toLowerCase();
      if(seen[k])continue;
      seen[k]=true; out.push(lines[i]);
    }
    lines=out;
  }
  replaceWhole(lines.join('\n'));
  sortPop.hidden=true;
  toast('Sorted '+(desc?'descending':'ascending')
       +(dedupe?', duplicates removed':'')
       +(noEmpty?', empty lines removed':''));
});

function replaceWhole(text){
  try{ ta.focus(); ta.setRangeText(text,0,ta.value.length,'end'); }
  catch(e){ ta.value=text; }
  refreshEditorChrome(true);
}

function jsonErrLine(msg){
  msg=msg||'';
  var m=/position\s+(\d+)/i.exec(msg);
  if(m){
    var off=parseInt(m[1],10),v=ta.value,line=1,i;
    for(i=0;i<off&&i<v.length;i++){ if(v.charCodeAt(i)===10)line++; }
    return line;
  }
  m=/\bline\s+(\d+)/i.exec(msg);
  return m?parseInt(m[1],10):0;
}
function formatJSON(){
  var v=ta.value;
  if(!v.trim()){ toast('Nothing to format',true); return; }
  try{
    var obj=JSON.parse(v);
    replaceWhole(JSON.stringify(obj,null,2));
    toast('JSON formatted');
  }catch(e){
    var line=jsonErrLine(e.message);
    if(line>0){
      state.errLine=line; positionMarks();
      ta.scrollTop=Math.max(0,(line-1)*LH-Math.floor(ta.clientHeight/2));
      syncScroll();
      toast('Invalid JSON at line '+line,true);
    }else{
      toast('Invalid JSON: '+e.message,true);
    }
  }
}
btnJson.addEventListener('click',formatJSON);

var renderPreviewSoon=debounce(renderPreview,150);
function setPreview(on){
  state.previewOpen=on;
  mainEl.classList.toggle('pv',on);
  previewPane.hidden=!on;
  btnMd.classList.toggle('on',on);
  if(on){ applySplit(); renderPreview(); }
}
btnMd.addEventListener('click',function(){ setPreview(!state.previewOpen); });
$('pvClose').addEventListener('click',function(){ setPreview(false); });
function renderPreview(){
  if(!state.previewOpen)return;
  var src=ta.value,html='';
  if(HAS_MARKED){
    try{
      var api=window.marked;
      var parse=api.parse?api.parse.bind(api):(typeof api==='function'?api:null);
      if(parse){
        var r=parse(src);
        if(r&&typeof r.then==='function'){
          r.then(function(done){ previewBody.innerHTML=sanitizeHtml(done); linkify(); },
                 function(err){ previewBody.innerHTML='<p><em>Preview error.</em></p>'; });
          return;
        }
        html=r;
      }
    }catch(e){
      html='<p><em>Preview error.</em></p>';
    }
  }else{
    html='<p><em>marked.js is not loaded - showing raw text.</em></p><pre>'+esc(src)+'</pre>';
  }
  previewBody.innerHTML=sanitizeHtml(html);
  linkify();
}
function sanitizeHtml(html){
  if(HAS_PURIFY){
    try{ return DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}); }catch(e){}
  }
  return html;
}
function linkify(){
  var as=previewBody.querySelectorAll('a[href]'),i;
  for(i=0;i<as.length;i++){ as[i].target='_blank'; as[i].rel='noopener noreferrer'; }
  if(HAS_HLJS){
    var bs=previewBody.querySelectorAll('pre code');
    for(i=0;i<bs.length;i++){
      if(bs[i].getAttribute('data-hl'))continue;
      try{ hljs.highlightElement(bs[i]); bs[i].setAttribute('data-hl','1'); }catch(e){}
    }
  }
}

function applySplit(){ mainEl.style.setProperty('--split',state.split+'%'); }
var dragging=false;
divider.addEventListener('pointerdown',function(e){
  dragging=true; divider.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});
window.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var r=mainEl.getBoundingClientRect();
  if(window.innerWidth<=760){
    var pv=(e.clientY-r.top)/r.height*100;
    state.split=clamp(pv,25,75);
    mainEl.style.setProperty('--sv',state.split+'%');
  }else{
    var ph=(e.clientX-r.left)/r.width*100;
    state.split=clamp(ph,20,85);
    applySplit();
  }
});
window.addEventListener('pointerup',function(){
  dragging=false; document.body.classList.remove('dragging');
});

var mqDark=window.matchMedia('(prefers-color-scheme: dark)');
function applyMode(){
  var dark=state.mode==='dark'||(state.mode==='auto'&&mqDark.matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  document.documentElement.setAttribute('data-mode',state.mode);
  themeUse.setAttribute('href','#i-'+({auto:'auto',light:'sun',dark:'moon'})[state.mode]);
}
$('btnTheme').addEventListener('click',function(){
  state.mode=state.mode==='auto'?'light':(state.mode==='light'?'dark':'auto');
  applyMode();
  toast('Theme: '+state.mode);
});
function onSchemeChange(){ if(state.mode==='auto')applyMode(); }
if(mqDark.addEventListener)mqDark.addEventListener('change',onSchemeChange);
else if(mqDark.addListener)mqDark.addListener(onSchemeChange);

function copyAll(){
  var v=ta.value;
  if(!v.length){ toast('Nothing to copy'); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(
      function(){ toast('Copied '+v.length+' characters'); },
      function(){ fallbackCopy(v); }
    );
  }else fallbackCopy(v);
}
function fallbackCopy(v){
  var done=false;
  try{ ta.focus(); ta.select(); done=document.execCommand&&document.execCommand('copy'); }catch(e){}
  toast(done?'Copied':'Copy failed',!done);
}
$('btnCopy').addEventListener('click',copyAll);

$('btnClear').addEventListener('click',function(){
  if(!ta.value.length){ toast('Already empty'); return; }
  if(!confirm('Clear all content of this tab?'))return;
  replaceWhole('');
  ta.focus(); toast('Cleared');
});
function saveTab(){
  var t=tab(); if(!t)return;
  var ext=FORMATS[t.fmt]?FORMATS[t.fmt].ext[0]:'txt';
  var name=t.name||('untitled.'+ext);
  if(name.toLowerCase().indexOf('.'+ext)!==name.length-ext.length-1)name+='.'+ext;
  var blob=new Blob([ta.value],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
  toast('Saved as '+name);
}
$('btnSave').addEventListener('click',saveTab);

$('btnOpen').addEventListener('click',function(){ fileInput.click(); });
fileInput.addEventListener('change',function(){
  if(fileInput.files&&fileInput.files.length)openFiles(fileInput.files);
  fileInput.value='';
});
function detectFmt(name){
  var i=name.lastIndexOf('.');
  if(i<0)return 'plaintext';
  var ext=name.slice(i+1).toLowerCase(),k;
  for(k in FORMATS){ if(FORMATS[k].ext.indexOf(ext)!==-1)return k; }
  return 'plaintext';
}
function openFiles(files){
  var list=Array.prototype.slice.call(files),chain=Promise.resolve();
  list.forEach(function(f){
    chain=chain.then(function(){
      return f.text().then(function(text){
        if(text.split('\u0000').length-1>3){
          toast('"'+f.name+'" looks binary, opened as text anyway',true);
        }
        addTab(f.name,detectFmt(f.name),text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n'));
      },function(){ toast('Failed to read "'+f.name+'"',true); });
    });
  });
  chain.then(function(){
    if(list.length)toast(list.length+' file'+(list.length>1?'s':'')+' opened');
  });
}
var dragDepth=0;
window.addEventListener('dragenter',function(e){ e.preventDefault(); dragDepth++; dropOverlay.hidden=false; });
window.addEventListener('dragover',function(e){ e.preventDefault(); });
window.addEventListener('dragleave',function(e){
  e.preventDefault(); dragDepth=Math.max(0,dragDepth-1);
  if(!dragDepth)dropOverlay.hidden=true;
});
window.addEventListener('drop',function(e){
  e.preventDefault(); dragDepth=0; dropOverlay.hidden=true;
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)openFiles(e.dataTransfer.files);
});

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='f'){ e.preventDefault(); openFind(); }
  else if(mod&&k==='s'){ e.preventDefault(); saveTab(); }
  else if(e.key==='Escape'){
    if(!sortPop.hidden){ sortPop.hidden=true; }
    else if(state.findOpen&&findBar.contains(document.activeElement)){ closeFind(); }
  }
});
ta.addEventListener('keydown',function(e){
  if(e.key==='Tab'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){
    e.preventDefault();
    ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');
    onEditLight(); scheduleRender(); refreshFindSoon();
  }
});

var composing=false;
ta.addEventListener('compositionstart',function(){ composing=true; });
ta.addEventListener('compositionend',function(){
  composing=false;
  onEditLight(); renderLayer(); refreshFindSoon(); renderPreviewSoon();
});

ta.addEventListener('input',function(){
  if(composing)return;
  onEditLight();
  if(ta.value.length<=SYNC_LIMIT)renderLayer();
  else if(ta.value.length<=NATIVE_LIMIT)scheduleRender();
  else applyOverlayMode();
  refreshFindSoon(); renderPreviewSoon();
});
ta.addEventListener('scroll',syncScroll,{passive:true});
ta.addEventListener('keyup',updateCursor);
ta.addEventListener('click',updateCursor);
document.addEventListener('selectionchange',function(){
  if(document.activeElement===ta)updateCursor();
});

var remeasureSoon=debounce(function(){
  var w=measureCharW();
  if(w&&Math.abs(w-CHAR_W)>0.05)CHAR_W=w;
  gutterLines=-1; gutterDigits=0;
  renderGutter();
},180);
window.addEventListener('resize',function(){
  updateFabs(); sortPop.hidden=true; remeasureSoon();
});
if(document.fonts&&document.fonts.ready&&document.fonts.ready.then){
  document.fonts.ready.then(function(){ remeasureSoon(); });
}

function syncFormatUI(){
  var f=fmt();
  fmtSel.value=f;
  btnJson.hidden=(f!=='json');
  var isMd=(f==='markdown');
  btnMd.hidden=!isMd;
  if(!isMd&&state.previewOpen)setPreview(false);
}

applyMode();
addTab('','markdown','');
renderGutter(); renderLayer(); updateStats(); updateCursor();

console.info('[Notepad] ready | hljs:'+(HAS_HLJS?'y':'n')
            +' marked:'+(HAS_MARKED?'y':'n')
            +' purify:'+(HAS_PURIFY?'y':'n')
            +' | charW='+CHAR_W.toFixed(2));

})();
</script>
</body>
</html>
