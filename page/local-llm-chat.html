<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>local-llm-chat</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body { height: 100%; }
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --panel2: #eceef1;
  --text: #181a1d;
  --muted: #5f6672;
  --border: #dde1e6;
  --border2: #cbd0d6;
  --acc: #2563eb;
  --acc-soft: #e8effd;
  --acc2: #7c3aed;
  --acc2-soft: #f3edfd;
  --code-bg: #f3f4f6;
  --code-head: #e9ebef;
  --danger: #dc2626;
  --warn: #b45309;
  --ok: #15803d;
  --shadow: 0 1px 3px rgba(15,20,30,.08);
  --radius: 12px;
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"] {
  --bg: #0f1114;
  --panel: #171a1f;
  --panel2: #20242b;
  --text: #e6e8eb;
  --muted: #98a0aa;
  --border: #2a2f37;
  --border2: #3a4048;
  --acc: #5b96f7;
  --acc-soft: #17233a;
  --acc2: #a78bfa;
  --acc2-soft: #241d38;
  --code-bg: #10131a;
  --code-head: #181c24;
  --danger: #f87171;
  --warn: #fbbf24;
  --ok: #4ade80;
  --shadow: 0 1px 4px rgba(0,0,0,.4);
}
body {
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
button, .cvi { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
.hidden { display: none !important; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
#shell { display: flex; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
#sidebar {
  width: 280px;
  flex: 0 0 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: margin-left .2s ease;
  z-index: 120;
  min-height: 0;
}
body.sb-collapsed #sidebar { margin-left: -281px; }
.sb-head { display: flex; align-items: center; gap: 9px; padding: 12px 12px 6px; flex: 0 0 auto; }
.logo-slot { display: inline-flex; color: var(--acc); }
.sb-brand { font-weight: 650; font-size: 15px; letter-spacing: .2px; white-space: nowrap; }
.sb-head .ibtn { margin-left: auto; }
.sb-actions { display: flex; gap: 8px; padding: 6px 12px 8px; flex: 0 0 auto; }
.sb-actions .btn { flex: 1; justify-content: center; padding: 8px 8px; font-size: 12.5px; }
.sb-search { padding: 0 12px 8px; flex: 0 0 auto; }
.search-wrap { position: relative; }
.search-wrap input, .dd-search input, .rowflex input, .field input, .field textarea {
  width: 100%;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--text);
  border-radius: 9px;
  padding: 8px 10px;
  font: inherit;
  font-size: 13px;
}
.search-wrap input:focus, .dd-search input:focus, .rowflex input:focus, .field input:focus, .field textarea:focus { outline: none; border-color: var(--acc); }
.search-wrap input { padding: 7px 32px 7px 10px; font-size: 12.5px; }
.search-wrap .search-clear {
  position: absolute;
  right: 5px;
  top: calc(50% - 12px);
  width: 24px;
  height: 24px;
  border-radius: 7px;
}
.search-wrap .search-clear:active { transform: none; }
.sb-list { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.sb-empty { padding: 16px 10px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
.cvi {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.cvi:hover { background: var(--panel2); }
.cvi.active { background: var(--acc-soft); }
.cv-ic { color: var(--muted); display: inline-flex; flex: 0 0 auto; }
.cvi.active .cv-ic { color: var(--acc); }
.cv-main { flex: 1; min-width: 0; }
.cv-t { font-size: 12.8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-sub { font-size: 10.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; flex: 0 0 auto; }
.cvi:hover .cv-acts, .cvi:focus-within .cv-acts { opacity: 1; }
.sb-foot { border-top: 1px solid var(--border); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
.sb-fbtn {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  background: none;
  border-radius: 9px;
  color: var(--text);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  text-align: left;
}
.sb-fbtn:hover { background: var(--panel2); }
.sb-fi { display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: 0 0 auto; }
.sb-count { font-size: 10.5px; color: var(--muted); font-family: var(--mono); padding: 4px 10px 0; }
#scrim { display: none; }
#mainCol { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  position: relative;
  display: flex;
  align-items: center;
  padding: 8px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex: 0 0 auto;
}
.top-spacer { flex: 1; }
#modelPick { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 60; display: flex; align-items: center; gap: 8px; }
.mp-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  max-width: min(430px,44vw);
  padding: 0 11px;
  border: 1px solid var(--border2);
  border-radius: 9px;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12.5px;
  transition: border-color .15s,color .15s;
}
.mp-btn:hover { border-color: var(--acc); color: var(--acc); }
.mp-btn .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-btn.open { border-color: var(--acc); color: var(--acc); }
.chev { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--muted); transition: transform .18s; }
.mp-btn.open .chev, .reasoning.open .chev { transform: rotate(180deg); }
.field .mp-btn { width: 100%; max-width: none; justify-content: flex-start; }
.field .mp-btn .lb { flex: 1; text-align: left; }
.dd-panel {
  position: fixed;
  z-index: 500;
  min-width: 140px;
  max-width: calc(100vw - 16px);
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 11px;
  box-shadow: 0 12px 36px rgba(0,0,0,.3);
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dd-list { max-height: min(320px,46vh); overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.dd-item, .ml-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 7px 11px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dd-item:last-child { border-bottom: none; }
.dd-item:hover, .ml-item:hover { background: var(--panel2); }
.dd-item.sel, .ml-item.active { color: var(--acc); font-weight: 600; background: var(--acc-soft); }
.dd-item.active { background: var(--panel2); box-shadow: inset 2px 0 0 var(--acc); }
.dd-item.custom { color: var(--acc2); }
.dd-empty { padding: 14px 10px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
.ibtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .15s,color .15s;
  flex: 0 0 auto;
}
.ibtn:hover { background: var(--panel2); color: var(--text); }
.ibtn:active { transform: translateY(1px); }
.ibtn.small { width: 26px; height: 26px; border-radius: 7px; }
.ibtn.primary { background: var(--acc); color: #fff; width: 38px; height: 38px; border-radius: 11px; }
.ibtn.primary:hover { background: var(--acc); color: #fff; filter: brightness(1.08); }
.ibtn.primary.stop { background: var(--danger); }
#chat { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 10px; width: 100%; max-width: 880px; margin: 0 auto; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--muted); flex: 0 0 auto; margin-top: 2px; }
.msg.assistant .avatar { background: var(--acc-soft); color: var(--acc); }
.bwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.msg-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.statline { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6; }
.seg { background: var(--panel2); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.seg b { font-weight: 700; color: var(--text); }
.seg.warn { color: var(--warn); }
.seg.bad { color: var(--danger); }
.content { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); overflow-wrap: break-word; }
.msg.user .content { background: var(--acc-soft); border-color: transparent; }
.msg.collapsed .content, .msg.collapsed .reasoning, .msg.collapsed .atts { display: none; }
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: .45em 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: .7em 0 .35em; line-height: 1.3; }
.md h1 { font-size: 1.35em; }
.md h2 { font-size: 1.22em; }
.md h3 { font-size: 1.1em; }
.md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { margin: .45em 0; padding-left: 1.5em; }
.md li { margin: .18em 0; }
.md blockquote { margin: .5em 0; padding: .15em .1em .15em .9em; border-left: 3px solid var(--border2); color: var(--muted); }
.md a { color: var(--acc); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md img { max-width: 100%; border-radius: 8px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: .8em 0; }
.md table { border-collapse: collapse; margin: .6em 0; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--border2); padding: 4px 9px; font-size: .95em; text-align: left; }
.md th { background: var(--panel2); }
.md code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: .08em .35em; }
.md pre { margin: 0; background: var(--code-bg); overflow-x: auto; }
.md pre code { background: none; border: none; padding: 12px 14px; display: block; font-size: 12.5px; line-height: 1.5; }
.cb { margin: .6em 0; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--code-bg); }
.cb-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 10px; background: var(--code-head); border-bottom: 1px solid var(--border); }
.cb-lang { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.cb-btns { display: flex; gap: 2px; }
.cb .ibtn:hover { background: rgba(127,127,127,.18); }
.reasoning { border: 1px solid var(--border); border-left: 3px solid var(--acc2); border-radius: 10px; background: var(--acc2-soft); overflow: hidden; }
.rb-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px; }
.rb-head:hover { color: var(--text); }
.rb-label { display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: .6px; font-size: 11px; font-weight: 700; }
.rb-stat { margin-left: auto; font-family: var(--mono); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-body { display: none; border-top: 1px solid var(--border); padding: 2px 12px 8px; font-size: 13px; }
.reasoning.open .rb-body { display: block; }
.errbox { display: flex; gap: 8px; align-items: flex-start; background: rgba(220,38,38,.08); border: 1px solid var(--danger); color: var(--danger); border-radius: 9px; padding: 8px 11px; font-size: 12.5px; margin-top: 4px; }
.errbox svg { flex: 0 0 auto; margin-top: 1px; }
.atts { display: flex; flex-wrap: wrap; gap: 6px; }
.att-img { height: 84px; border-radius: 9px; border: 1px solid var(--border); display: block; }
.atts audio { height: 34px; max-width: 270px; }
.att-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 11.5px; color: var(--muted); max-width: 240px; }
.att-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-thumb { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; }
.chip-x { border: none; background: none; cursor: pointer; color: var(--muted); display: inline-flex; padding: 2px; border-radius: 5px; }
.chip-x:hover { color: var(--danger); }
.msg-actions { display: flex; gap: 3px; opacity: .45; transition: opacity .15s; flex-wrap: wrap; }
.msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
.dots { display: inline-flex; gap: 5px; padding: 6px 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
.md.streaming::after { content: ""; display: inline-block; width: 8px; height: 14px; background: var(--acc); margin-left: 3px; vertical-align: -2px; border-radius: 2px; animation: blink 1s steps(2,start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.editwrap { display: flex; flex-direction: column; gap: 6px; }
.edit-ta { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--border2); border-radius: 10px; background: var(--bg); color: var(--text); padding: 9px 12px; font: inherit; font-size: 13.5px; line-height: 1.5; }
.edit-ta:focus { outline: none; border-color: var(--acc); }
.edit-row { display: flex; gap: 8px; justify-content: flex-end; }
.btn.mini { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
#composer { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
#attachRow { max-width: 880px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
#composerInner { max-width: 880px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
#toolsLeft { display: flex; align-items: center; gap: 5px; padding-bottom: 3px; }
#inputEl { flex: 1; resize: none; border: 1px solid var(--border2); background: var(--bg); color: var(--text); border-radius: 13px; padding: 9px 13px; font: inherit; font-size: 14px; line-height: 1.45; min-height: 40px; }
#inputEl:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 480px; padding: 30px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .biglogo { color: var(--acc); display: inline-flex; }
.empty h2 { color: var(--text); font-size: 19px; }
.empty p { font-size: 12.5px; line-height: 1.7; }
.kbd-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 11px; }
.kbd { background: var(--panel2); border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 6px; padding: 2px 7px; color: var(--text); font-family: var(--mono); font-size: 11px; }
#toasts { position: fixed; right: 14px; top: 14px; z-index: 300; display: flex; flex-direction: column; gap: 8px; max-width: min(340px,calc(100vw - 28px)); pointer-events: none; }
.toast { display: flex; gap: 8px; align-items: center; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--acc); border-radius: 10px; padding: 9px 13px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: t-in .22s ease; }
.toast.error { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
.toast.success { border-left-color: var(--ok); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .25s; }
@keyframes t-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#jumpTop, #jumpBot { position: fixed; right: 16px; z-index: 150; width: 38px; height: 38px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border2); box-shadow: 0 4px 18px rgba(0,0,0,.25); color: var(--muted); }
#jumpTop { bottom: 98px; }
#jumpBot { bottom: 54px; }
#jumpTop:hover, #jumpBot:hover { color: var(--acc); border-color: var(--acc); }
#overlay { position: fixed; inset: 0; background: rgba(10,12,16,.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
#settingsCard { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: min(700px,100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sc-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.sc-head h2 { font-size: 16px; }
.sc-body { padding: 4px 18px 14px; overflow-y: auto; }
.sc-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--acc); margin: 16px 0 6px; border-bottom: 1px dashed var(--border); padding-bottom: 5px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); margin: 8px 0; min-width: 0; }
.field textarea { resize: vertical; min-height: 40px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid2 .btn { justify-content: center; margin: 6px 0; }
.checkfield { flex-direction: row; align-items: center; justify-content: space-between; padding: 6px 0; }
.checkfield input { width: 18px; height: 18px; accent-color: var(--acc); }
.keywrap { display: flex; gap: 6px; align-items: center; }
.keywrap input { flex: 1; }
.rowflex { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
.rowflex input { flex: 1; }
.modellist { max-height: 190px; overflow-y: auto; border: 1px solid var(--border); border-radius: 9px; margin-top: 2px; }
.ml-empty { padding: 12px; color: var(--muted); font-size: 12px; text-align: center; }
.note { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
.sc-foot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border2); background: transparent; border-radius: 9px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--acc); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
#confirmOv { position: fixed; inset: 0; background: rgba(10,12,16,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 16px; }
.cf-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; max-width: 430px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.cf-card h3 { font-size: 15px; margin-bottom: 8px; }
.cf-card p { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; line-height: 1.65; overflow-wrap: break-word; }
.cf-row { display: flex; gap: 8px; justify-content: flex-end; }
.spin { animation: rot 1s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
#dropHint { position: fixed; inset: 0; z-index: 600; display: flex; align-items: center; justify-content: center; padding: 26px; background: rgba(10,12,16,.45); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); pointer-events: none; }
#dropHint.hidden { display: none; }
.dh-card { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 46px; border: 2px dashed var(--acc); border-radius: 18px; background: var(--panel); color: var(--acc); font-size: 15px; font-weight: 650; box-shadow: 0 18px 60px rgba(0,0,0,.35); }
@media (max-width: 900px) {
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(300px,86vw);
    flex-basis: auto;
    transform: translateX(-104%);
    transition: transform .24s ease;
    z-index: 220;
    box-shadow: none;
  }
  body.sb-open #sidebar { transform: none; box-shadow: 0 10px 44px rgba(0,0,0,.35); }
  body.sb-open #scrim { display: block; position: fixed; inset: 0; background: rgba(10,12,16,.45); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); z-index: 210; }
  body.sb-collapsed #sidebar { margin-left: 0; }
}
@media (max-width: 640px) {
  #topbar { padding: 7px 9px; }
  #chat { padding: 12px 8px 6px; gap: 13px; }
  .msg { gap: 8px; }
  .avatar { width: 27px; height: 27px; }
  .content { padding: 9px 12px; border-radius: 11px; }
  .statline { font-size: 9.5px; }
  #inputEl { font-size: 16px; }
  .grid2 { grid-template-columns: 1fr; }
  #overlay { padding: 0; }
  #settingsCard { width: 100%; border-radius: 0; border: none; height: 100%; }
  #toasts { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: none; }
  #jumpTop { right: 10px; }
  #jumpBot { right: 10px; }
  #modelPick { gap: 6px; }
  #effortBtn .lb { max-width: 80px; }
}
@media (max-width: 560px) {
  #composerInner { flex-wrap: wrap; }
  #inputEl { flex-basis: 100%; order: 1; }
  #toolsLeft { order: 2; }
  #sendBtn { order: 3; margin-left: auto; }
}
@media (hover: none) {
  .cv-acts, .msg-actions { opacity: 1; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #topbar { padding: 4px 10px; }
  #chat { padding: 8px 10px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; transition-duration: .001s !important; }
  .spin { animation-duration: 1.2s !important; }
  .md.streaming::after { animation: none; }
  .dots i { animation: none; opacity: .55; }
}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="logo-slot" id="brandLogo"></span>
      <span class="sb-brand">local-llm-chat</span>
      <button type="button" class="ibtn" id="sbClose" title="Close sidebar"></button>
    </div>
    <div class="sb-actions">
      <button type="button" class="btn primary" id="newChatBtn"><span class="ic" id="newChatIc"></span><span>New chat</span></button>
      <button type="button" class="btn" id="sideImportBtn" title="Import conversation backup (.json)"><span class="ic" id="sideImportIc"></span><span>Import</span></button>
    </div>
    <div class="sb-search">
      <div class="search-wrap">
        <input id="sbFilter" type="text" placeholder="Search conversations..." spellcheck="false" autocomplete="off">
        <button type="button" class="ibtn search-clear hidden" id="sbFilterClear" title="Clear search" aria-label="Clear search"></button>
      </div>
    </div>
    <div id="sbList" class="sb-list"></div>
    <div class="sb-foot">
      <button type="button" class="sb-fbtn" id="themeBtn"><span class="sb-fi" id="themeIc"></span><span id="themeLb">Theme: auto</span></button>
      <button type="button" class="sb-fbtn" id="settingsBtn"><span class="sb-fi" id="settingsIc"></span><span>Settings</span></button>
      <div class="sb-count" id="sbCount"></div>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="mainCol">
    <header id="topbar">
      <button type="button" class="ibtn" id="sbToggle" title="Toggle sidebar"></button>
      <span class="top-spacer"></span>
      <div id="modelPick">
        <button type="button" id="modelBtn" class="mp-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="lb" id="modelLabel">Model</span>
          <span class="chev" id="modelChev"></span>
        </button>
        <button type="button" id="effortBtn" class="mp-btn" aria-haspopup="listbox" aria-expanded="false" title="Reasoning effort" aria-label="Reasoning effort">
          <span class="ic" id="effortIc"></span>
          <span class="lb" id="effortLabel">default</span>
          <span class="chev" id="effortChev"></span>
        </button>
      </div>
      <span class="top-spacer"></span>
    </header>
    <main id="chat"></main>
    <footer id="composer">
      <div id="attachRow" class="hidden"></div>
      <div id="composerInner">
        <div id="toolsLeft">
          <button type="button" class="ibtn" id="attachBtn" title="Attach files"></button>
          <button type="button" class="ibtn" id="expandBtn" title="Expand editor"></button>
        </div>
        <textarea id="inputEl" rows="1" placeholder="Type a message. Enter = newline, Ctrl+Enter = send"></textarea>
        <button type="button" class="ibtn primary" id="sendBtn" title="Send (Ctrl+Enter)"></button>
      </div>
      <input type="file" id="fileInput" multiple hidden>
    </footer>
  </div>
</div>
<button type="button" id="jumpTop" class="ibtn hidden" title="Back to top"></button>
<button type="button" id="jumpBot" class="ibtn hidden" title="Forward to bottom"></button>
<div id="overlay" class="hidden">
  <div id="settingsCard">
    <div class="sc-head">
      <h2>Settings</h2>
      <button type="button" class="ibtn" id="settingsClose" title="Close"></button>
    </div>
    <div class="sc-body">
      <h3>Connection</h3>
      <label class="field">Base URL
        <input id="sBaseUrl" type="text" spellcheck="false" placeholder="https://api.openai.com/v1">
      </label>
      <label class="field">API Key
        <span class="keywrap">
          <input id="sApiKey" type="password" spellcheck="false" autocomplete="off" placeholder="Leave empty for local servers">
          <button type="button" class="ibtn" id="keyEye" title="Show / hide key"></button>
        </span>
      </label>
      <h3>Model</h3>
      <label class="field">Model ID (manual entry allowed)
        <input id="sModel" type="text" spellcheck="false" placeholder="gpt-4o-mini">
      </label>
      <div class="rowflex">
        <input id="sModelFilter" type="text" placeholder="Filter models by keyword...">
        <button type="button" class="btn" id="refreshModels"></button>
      </div>
      <div id="modelList" class="modellist"></div>
      <h3>Generation</h3>
      <label class="field">System prompt
        <textarea id="sSystem" rows="3" placeholder="You are a helpful assistant."></textarea>
      </label>
      <div class="grid2">
        <label class="field">Temperature<input id="sTemp" type="number" step="any" min="0"></label>
        <label class="field">Top P<input id="sTopP" type="number" step="any" min="0"></label>
        <label class="field">Top K<input id="sTopK" type="number" step="any" min="0" placeholder="empty = omit"></label>
        <label class="field">Max tokens<input id="sMaxTok" type="number" step="any" min="1" placeholder="empty = omit"></label>
        <label class="field">Frequency penalty<input id="sFreq" type="number" step="any"></label>
        <label class="field">Presence penalty<input id="sPres" type="number" step="any"></label>
        <label class="field">Seed<input id="sSeed" type="number" step="any" placeholder="empty = omit"></label>
        <label class="field">Reasoning effort
          <button type="button" id="sEffortBtn" class="mp-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="lb" id="sEffortLabel">default</span>
            <span class="chev"></span>
          </button>
        </label>
        <label class="field">Stop sequences (one per line)
          <textarea id="sStop" rows="2" spellcheck="false"></textarea>
        </label>
        <label class="field checkfield">Stream responses<input id="sStream" type="checkbox"></label>
      </div>
      <h3>Data (local history)</h3>
      <div class="grid2">
        <button type="button" class="btn" id="backupBtn"><span class="ic" id="backupIc"></span><span>Export backup (backup.json)</span></button>
        <button type="button" class="btn" id="importBtn"><span class="ic" id="importIc"></span><span>Import backup (.json)</span></button>
      </div>
      <button type="button" class="btn danger" id="wipeBtn">Clear all history...</button>
      <h3>Advanced</h3>
      <label class="field">Extra parameters (JSON object, merged into the request body)
        <textarea id="sExtra" rows="4" spellcheck="false" placeholder="{&quot;presence_penalty&quot;:0.5}"></textarea>
      </label>
      <p class="note" id="storageNote">Conversations are stored locally in your browser. Nothing is ever uploaded anywhere except to the chat endpoint you configure.</p>
    </div>
    <div class="sc-foot">
      <button type="button" class="btn danger" id="resetDefaults">Restore defaults</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelSettings">Cancel</button>
      <button type="button" class="btn primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<div id="dropHint" class="hidden"><div class="dh-card"><span class="ic" id="dropIc"></span><span>Drop files to attach</span></div></div>
<div id="toasts"></div>

            tx.onabort = function () { finish(null); };
            tx.onerror = function () { finish(null); };

    init() {

        return 'memory';

    /* ---------- IndexedDB internals ---------- */
    _store(mode) { return this.db.transaction('conversations', mode).objectStore('conversations'); }

    _loadAllLS() {

      renderAttachRow();
      toast('Added ' + f.name + ' (' + kind + ')', 'success');
    }).catch(function () {
      attachments = attachments.filter(function (x) { return x.id !== att.id; });
      renderAttachRow();
      toast('Failed to read ' + f.name, 'error');
    });
  }
  function renderAttachRow() {
    var row = $('attachRow');
    row.innerHTML = '';
    if (!attachments.length) { row.classList.add('hidden'); return; }
    row.classList.remove('hidden');
    attachments.forEach(function (a) {
      var chip = makeChip(a, function () {
        attachments = attachments.filter(function (x) { return x.id !== a.id; });
        renderAttachRow();
      });
      row.appendChild(chip);
    });
  }
  function buildApiContent(text, atts) {
    var parts = [];
    if (text && text.trim()) parts.push({ type: 'text', text: text });
    (atts || []).forEach(function (a) {
      if (a.kind === 'image') parts.push({ type: 'image_url', image_url: { url: a.dataUrl } });
      else if (a.kind === 'audio') parts.push({ type: 'input_audio', input_audio: { data: a.b64, format: a.format } });
      else if (a.kind === 'text') parts.push({ type: 'text', text: 'Attached file: ' + a.name + '\n' + '\x60\x60\x60\n' + (a.text || '') + '\n' + '\x60\x60\x60' });
      else parts.push({ type: 'file', file: { filename: a.name, file_data: a.dataUrl } });
    });
    if (!parts.length) return '';
    if (parts.length === 1 && parts[0].type === 'text') return parts[0].text;
    return parts;
  }

  /* ============================== drag & drop attach ============================== */

  (function setupDragDrop() {
    var depth = 0;
    function dtHasFiles(e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return false;
      var t = e.dataTransfer.types;
      for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
      return false;
    }
    function showHint() { $('dropHint').classList.remove('hidden'); }
    function hideHint() { depth = 0; $('dropHint').classList.add('hidden'); }
    document.addEventListener('dragenter', function (e) {
      if (!dtHasFiles(e)) return;
      e.preventDefault();
      depth++;
      showHint();
    });
    document.addEventListener('dragover', function (e) {
      if (!dtHasFiles(e)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });
    document.addEventListener('dragleave', function (e) {
      if (!dtHasFiles(e)) return;
      depth = Math.max(0, depth - 1);
      if (!depth) hideHint();
    });
    document.addEventListener('drop', function (e) {
      if (!dtHasFiles(e)) return;
      e.preventDefault();
      hideHint();
      var fs = e.dataTransfer && e.dataTransfer.files;
      if (fs && fs.length) Array.prototype.forEach.call(fs, function (f) { addFile(f); });
    });
    window.addEventListener('blur', hideHint);
  })();

  /* ============================== composer ============================== */

  function autoResize() {
    inputEl.style.height = 'auto';
    var cap = 170;
    if (expanded) {
      var landscape = window.matchMedia('(max-height: 500px) and (orientation: landscape)').matches;
      cap = Math.min(Math.round(window.innerHeight * (landscape ? 0.40 : 0.58)), 520);
    }
    var h = Math.min(inputEl.scrollHeight, cap);
    inputEl.style.height = h + 'px';
    inputEl.style.overflowY = inputEl.scrollHeight > cap + 1 ? 'auto' : 'hidden';
    updateJumpPos();
  }
  function send() {
    if (streamingNow) { if (curCtrl) curCtrl.abort(); return; }
    var text = inputEl.value;
    if (!text.trim() && !attachments.length) { toast('Type a message or attach a file first.', 'warn'); return; }
    if (attachments.some(function (a) { return a.pending; })) { toast('Attachments are still loading — please wait a moment.', 'warn'); return; }
    if (!curConv) curConv = { id: newId(), title: 'New chat', createdAt: Date.now(), updatedAt: Date.now(), parentId: null, messages: messages };
    var typingMs = typingStart != null ? performance.now() - typingStart : 0;
    typingStart = null;
    var um = {
      id: newId(), role: 'user', text: text, atts: attachments.slice(),
      apiContent: buildApiContent(text, attachments),
      tSent: performance.now(), typingMs: typingMs, estTok: estTokens(attEstSrc(text, attachments))
    };
    if (messages.length === 0) curConv.title = deriveTitle(text, attachments);
    messages.push(um); prevUser = um;
    attachments = []; renderAttachRow();
    inputEl.value = ''; autoResize();
    removeEmpty(); buildMsgEl(um); updateMsgDom(um);
    scrollBottom();
    queueSave();
    runCompletion();
  }

  /* ============================== sidebar layout helpers ============================== */

  function isMobileSb() { return window.matchMedia('(max-width: 900px)').matches; }
  function updateSidebarInert() {
    var sb = $('sidebar');
    if (!sb) return;
    var hidden = isMobileSb() ? !document.body.classList.contains('sb-open')
      : document.body.classList.contains('sb-collapsed');
    sb.inert = hidden;
  }
  function toggleSidebar() {
    if (isMobileSb()) document.body.classList.toggle('sb-open');
    else document.body.classList.toggle('sb-collapsed');
    updateSidebarInert();
    setTimeout(function () { updateJumpBtns(); updateJumpPos(); }, 240);
  }
  function closeSidebarMobile() {
    if (isMobileSb() && document.body.classList.contains('sb-open')) {
      document.body.classList.remove('sb-open');
      updateSidebarInert();
    }
  }

  /* ============================== settings dialog open/close ============================== */

  function openSettings() {
    closeAllDD();
    fillSettingsForm();
    $('overlay').classList.remove('hidden');
    closeSidebarMobile();
    if (!cachedModels.length && apiBase()) fetchModels();
  }
  function closeSettings() { $('overlay').classList.add('hidden'); }

  /* ============================== init ============================== */

  function init() {
    // --- sidebar ---
    $('brandLogo').innerHTML = icon('logo', 24);
    $('dropIc').innerHTML = icon('upload', 26);
    setBtnMeta($('sbToggle'), 'menu', 'Toggle sidebar');
    $('sbToggle').addEventListener('click', toggleSidebar);
    setBtnMeta($('sbClose'), 'x', 'Close sidebar');
    $('sbClose').addEventListener('click', toggleSidebar);
    $('scrim').addEventListener('click', closeSidebarMobile);
    $('newChatIc').innerHTML = icon('plus', 15);
    $('newChatBtn').addEventListener('click', newChat);
    $('sideImportIc').innerHTML = icon('upload', 15);
    $('sideImportBtn').addEventListener('click', function () { $('importInput').click(); });

    var sbFilterEl = $('sbFilter'), sbClearBtn = $('sbFilterClear');
    setBtnMeta(sbClearBtn, 'x', 'Clear search', 13);
    function updSbClear() { sbClearBtn.classList.toggle('hidden', !sbFilterEl.value); }
    sbFilterEl.addEventListener('input', function () { renderSidebar(); updSbClear(); });
    sbClearBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
    sbClearBtn.addEventListener('click', function () {
      sbFilterEl.value = '';
      renderSidebar();
      updSbClear();
      sbFilterEl.focus();
    });
    updSbClear();
    $('themeBtn').addEventListener('click', cycleTheme);
    $('settingsIc').innerHTML = icon('gear', 16);
    $('settingsBtn').addEventListener('click', openSettings);

    // --- composer ---
    setBtnMeta($('attachBtn'), 'paperclip', 'Attach files');
    $('attachBtn').addEventListener('click', function () { $('fileInput').click(); });
    var expandB = $('expandBtn');
    setBtnMeta(expandB, 'expand', 'Expand editor');
    expandB.addEventListener('click', function () {
      expanded = !expanded;
      setBtnMeta(expandB, expanded ? 'collapse' : 'expand', expanded ? 'Collapse editor' : 'Expand editor');
      autoResize();
    });
    setSendMode(false);
    $('sendBtn').addEventListener('click', send);
    inputEl.addEventListener('input', function () {
      if (typingStart == null) typingStart = performance.now();
      autoResize();
    });
    inputEl.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    });
    $('fileInput').addEventListener('change', function () {
      Array.prototype.forEach.call(this.files, function (f) { addFile(f); });
      this.value = '';
    });

    // --- topbar: model + reasoning-effort pickers (shared dropdown component) ---
    $('modelChev').innerHTML = icon('chevron', 14);
    setupModelDD();
    $('effortIc').innerHTML = icon('zap', 14);
    $('effortChev').innerHTML = icon('chevron', 14);
    effortTopDD = setupEffortDD($('effortBtn'),
    function () { return settings.reasoningEffort; },
    function (v) { settings.reasoningEffort = v; persistSettings(); syncEffortLabels(); toast('Reasoning effort: ' + v, 'success'); });

    // --- jump buttons ---
    jumpTopBtn = $('jumpTop');
    setBtnMeta(jumpTopBtn, 'arrowUp', 'Back to top');
    jumpTopBtn.addEventListener('click', function () { jumpEdge(true); });
    jumpBotBtn = $('jumpBot');
    setBtnMeta(jumpBotBtn, 'arrowDown', 'Forward to bottom');
    jumpBotBtn.addEventListener('click', function () { jumpEdge(false); });

    // --- settings dialog ---
    setBtnMeta($('settingsClose'), 'x', 'Close settings');
    $('settingsClose').addEventListener('click', closeSettings);
    $('cancelSettings').addEventListener('click', closeSettings);
    $('saveSettings').addEventListener('click', saveSettingsFromForm);
    $('resetDefaults').addEventListener('click', restoreDefaults);
    var eyeOn = false;
    $('keyEye').innerHTML = icon('eye', 16);
    $('keyEye').addEventListener('click', function () {
      eyeOn = !eyeOn;
      $('sApiKey').type = eyeOn ? 'text' : 'password';
      $('keyEye').innerHTML = icon(eyeOn ? 'eyeoff' : 'eye', 16);
    });
    var refreshB = $('refreshModels');
    refreshB.innerHTML = icon('refresh', 14);
    refreshB.appendChild(document.createTextNode('Refresh'));
    refreshB.addEventListener('click', function () { fetchModels(); });
    $('sModelFilter').addEventListener('input', renderModelList);
    $('backupIc').innerHTML = icon('braces', 15);
    $('backupBtn').addEventListener('click', exportBackup);
    $('importIc').innerHTML = icon('upload', 15);
    $('importBtn').addEventListener('click', function () { $('importInput').click(); });
    $('wipeBtn').addEventListener('click', function () {
      askConfirm('Clear all history?', 'Every conversation stored in this browser will be permanently deleted. This cannot be undone.', 'Delete everything', clearAllHistory);
    });
    $('sEffortBtn').querySelector('.chev').innerHTML = icon('chevron', 14);
    effortFormDD = setupEffortDD($('sEffortBtn'),
    function () { return draftEffort; },
    function (v) { draftEffort = v; syncEffortLabels(); });
    $('overlay').addEventListener('click', function (e) { if (e.target === this) closeSettings(); });
    $('importInput').addEventListener('change', function () {
      if (this.files && this.files[0]) importBackupFile(this.files[0]);
      this.value = '';
    });

    // --- global listeners ---
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (closeAllDD()) return;
        if (!$('overlay').classList.contains('hidden')) { closeSettings(); return; }
        closeSidebarMobile();
      }
    });
    window.addEventListener('resize', function () {
      autoResize();
      updateJumpPos();
      if (!isMobileSb()) document.body.classList.remove('sb-open');
      updateSidebarInert();
    });
    window.addEventListener('pagehide', flushPending);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flushPending();
    });

    // --- boot ---
    applyTheme();
    syncModelLabel();
    syncEffortLabels();
    showEmpty();
    renderAttachRow();
    autoResize();
    updateJumpBtns();
    updateJumpPos();

    convStore.init().then(function (backendName) {
      var noteEl = $('storageNote');
      if (backendName === 'idb') {
        noteEl.textContent = 'Conversations are stored locally in your browser (IndexedDB).';
        console.info('[local-llm-chat] conversation storage backend: IndexedDB');
      } else if (backendName === 'ls') {
        noteEl.textContent = 'Conversations are stored locally in your browser (localStorage fallback — IndexedDB unavailable).';
        console.info('[local-llm-chat] conversation storage backend: localStorage');
      } else {
        noteEl.textContent = 'Neither IndexedDB nor localStorage is available in this browser, so conversations are kept in memory only and will be lost when the page closes.';
        toast('No persistent storage available — history will be lost on reload.', 'error');
        console.error('[local-llm-chat] falling back to in-memory conversation storage.');
      }
      noteEl.textContent += ' Nothing is ever uploaded anywhere except to the chat endpoint you configure.';

      loadMetas();
      renderSidebar();
      var cur = lsGet(LS_CUR);
      if (cur && metas.has(cur)) {
        var cj = readConv(cur);
        if (cj) {
          var cv = deserConv(cj);
          mountConv(cv);
          if (cv._skipped) toast(cv._skipped + ' unsupported message(s) skipped while loading.', 'warn');
        } else {
          lsDel(LS_CUR);
        }
      }
    }).catch(function (e) {
      console.error('[local-llm-chat] storage init failed:', e);
      loadMetas();
      renderSidebar();
    });

    updateSidebarInert();
  }

  init();

})();
</script>
</body>
</html>
