<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Password Generator</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-soft: #f7f8fa;
      --text: #202633;
      --muted: #687182;
      --border: #e3e6ec;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ring: #93b4ff;
      --danger: #c43535;
      --shadow: 0 16px 56px -24px rgb(20 30 50 / 18%);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 12px 20px;
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button,
    input,
    label {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .card {
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .result {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    #password {
      display: block;
      width: 100%;
      margin: 0 0 16px;
      padding: 10px 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: clamp(21px, 5vw, 26px);
      letter-spacing: .7px;
      text-align: center;
      text-overflow: ellipsis;
    }

    #password::placeholder {
      color: var(--muted);
      font-size: 17px;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 650;
      transition: background .15s, transform .15s;
    }

    .button:not(:disabled):active {
      transform: translateY(1px);
    }

    .primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
    }

    .primary:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .secondary {
      min-width: 100px;
      border-color: var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .secondary:not(:disabled):hover {
      background: var(--surface-soft);
    }

    #status {
      margin: 10px 0 0;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
    }

    .settings {
      padding: 18px 20px 20px;
    }

    .section-heading,
    .strength-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading {
      margin-bottom: 10px;
    }

    .section-heading h2,
    legend {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
    }

    #length {
      width: 66px;
      min-height: 36px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      text-align: center;
      font-weight: 650;
    }

    #lengthRange {
      display: block;
      width: 100%;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    fieldset {
      min-width: 0;
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      padding: 0;
    }

    .option-list {
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 45px;
      padding: 10px 13px;
      cursor: pointer;
      transition: background .15s;
    }

    .option:hover {
      background: var(--surface-soft);
    }

    .option-list > .option:first-child {
      border-radius: 11px 11px 0 0;
    }

    .option + .option,
    #special-group,
    .custom-option {
      border-top: 1px solid var(--border);
    }

    .option-title {
      font-size: 13px;
      font-weight: 500;
    }

    .option-example {
      margin-left: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .switch {
      appearance: none;
      position: relative;
      flex: 0 0 36px;
      width: 36px;
      height: 22px;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: #d4d9e2;
      cursor: pointer;
      transition: background .15s;
    }

    .switch::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgb(0 0 0 / 15%);
      transition: transform .15s;
    }

    .switch:checked {
      border-color: var(--accent);
      background: var(--accent);
    }

    .switch:checked::before {
      transform: translateX(14px);
    }

    .custom-fields {
      padding: 0 13px 12px;
    }

    #customInput {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
    }

    .stats {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .strength-heading {
      margin-bottom: 9px;
      font-size: 12px;
    }

    .strength-heading > span {
      color: var(--muted);
    }

    #strengthLabel {
      color: var(--accent);
    }

    .strength-track {
      height: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--border);
    }

    #strengthFill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .2s, background .2s;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 0;
    }

    .stat {
      min-width: 0;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .stat dt {
      color: var(--muted);
      font-size: 11px;
    }

    .stat dd {
      margin: 4px 0 0;
      font-size: 15px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .crack-times {
      margin-top: 14px;
    }

    .crack-times h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 650;
    }

    .time-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px 12px;
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .time-list dt {
      color: var(--muted);
    }

    .time-list dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        background: var(--surface);
      }

      .app {
        max-width: none;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        background: var(--surface);
      }

      .card {
        width: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .result {
        padding: 18px 20px;
      }

      .settings {
        padding: 18px 20px 20px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101216;
        --surface: #191c22;
        --surface-soft: #22262e;
        --text: #edf0f7;
        --muted: #a0a9ba;
        --border: #333944;
        --accent: #3b72ed;
        --accent-hover: #4c80f3;
        --ring: #80a7ff;
        --danger: #ff9696;
        --shadow: 0 16px 56px -24px rgb(0 0 0 / 60%);
      }

      .switch {
        background: #454d5c;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before {
        transition: none !important;
      }
    }

    @media (forced-colors: active) {
      .switch {
        appearance: auto;
      }

      .switch::before {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <form class="card" id="generator">
      <section class="result" aria-label="Generated password">
        <input
          type="text"
          id="password"
          aria-label="Generated password"
          readonly
          placeholder="Generate a password"
          autocomplete="off"
          spellcheck="false"
          autocapitalize="off"
        >

        <div class="actions">
          <button class="button primary" type="submit" id="generateBtn">
            Generate
          </button>

          <button
            class="button secondary"
            type="button"
            id="copyBtn"
            disabled
          >
            <span id="copyLabel" aria-live="polite">Copy</span>
          </button>
        </div>

        <p id="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="settings" aria-label="Password settings">
        <div class="section-heading">
          <h2><label for="length">Length</label></h2>
          <input
            type="number"
            id="length"
            value="16"
            min="1"
            max="128"
            step="1"
            required
          >
        </div>

        <input
          type="range"
          id="lengthRange"
          min="1"
          max="128"
          value="16"
          aria-label="Password length slider"
        >

        <div class="range-labels" aria-hidden="true">
          <span>1</span>
          <span>128</span>
        </div>

        <fieldset>
          <legend>Characters</legend>

          <div class="option-list">
            <label class="option">
              <span class="option-title">
                Uppercase <span class="option-example">A–Z</span>
              </span>
              <input class="switch" type="checkbox" id="uppercase" checked>
            </label>

            <label class="option">
              <span class="option-title">
                Lowercase <span class="option-example">a–z</span>
              </span>
              <input class="switch" type="checkbox" id="lowercase" checked>
            </label>

            <label class="option">
              <span class="option-title">
                Numbers <span class="option-example">0–9</span>
              </span>
              <input class="switch" type="checkbox" id="numbers" checked>
            </label>

            <div id="special-group">
              <label class="option">
                <span class="option-title">
                  Basic symbols <span class="option-example">- _ .</span>
                </span>
                <input class="switch" type="checkbox" id="special" checked>
              </label>

              <label class="option">
                <span class="option-title">Extended symbols</span>
                <input class="switch" type="checkbox" id="all">
              </label>
            </div>

            <label class="option custom-option">
              <span class="option-title">Custom characters</span>
              <input
                class="switch"
                type="checkbox"
                id="custom"
                aria-controls="custom-char-container"
              >
            </label>

            <div
              class="custom-fields"
              id="custom-char-container"
              hidden
            >
              <input
                type="text"
                id="customInput"
                aria-label="Custom characters"
                placeholder="e.g. !@#$"
                maxlength="1024"
                autocomplete="off"
                spellcheck="false"
                autocapitalize="off"
              >
            </div>
          </div>
        </fieldset>

        <section class="stats" aria-label="Settings strength estimates">
          <div class="strength-heading">
            <span>Settings strength</span>
            <strong id="strengthLabel">—</strong>
          </div>

          <div class="strength-track" aria-hidden="true">
            <div id="strengthFill"></div>
          </div>

          <dl class="stat-grid">
            <div class="stat">
              <dt>Combinations</dt>
              <dd id="statCombinations">—</dd>
            </div>
            <div class="stat">
              <dt>Min-entropy</dt>
              <dd id="statEntropy">—</dd>
            </div>
          </dl>

          <div class="crack-times">
            <h3>Estimated time to crack</h3>
            <dl class="time-list">
              <dt title="Average exhaustive search at 100 billion guesses per second.">
                Modern computer
              </dt>
              <dd id="time-modern">—</dd>

              <dt title="Hypothetical square-root search at 100 billion iterations per second, not a real hardware prediction.">
                Quantum (theoretical)
              </dt>
              <dd id="time-quantum">—</dd>
            </dl>
          </div>
        </section>
      </section>
    </form>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const form = $("generator");

    const GUESSES_PER_SECOND = 100_000_000_000;
    const SECONDS_PER_YEAR = 365.25 * 24 * 60 * 60;
    let copyTimer;

    function setStatus(message = "", error = false) {
      $("status").textContent = error ? message : "";
      $("status").hidden = !error || !message;
    }

    function resetCopyLabel() {
      clearTimeout(copyTimer);
      $("copyLabel").textContent = "Copy";
    }

    function validLength(length) {
      return Number.isInteger(length) && length >= 1 && length <= 128;
    }

    function getSettings() {
      const length = $("length").valueAsNumber;
      let characters = "";

      if ($("uppercase").checked) {
        characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      }

      if ($("lowercase").checked) {
        characters += "abcdefghijklmnopqrstuvwxyz";
      }

      if ($("numbers").checked) {
        characters += "0123456789";
      }

      if ($("custom").checked) {
        characters += $("customInput").value;
      } else {
        if ($("special").checked) {
          characters += "-_.";
        }

        if ($("all").checked) {
          characters += " !\"#$%&'()*+,/:;<=>?@[\\]^{}|~";
        }
      }

      return {
        length,
        pool: Array.from(characters)
      };
    }

    function formatCombinations(count) {
      const digits = count.toString();

      if (digits.length <= 12) {
        return count.toLocaleString();
      }

      const mantissa = Number(`${digits[0]}.${digits.slice(1, 4)}`);
      return `≈ ${mantissa.toFixed(2)} × 10^${digits.length - 1}`;
    }

    function formatTime(logSeconds) {
      if (logSeconds < 0) return "< 1 second";

      const logYears = logSeconds - Math.log10(SECONDS_PER_YEAR);

      if (logYears >= 6) {
        const exponent = Math.floor(logYears);
        const mantissa = Math.pow(10, logYears - exponent);
        return `≈ ${mantissa.toFixed(1)} × 10^${exponent} years`;
      }

      const seconds = Math.pow(10, logSeconds);
      const units = [
        [SECONDS_PER_YEAR, "year"],
        [86400, "day"],
        [3600, "hour"],
        [60, "minute"],
        [1, "second"]
      ];

      for (const [size, unit] of units) {
        if (seconds >= size) {
          const value = seconds / size;
          const rounded = Number(value.toFixed(value < 10 ? 1 : 0));
          return `≈ ${rounded.toLocaleString()} ${unit}${rounded === 1 ? "" : "s"}`;
        }
      }
    }

    function updateStats() {
      const { length, pool } = getSettings();

      if (!validLength(length) || pool.length === 0) {
        $("statCombinations").textContent = "—";
        $("statEntropy").textContent = "—";
        $("time-modern").textContent = "—";
        $("time-quantum").textContent = "—";
        $("strengthLabel").textContent = "Choose settings";
        $("strengthLabel").style.color = "var(--muted)";
        $("strengthFill").style.width = "0%";
        return;
      }

      const frequencies = new Map();

      for (const character of pool) {
        frequencies.set(
          character,
          (frequencies.get(character) || 0) + 1
        );
      }

      const uniqueCount = frequencies.size;
      const counts = [...frequencies.values()];
      const maxFrequency = Math.max(...counts);
      const isUniform = counts.every(count => count === counts[0]);

      const bits = length * Math.log2(pool.length / maxFrequency);
      const combinations = BigInt(uniqueCount) ** BigInt(length);

      $("statCombinations").textContent = formatCombinations(combinations);
      $("statEntropy").textContent = `${bits.toFixed(1)} bits`;

      let label = "Weak";
      let color = "var(--danger)";

      if (bits >= 100) {
        label = "Very strong";
        color = "var(--accent)";
      } else if (bits >= 80) {
        label = "Strong";
        color = "var(--accent)";
      } else if (bits >= 60) {
        label = "Moderate";
        color = "#b58022";
      }

      $("strengthLabel").textContent = label;
      $("strengthLabel").style.color = color;
      $("strengthFill").style.background = color;
      $("strengthFill").style.width = `${Math.min(100, bits / 128 * 100)}%`;

      if (!isUniform) {
        $("time-modern").textContent = "Weighted pool";
        $("time-quantum").textContent = "Weighted pool";
        return;
      }

      const logSpace = length * Math.log10(uniqueCount);
      const logSpeed = Math.log10(GUESSES_PER_SECOND);

      const logAverageGuesses =
        logSpace + Math.log10(1 + Math.pow(10, -logSpace)) - Math.log10(2);

      $("time-modern").textContent = formatTime(
        logAverageGuesses - logSpeed
      );

      $("time-quantum").textContent = formatTime(
        0.5 * logSpace - logSpeed
      );
    }

    form.addEventListener("input", event => {
      const id = event.target.id;

      if (id === "password") return;

      if (id === "lengthRange") {
        $("length").value = $("lengthRange").value;
      } else if (id === "length" && validLength($("length").valueAsNumber)) {
        $("lengthRange").value = $("length").value;
      }

      if (id === "custom") {
        $("custom-char-container").hidden = !$("custom").checked;
        $("special-group").hidden = $("custom").checked;
      }

      setStatus();
      resetCopyLabel();
      updateStats();
    });

    function randomIndex(poolSize) {
      const range = 0x100000000;
      const limit = range - (range % poolSize);
      const buffer = new Uint32Array(1);

      do {
        globalThis.crypto.getRandomValues(buffer);
      } while (buffer[0] >= limit);

      return buffer[0] % poolSize;
    }

    function generatePassword() {
      const { length, pool } = getSettings();

      if (!validLength(length)) {
        setStatus("Choose a whole-number length between 1 and 128.", true);
        $("length").focus();
        return;
      }

      if (!pool.length) {
        setStatus("Select a character type or enter custom characters.", true);
        return;
      }

      if (!globalThis.crypto?.getRandomValues) {
        setStatus("Secure randomness is unavailable in this browser.", true);
        return;
      }

      try {
        $("password").value = Array.from(
          { length },
          () => pool[randomIndex(pool.length)]
        ).join("");

        $("copyBtn").disabled = false;
        resetCopyLabel();
        setStatus();
        updateStats();
      } catch {
        setStatus("Could not generate securely. Please try again.", true);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      generatePassword();
    });

    function fallbackCopy(text) {
      const previousFocus = document.activeElement;
      const textarea = document.createElement("textarea");

      textarea.value = text;
      textarea.readOnly = true;
      textarea.style.cssText =
        "position:fixed;top:0;left:0;opacity:0;font-size:16px;";

      document.body.appendChild(textarea);
      textarea.focus({ preventScroll: true });
      textarea.select();
      textarea.setSelectionRange(0, text.length);

      let copied = false;

      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      } finally {
        textarea.remove();
        previousFocus?.focus({ preventScroll: true });
      }

      return copied;
    }

    $("copyBtn").addEventListener("click", async () => {
      const input = $("password");
      const text = input.value;

      if (!text) return;

      let copied = false;

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {
      }

      if (!copied) {
        copied = fallbackCopy(text);
      }

      if (copied) {
        if (input.value !== text) {
          setStatus("Password changed. Copy again for the current one.", true);
          return;
        }

        resetCopyLabel();
        setStatus();
        $("copyLabel").textContent = "Copied!";
        copyTimer = setTimeout(resetCopyLabel, 1800);
      } else {
        input.focus();
        input.select();
        input.setSelectionRange(0, input.value.length);
        setStatus("Copy unavailable. Copy the selected password manually.", true);
      }
    });

    updateStats();
    generatePassword();
  </script>
</body>
</html>
