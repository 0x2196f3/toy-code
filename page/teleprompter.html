<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teleprompter</title>
    <style>
        :root {
            --bg-color: #fef7ff;
            --text-color: #1d1b20;
            --btn-bg: #e8def8;
            --btn-text: #1d1b20;
            --sidebar-bg: #f3edf7;
            --item-bg: #e7e0ec;
            --item-text: #1d1b20;
            --border-color: #c4c4c4;
            --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);
            --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.30);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #141218;
                --text-color: #e6e1e5;
                --btn-bg: #4f378b;
                --btn-text: #e6e1e5;
                --sidebar-bg: #211f26;
                --item-bg: #2d2a33;
                --item-text: #e6e1e5;
                --border-color: #49454f;
                --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.3), 0px 1px 2px 0px rgba(0, 0, 0, 0.5);
                --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.3), 0px 1px 3px 0px rgba(0, 0, 0, 0.5);
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Roboto, system-ui, sans-serif;
            position: fixed;
            touch-action: manipulation;
        }
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text-color);
            border: none;
            outline: none;
            resize: none;
            overflow: hidden;
            padding: 20px 140px 20px 20px;
            font-family: inherit;
            line-height: 1.2;
            display: block;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
            z-index: 10;
        }
        body.sidebar-open #overlay {
            opacity: 1;
            pointer-events: auto;
        }
        #btn-group {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: right 0.3s cubic-bezier(0.2, 0, 0, 1);
        }
        .fab {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--md-elevation-3);
            transition: transform 0.1s, right 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .fab:active {
            transform: scale(0.95);
        }
        .fab svg {
            width: 24px;
            height: 24px;
        }
        #sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            background-color: var(--sidebar-bg);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            z-index: 50;
            overflow-y: auto;
            box-shadow: var(--md-elevation-3);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        @media (orientation: landscape) {
            #sidebar {
                width: 40%;
            }
        }
        body.sidebar-open #sidebar {
            transform: translateX(0);
        }
        body.sidebar-open #btn-group {
            right: min(calc(60% + 15px), calc(100% - 71px));
        }
        @media (orientation: landscape) {
            body.sidebar-open #btn-group {
                right: min(calc(40% + 15px), calc(100% - 71px));
            }
        }
        .item {
            display: flex;
            padding: 16px;
            background-color: var(--item-bg);
            border-radius: 12px;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--md-elevation-1);
            -webkit-tap-highlight-color: transparent;
            animation: slideIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
            transition: transform 0.2s, opacity 0.2s, max-height 0.3s, padding 0.3s, margin 0.3s;
            overflow: hidden;
            max-height: 150px;
        }
        .item:active {
            transform: scale(0.98);
        }
        .item.removing {
            animation: slideOut 0.25s cubic-bezier(0.2, 0, 0, 1) forwards;
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin-top: 0;
            margin-bottom: 0;
            pointer-events: none;
        }
        .item-text {
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.4;
            color: var(--item-text);
            margin-right: 12px;
            word-break: break-all;
        }
        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background-color: transparent;
            color: var(--text-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .item-btn:active {
            background-color: rgba(0, 0, 0, 0.1);
        }
        @media (prefers-color-scheme: dark) {
            .item-btn:active {
                background-color: rgba(255, 255, 255, 0.1);
            }
        }
        .item-btn svg {
            width: 20px;
            height: 20px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideOut {
            from { transform: scale(1); }
            to { transform: scale(0.9); }
        }
    </style>
</head>
<body>
<div id="container">
    <textarea id="pad" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div id="overlay"></div>
    <div id="sidebar"></div>
    <div id="btn-group">
        <button id="clearBtn" class="fab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button id="saveBtn" class="fab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
        <button id="toggleBtn" class="fab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline id="path-toggle" points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
    </div>
</div>
<script>
    const pad = document.getElementById('pad');
    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const pathToggle = document.getElementById('path-toggle');

    const STORAGE_KEY = 'teleprompter_data_v2';
    const PIN_THRESHOLD = 1e14;
    let isSidebarOpen = false;

    function adjustFont() {
        let low = 1;
        let high = Math.max(window.innerWidth, window.innerHeight);
        let optimal = 1;
        while (low <= high) {
            let mid = Math.floor((low + high) / 2);
            pad.style.fontSize = mid + 'px';
            if (pad.scrollHeight > pad.clientHeight || pad.scrollWidth > pad.clientWidth) {
                high = mid - 1;
            } else {
                optimal = mid;
                low = mid + 1;
            }
        }
        pad.style.fontSize = optimal + 'px';
    }

    function getData() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveData(data) {
        data.sort((a, b) => b.ts - a.ts);
        if (data.length > 20) {
            data = data.slice(0, 20);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function renderList() {
        let data = getData();
        const currentIds = new Set(data.map(item => String(item.id)));

        Array.from(sidebar.children).forEach(child => {
            if (!currentIds.has(child.dataset.id)) {
                child.remove();
            }
        });

        data.forEach((item, index) => {
            let div = sidebar.querySelector(`[data-id="${item.id}"]`);
            let isNew = false;

            if (!div) {
                isNew = true;
                div = document.createElement('div');
                div.className = 'item';
                div.dataset.id = item.id;

                const textDiv = document.createElement('div');
                textDiv.className = 'item-text';

                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const delBtn = document.createElement('button');
                delBtn.className = 'item-btn';
                delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';

                const pinBtn = document.createElement('button');
                pinBtn.className = 'item-btn';

                div.appendChild(textDiv);
                actions.appendChild(delBtn);
                actions.appendChild(pinBtn);
                div.appendChild(actions);

                div.onclick = () => {
                    pad.value = item.t;
                    let freshData = getData();
                    let target = freshData.find(d => d.id === item.id);
                    if (target) {
                        if (target.ts >= PIN_THRESHOLD) {
                            target.ts = Math.max(target.ts, PIN_THRESHOLD + Date.now());
                        } else {
                            target.ts = Math.max(target.ts, Date.now());
                        }
                        saveData(freshData);
                        renderList();
                    }
                    adjustFont();
                };

                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    div.classList.add('removing');
                    div.addEventListener('animationend', () => {
                        let freshData = getData().filter(d => d.id !== item.id);
                        saveData(freshData);
                        renderList();
                    });
                };

                pinBtn.onclick = (e) => {
                    e.stopPropagation();
                    let freshData = getData();
                    let target = freshData.find(d => d.id === item.id);
                    if (target) {
                        if (target.ts >= PIN_THRESHOLD) {
                            target.ts = Date.now();
                        } else {
                            const pinnedCount = freshData.filter(d => d.ts >= PIN_THRESHOLD).length;
                            if (pinnedCount >= 3) return;
                            target.ts = PIN_THRESHOLD + Date.now();
                        }
                        saveData(freshData);
                        renderList();
                    }
                };
            }

            div.querySelector('.item-text').textContent = item.t;
            const pinBtn = div.querySelector('.item-actions').lastChild;
            if (item.ts >= PIN_THRESHOLD) {
                pinBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 8v5l3 3v2h-6v5l-1 1-1-1v-5H5v-2l3-3V8a4 4 0 0 1 8 0z"/></svg>';
            } else {
                pinBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8v5l3 3v2h-6v5l-1 1-1-1v-5H5v-2l3-3V8a4 4 0 0 1 8 0z"/></svg>';
            }

            if (sidebar.children[index] !== div) {
                sidebar.insertBefore(div, sidebar.children[index] || null);
            }
        });
    }

    clearBtn.addEventListener('click', () => {
        pad.value = '';
        adjustFont();
        pad.focus();
    });

    saveBtn.addEventListener('click', () => {
        const text = pad.value.trim();
        if (!text) return;
        let data = getData();
        let existing = data.find(d => d.t === text);
        if (existing) {
            if (existing.ts >= PIN_THRESHOLD) {
                existing.ts = Math.max(existing.ts, PIN_THRESHOLD + Date.now());
            } else {
                existing.ts = Math.max(existing.ts, Date.now());
            }
        } else {
            if (data.length >= 20) {
                data.sort((a, b) => b.ts - a.ts);
                data.pop();
            }
            data.push({ id: Date.now(), t: text, ts: Date.now() });
        }
        saveData(data);
        renderList();
    });

    function toggleSidebar() {
        isSidebarOpen = !isSidebarOpen;
        if (isSidebarOpen) {
            document.body.classList.add('sidebar-open');
            pathToggle.setAttribute('points', '9 18 15 12 9 6');
            renderList();
        } else {
            document.body.classList.remove('sidebar-open');
            pathToggle.setAttribute('points', '15 18 9 12 15 6');
        }
    }

    toggleBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    pad.addEventListener('input', adjustFont);
    window.addEventListener('resize', adjustFont);
    window.addEventListener('orientationchange', adjustFont);
    window.addEventListener('load', () => {
        adjustFont();
        renderList();
    });
</script>
</body>
</html>
