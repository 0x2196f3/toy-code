<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Android Material Calculator</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --surface-color: #FFFFFF;
            --surface-variant: #E1E2EC;
            --on-surface: #1F1F1F;
            --on-surface-variant: #44474E;
            
            --primary: #0B57D0;
            --on-primary: #FFFFFF;
            --primary-container: #D3E3FD;
            --on-primary-container: #041E49;
            
            --secondary-container: #E1E3E1;
            --on-secondary-container: #191C19;
            
            --accent-equals: #0B57D0;
            --on-accent-equals: #FFFFFF;
            
            --key-num-bg: #F1F3F4;
            --key-num-text: #1F1F1F;
            --key-op-bg: #D3E3FD;
            --key-op-text: #041E49;
            --key-sci-bg: #E3E3E3;
            --key-sci-text: #44474E;
            --key-action-bg: #E1E3E1;
            --key-action-text: #1F1F1F;

            --key-ac-bg: #FFDAD6;
            --key-ac-text: #B3261E;

            --display-text: #1F1F1F;
            --preview-text: #74777F;
            --history-stream-text: #5E6368;
            --history-item-bg: #F1F3F4;
            --radius-pill: 28px;
            --shadow-elevation: 0 4px 16px rgba(0, 0, 0, 0.08);
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --surface-color: #1E1E1E;
                --surface-variant: #44474E;
                --on-surface: #E6E1E5;
                --on-surface-variant: #C4C6D0;
                
                --primary: #A8C7FA;
                --on-primary: #003062;
                --primary-container: #004A77;
                --on-primary-container: #D3E3FD;
                
                --secondary-container: #2D2D2D;
                --on-secondary-container: #E6E1E5;
                
                --accent-equals: #A8C7FA;
                --on-accent-equals: #003062;
                
                --key-num-bg: #1E1E1E;
                --key-num-text: #E6E1E5;
                --key-op-bg: #004A77;
                --key-op-text: #D3E3FD;
                --key-sci-bg: #2B2D30;
                --key-sci-text: #C4C6D0;
                --key-action-bg: #333538;
                --key-action-text: #E6E1E5;

                --key-ac-bg: #601410;
                --key-ac-text: #F2B8B5;

                --display-text: #E6E1E5;
                --preview-text: #9AA0A6;
                --history-stream-text: #80868B;
                --history-item-bg: #1E1E1E;
                --shadow-elevation: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--on-surface);
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calc-app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
            box-shadow: var(--shadow-elevation);
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px 16px;
            z-index: 10;
        }

        .top-controls-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--on-surface-variant);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .icon-btn:hover, .icon-btn:active {
            background-color: var(--surface-variant);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .mode-badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 12px;
            background-color: var(--secondary-container);
            color: var(--on-secondary-container);
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .badge.active {
            background-color: var(--primary);
            color: var(--on-primary);
        }

        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 8px 24px;
            overflow: hidden;
            position: relative;
            min-height: 140px;
        }

        .history-stream {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow-y: auto;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent 0%, black 25%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%);
            padding-bottom: 6px;
        }

        .history-stream::-webkit-scrollbar {
            display: none;
        }

        @keyframes streamItemIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes streamItemOut {
            0% {
                opacity: 1;
                transform: translateY(0);
                max-height: 50px;
                margin-bottom: 4px;
            }
            100% {
                opacity: 0;
                transform: translateY(-24px);
                max-height: 0;
                margin-bottom: 0;
                padding-top: 0;
                padding-bottom: 0;
            }
        }

        .stream-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 2px 8px;
            margin-bottom: 4px;
            color: var(--history-stream-text);
            cursor: pointer;
            border-radius: 12px;
            transition: background-color 0.2s ease, color 0.2s ease;
            animation: streamItemIn 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            user-select: none;
            will-change: transform, opacity;
        }

        .stream-item:hover, .stream-item:active {
            background-color: var(--secondary-container);
            color: var(--on-surface);
        }

        .stream-item.removing {
            animation: streamItemOut 0.3s cubic-bezier(0.4, 0, 0.8, 1) forwards;
        }

        .stream-expr {
            font-size: 1.1rem;
            opacity: 0.85;
            word-break: break-all;
            text-align: right;
        }

        .stream-res {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--primary);
            word-break: break-all;
            text-align: right;
        }

        .formula-display {
            font-size: 2.75rem;
            font-weight: 400;
            color: var(--display-text);
            line-height: 1.2;
            text-align: right;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            margin-top: 2px;
        }

        .formula-display::-webkit-scrollbar {
            display: none;
        }

        .preview-display {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--preview-text);
            margin-top: 2px;
            min-height: 1.7rem;
            text-align: right;
            width: 100%;
            opacity: 0.85;
        }

        .history-backdrop {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.2, 0, 0, 1);
            will-change: opacity;
        }

        .history-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .history-drawer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 75%;
            background-color: var(--surface-color);
            z-index: 30;
            transform: translateY(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 16px 20px;
            will-change: transform;
        }

        .history-drawer.open {
            transform: translateY(0);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--surface-variant);
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--on-surface);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .history-drawer-item {
            background-color: var(--history-item-bg);
            padding: 12px 16px;
            border-radius: 16px;
            text-align: right;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s ease;
        }

        .history-drawer-item:hover {
            transform: scale(0.99);
            filter: brightness(0.96);
        }

        .empty-history {
            text-align: center;
            color: var(--preview-text);
            margin: auto;
            font-style: italic;
        }

        .keypad-wrapper {
            display: flex;
            flex-direction: column;
            padding: 8px 12px max(env(safe-area-inset-bottom, 0px), 12px) 12px;
            gap: 8px;
            background-color: var(--bg-color);
            z-index: 5;
        }

        .sci-toggle-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 14px;
            cursor: pointer;
            color: var(--on-surface-variant);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 12px;
        }

        .sci-toggle-bar:active {
            background-color: var(--surface-variant);
        }

        .sci-panel-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.22s cubic-bezier(0.2, 0, 0, 1);
            will-change: grid-template-rows;
        }

        .sci-panel-wrapper.expanded {
            grid-template-rows: 1fr;
        }

        .sci-panel {
            min-height: 0;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.2, 0, 0, 1);
            will-change: opacity, transform;
        }

        .sci-panel-wrapper.expanded .sci-panel {
            opacity: 1;
            transform: translateY(0);
            padding-bottom: 6px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            position: relative;
            outline: none;
            border: none;
            height: min(12vh, 60px);
            min-height: 48px;
            border-radius: var(--radius-pill);
            font-size: 1.35rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.08s ease, background-color 0.15s ease;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-num {
            background-color: var(--key-num-bg);
            color: var(--key-num-text);
        }

        .btn-op {
            background-color: var(--key-op-bg);
            color: var(--key-op-text);
            font-weight: 600;
        }

        .btn-sci {
            background-color: var(--key-sci-bg);
            color: var(--key-sci-text);
            font-size: 1rem;
            height: 48px;
            border-radius: 18px;
        }

        .btn-action {
            background-color: var(--key-action-bg);
            color: var(--key-action-text);
            font-weight: 600;
        }

        .btn-clear {
            background-color: var(--key-ac-bg);
            color: var(--key-ac-text);
            font-weight: 700;
        }

        .btn-equals {
            background-color: var(--accent-equals);
            color: var(--on-accent-equals);
            font-size: 1.6rem;
            font-weight: 600;
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple-anim 0.35s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @media (orientation: landscape) or (min-width: 680px) {
            .calc-app {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
            }

            .sci-toggle-bar {
                display: none;
            }

            .keypad-wrapper {
                flex-direction: row;
                gap: 12px;
                padding: 12px 16px max(env(safe-area-inset-bottom, 0px), 12px) 16px;
            }

            .sci-panel-wrapper {
                grid-template-rows: 1fr !important;
                flex: 1.2;
            }

            .sci-panel {
                grid-template-columns: repeat(3, 1fr);
                opacity: 1 !important;
                transform: none !important;
                gap: 10px;
                padding-bottom: 0 !important;
            }

            .sci-panel .btn-sci {
                height: min(12vh, 56px);
                border-radius: var(--radius-pill);
            }

            .main-grid {
                flex: 1.8;
                gap: 10px;
            }

            .btn {
                height: min(12vh, 56px);
            }

            .display-container {
                padding: 8px 28px;
            }

            .formula-display {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="calc-app">
        <div class="top-bar">
            <button class="icon-btn" id="historyToggleBtn" title="History" aria-label="History">
                <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.42l-1.42 1.42A8.91 8.91 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>
            </button>

            <div class="top-controls-right">
                <div class="mode-badges">
                    <span class="badge" id="degRadBtn" title="Toggle Degrees / Radians">DEG</span>
                    <span class="badge" id="invBtn" title="Inverse Functions">INV</span>
                </div>

                <button class="icon-btn" id="soundToggleBtn" title="Toggle Button Sound" aria-label="Toggle Sound">
                    <svg id="soundIconMuted" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    <svg id="soundIconUnmuted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>

        <div class="history-backdrop" id="historyBackdrop"></div>

        <div class="history-drawer" id="historyDrawer">
            <div class="history-header">
                <span class="history-title">Calculation History</span>
                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn" id="clearHistoryBtn" title="Clear History">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                    <button class="icon-btn" id="closeHistoryBtn" title="Close">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No history yet</div>
            </div>
        </div>

        <div class="display-container">
            <div class="history-stream" id="historyStream"></div>
            <div class="formula-display" id="formulaDisplay">0</div>
            <div class="preview-display" id="previewDisplay"></div>
        </div>

        <div class="keypad-wrapper">
            <div class="sci-toggle-bar" id="sciToggleBar">
                <span>Scientific Functions</span>
                <svg id="sciChevron" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="transition: transform 0.22s ease;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            </div>

            <div class="sci-panel-wrapper" id="sciPanelWrapper">
                <div class="sci-panel" id="sciPanel">
                    <button class="btn btn-sci" data-action="sin">sin</button>
                    <button class="btn btn-sci" data-action="cos">cos</button>
                    <button class="btn btn-sci" data-action="tan">tan</button>
                    <button class="btn btn-sci" data-action="ln">ln</button>
                    <button class="btn btn-sci" data-action="log">log</button>

                    <button class="btn btn-sci" data-action="sqrt">√</button>
                    <button class="btn btn-sci" data-action="power">x^y</button>
                    <button class="btn btn-sci" data-action="fact">x!</button>
                    <button class="btn btn-sci" data-action="pi">π</button>
                    <button class="btn btn-sci" data-action="e">e</button>
                </div>
            </div>

            <div class="main-grid">
                <button class="btn btn-clear" data-action="clear" id="acBtn">AC</button>
                <button class="btn btn-action" data-action="parens">( )</button>
                <button class="btn btn-action" data-value="%">%</button>
                <button class="btn btn-op" data-value="÷">÷</button>

                <button class="btn btn-num" data-value="7">7</button>
                <button class="btn btn-num" data-value="8">8</button>
                <button class="btn btn-num" data-value="9">9</button>
                <button class="btn btn-op" data-value="×">×</button>

                <button class="btn btn-num" data-value="4">4</button>
                <button class="btn btn-num" data-value="5">5</button>
                <button class="btn btn-num" data-value="6">6</button>
                <button class="btn btn-op" data-value="−">−</button>

                <button class="btn btn-num" data-value="1">1</button>
                <button class="btn btn-num" data-value="2">2</button>
                <button class="btn btn-num" data-value="3">3</button>
                <button class="btn btn-op" data-value="+">+</button>

                <button class="btn btn-num" data-value="0">0</button>
                <button class="btn btn-num" data-value=".">.</button>
                <button class="btn btn-action" data-action="backspace" title="Backspace">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>
                </button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </div>
        </div>
    </div>

    <script>
        let formula = "0";
        let isAngleRad = false;
        let isInverse = false;
        let soundEnabled = localStorage.getItem('android_calc_sound') === 'true';
        let historyLog = JSON.parse(localStorage.getItem('android_calc_history') || '[]');

        let audioCtx = null;

        const formulaDisplay = document.getElementById('formulaDisplay');
        const previewDisplay = document.getElementById('previewDisplay');
        const historyStream = document.getElementById('historyStream');
        const degRadBtn = document.getElementById('degRadBtn');
        const invBtn = document.getElementById('invBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIconMuted = document.getElementById('soundIconMuted');
        const soundIconUnmuted = document.getElementById('soundIconUnmuted');
        const historyToggleBtn = document.getElementById('historyToggleBtn');
        const historyDrawer = document.getElementById('historyDrawer');
        const historyBackdrop = document.getElementById('historyBackdrop');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const historyList = document.getElementById('historyList');
        const sciToggleBar = document.getElementById('sciToggleBar');
        const sciPanelWrapper = document.getElementById('sciPanelWrapper');
        const sciChevron = document.getElementById('sciChevron');

        function triggerHaptic() {
            if (navigator.vibrate) {
                try {
                    navigator.vibrate(12);
                } catch (err) {
                }
            }
        }

        function playKeyClickSound(freq = 600, duration = 0.025) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + duration);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {
            }
        }

        function updateSoundUI() {
            if (soundEnabled) {
                soundIconMuted.style.display = 'none';
                soundIconUnmuted.style.display = 'block';
            } else {
                soundIconMuted.style.display = 'block';
                soundIconUnmuted.style.display = 'none';
            }
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            if (n > 170) return Infinity;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        function formatNumber(num) {
            if (isNaN(num)) return "Error";
            if (!isFinite(num)) return "Infinity";
            const cleanNum = parseFloat(num.toFixed(11));
            if (Math.abs(cleanNum) >= 1e12 || (Math.abs(cleanNum) < 1e-7 && cleanNum !== 0)) {
                return cleanNum.toExponential(6);
            }
            return cleanNum.toLocaleString('en-US', { maximumFractionDigits: 10 });
        }

        function evaluateExpression(expr) {
            try {
                let sanitized = expr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/−/g, '-')
                    .replace(/π/g, 'Math.PI')
                    .replace(/\be\b/g, 'Math.E');

                sanitized = sanitized.replace(/(\d+(\.\d+)?)\!/g, 'factorial($1)');

                if (isAngleRad) {
                    sanitized = sanitized
                        .replace(/sin\(/g, 'Math.sin(')
                        .replace(/cos\(/g, 'Math.cos(')
                        .replace(/tan\(/g, 'Math.tan(')
                        .replace(/asin\(/g, 'Math.asin(')
                        .replace(/acos\(/g, 'Math.acos(')
                        .replace(/atan\(/g, 'Math.atan(');
                } else {
                    const degToRad = '(Math.PI/180)*';
                    sanitized = sanitized
                        .replace(/sin\(/g, `Math.sin(${degToRad}`)
                        .replace(/cos\(/g, `Math.cos(${degToRad}`)
                        .replace(/tan\(/g, `Math.tan(${degToRad}`)
                        .replace(/asin\(/g, `(180/Math.PI)*Math.asin(`)
                        .replace(/acos\(/g, `(180/Math.PI)*Math.acos(`)
                        .replace(/atan\(/g, `(180/Math.PI)*Math.atan(`);
                }

                sanitized = sanitized
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/\^/g, '**');

                sanitized = sanitized
                    .replace(/(\d)(\()/g, '$1*$2')
                    .replace(/(\))(\d)/g, '$1*$2')
                    .replace(/(\))(\()/g, '$1*$2')
                    .replace(/(\d)(Math\.)/g, '$1*$2');

                const result = new Function('factorial', `return ${sanitized}`)(factorial);
                
                if (typeof result === 'number' && !isNaN(result)) {
                    return result;
                }
                return null;
            } catch (err) {
                return null;
            }
        }

        function updateDisplay() {
            formulaDisplay.innerText = formula;
            formulaDisplay.scrollLeft = formulaDisplay.scrollWidth;

            const result = evaluateExpression(formula);
            if (result !== null && formula !== "0") {
                previewDisplay.innerText = "= " + formatNumber(result);
            } else {
                previewDisplay.innerText = "";
            }
        }

        function appendValue(val) {
            if (formula === "0" && val !== ".") {
                formula = val;
            } else {
                formula += val;
            }
            updateDisplay();
        }

        function handleBackspace() {
            if (formula.length <= 1) {
                formula = "0";
            } else {
                const funcs = ['sin(', 'cos(', 'tan(', 'asin(', 'acos(', 'atan(', 'ln(', 'log(', '√('];
                let matched = false;
                for (let f of funcs) {
                    if (formula.endsWith(f)) {
                        formula = formula.slice(0, -f.length);
                        matched = true;
                        break;
                    }
                }
                if (!matched) {
                    formula = formula.slice(0, -1);
                }
            }
            if (formula === "") formula = "0";
            updateDisplay();
        }

        function clearAll() {
            formula = "0";
            updateDisplay();
        }

        function handleParentheses() {
            const openCount = (formula.match(/\(/g) || []).length;
            const closeCount = (formula.match(/\)/g) || []).length;
            const lastChar = formula.slice(-1);

            if (openCount > closeCount && !'÷×−+^('.includes(lastChar) && formula !== "0") {
                formula += ")";
            } else {
                if (formula === "0") formula = "(";
                else formula += "(";
            }
            updateDisplay();
        }

        function addStreamItem(expr, res) {
            const item = document.createElement('div');
            item.className = 'stream-item';
            item.innerHTML = `
                <span class="stream-expr" title="Click expression to insert">${expr}</span>
                <span class="stream-res" title="Click result to insert">= ${res}</span>
            `;

            item.addEventListener('click', (e) => {
                triggerHaptic();
                playKeyClickSound(750, 0.02);
                if (e.target.classList.contains('stream-expr')) {
                    formula = expr;
                } else {
                    const rawVal = res.replace(/,/g, '');
                    if (formula === "0") formula = rawVal;
                    else formula += rawVal;
                }
                updateDisplay();
            });

            historyStream.appendChild(item);

            setTimeout(() => {
                historyStream.scrollTop = historyStream.scrollHeight;
            }, 10);

            const items = historyStream.querySelectorAll('.stream-item:not(.removing)');
            if (items.length > 10) {
                const oldest = items[0];
                oldest.classList.add('removing');
                setTimeout(() => {
                    if (oldest.parentNode) oldest.remove();
                }, 300);
            }
        }

        function calculateFinalResult() {
            const result = evaluateExpression(formula);
            if (result !== null) {
                const formattedResult = formatNumber(result);
                const expr = formula;
                const resStr = formattedResult.replace(/,/g, '');

                addStreamItem(expr, formattedResult);
                saveHistory(expr, formattedResult);

                formula = resStr;
                updateDisplay();
                previewDisplay.innerText = "";
            } else {
                previewDisplay.innerText = "Invalid Format";
            }
        }

        function saveHistory(expr, res) {
            historyLog.unshift({ expr: expr, res: res });
            if (historyLog.length > 50) historyLog.pop();
            localStorage.setItem('android_calc_history', JSON.stringify(historyLog));
            renderHistoryDrawer();
        }

        function renderHistoryDrawer() {
            if (historyLog.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No history yet</div>';
                return;
            }
            historyList.innerHTML = historyLog.map((item, idx) => `
                <div class="history-drawer-item" data-index="${idx}">
                    <div style="font-size: 0.95rem; color: var(--on-surface-variant);">${item.expr}</div>
                    <div style="font-size: 1.25rem; font-weight: 600; color: var(--primary);">= ${item.res}</div>
                </div>
            `).join('');

            document.querySelectorAll('.history-drawer-item').forEach(el => {
                el.addEventListener('click', () => {
                    triggerHaptic();
                    playKeyClickSound(750, 0.02);
                    const idx = el.getAttribute('data-index');
                    formula = historyLog[idx].res.replace(/,/g, '');
                    updateDisplay();
                    closeHistory();
                });
            });
        }

        function openHistory() {
            historyDrawer.classList.add('open');
            historyBackdrop.classList.add('open');
        }

        function closeHistory() {
            historyDrawer.classList.remove('open');
            historyBackdrop.classList.remove('open');
        }

        function createRipple(e) {
            const btn = e.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;

            const rect = btn.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = btn.getElementsByClassName('ripple')[0];
            if (ripple) ripple.remove();

            btn.appendChild(circle);
        }

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                triggerHaptic();
                
                createRipple(e);

                const val = btn.getAttribute('data-value');
                const action = btn.getAttribute('data-action');

                if (action === 'equals') {
                    playKeyClickSound(850, 0.035);
                } else if (action === 'clear') {
                    playKeyClickSound(450, 0.03);
                } else {
                    playKeyClickSound(650, 0.025);
                }

                if (val) {
                    appendValue(val);
                } else if (action) {
                    switch (action) {
                        case 'clear': clearAll(); break;
                        case 'backspace': handleBackspace(); break;
                        case 'parens': handleParentheses(); break;
                        case 'equals': calculateFinalResult(); break;
                        case 'sin': appendValue(isInverse ? 'asin(' : 'sin('); break;
                        case 'cos': appendValue(isInverse ? 'acos(' : 'cos('); break;
                        case 'tan': appendValue(isInverse ? 'atan(' : 'tan('); break;
                        case 'ln': appendValue('ln('); break;
                        case 'log': appendValue('log('); break;
                        case 'sqrt': appendValue('√('); break;
                        case 'power': appendValue('^'); break;
                        case 'fact': appendValue('!'); break;
                        case 'pi': appendValue('π'); break;
                        case 'e': appendValue('e'); break;
                    }
                }
            });
        });

        soundToggleBtn.addEventListener('click', () => {
            triggerHaptic();
            soundEnabled = !soundEnabled;
            localStorage.setItem('android_calc_sound', soundEnabled);
            updateSoundUI();
            if (soundEnabled) {
                playKeyClickSound(700, 0.03);
            }
        });

        degRadBtn.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(600, 0.02);
            isAngleRad = !isAngleRad;
            degRadBtn.innerText = isAngleRad ? 'RAD' : 'DEG';
            degRadBtn.classList.toggle('active', isAngleRad);
            updateDisplay();
        });

        invBtn.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(600, 0.02);
            isInverse = !isInverse;
            invBtn.classList.toggle('active', isInverse);
            
            const sinBtn = document.querySelector('[data-action="sin"]');
            const cosBtn = document.querySelector('[data-action="cos"]');
            const tanBtn = document.querySelector('[data-action="tan"]');

            if (isInverse) {
                if (sinBtn) sinBtn.innerText = 'sin⁻¹';
                if (cosBtn) cosBtn.innerText = 'cos⁻¹';
                if (tanBtn) tanBtn.innerText = 'tan⁻¹';
            } else {
                if (sinBtn) sinBtn.innerText = 'sin';
                if (cosBtn) cosBtn.innerText = 'cos';
                if (tanBtn) tanBtn.innerText = 'tan';
            }
        });

        historyToggleBtn.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(600, 0.02);
            openHistory();
        });

        closeHistoryBtn.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(500, 0.02);
            closeHistory();
        });

        historyBackdrop.addEventListener('click', () => {
            triggerHaptic();
            closeHistory();
        });
        
        clearHistoryBtn.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(400, 0.03);
            historyLog = [];
            localStorage.removeItem('android_calc_history');
            renderHistoryDrawer();
        });

        sciToggleBar.addEventListener('click', () => {
            triggerHaptic();
            playKeyClickSound(600, 0.02);
            const isExpanded = sciPanelWrapper.classList.toggle('expanded');
            sciChevron.style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        window.addEventListener('keydown', (e) => {
            triggerHaptic();
            playKeyClickSound(650, 0.02);
            if (e.key >= '0' && e.key <= '9') appendValue(e.key);
            else if (e.key === '.') appendValue('.');
            else if (e.key === '+') appendValue('+');
            else if (e.key === '-') appendValue('−');
            else if (e.key === '*') appendValue('×');
            else if (e.key === '/') appendValue('÷');
            else if (e.key === '%') appendValue('%');
            else if (e.key === '^') appendValue('^');
            else if (e.key === '!') appendValue('!');
            else if (e.key === '(') appendValue('(');
            else if (e.key === ')') appendValue(')');
            else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculateFinalResult(); }
            else if (e.key === 'Backspace') handleBackspace();
            else if (e.key === 'Escape') {
                if (historyDrawer.classList.contains('open')) closeHistory();
                else clearAll();
            }
        });

        window.onload = () => {
            updateSoundUI();
            renderHistoryDrawer();
            updateDisplay();
        };
    </script>
</body>
</html>
