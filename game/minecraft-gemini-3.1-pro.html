<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 16px; height: 16px;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        
        #start-screen {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }
        #start-screen h1 { margin-top: 0; color: #4CAF50; }
        #start-screen p { line-height: 1.6; }
        .key { background: #555; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        #hotbar {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 5px;
        }
        .slot {
            width: 44px; height: 44px;
            border: 3px solid #555;
            border-radius: 4px;
            background-color: rgba(0,0,0,0.6);
            background-size: cover;
            image-rendering: pixelated;
            position: relative;
            transition: transform 0.1s;
        }
        .slot.active {
            border-color: white;
            transform: scale(1.1);
            z-index: 10;
        }
        .slot span {
            position: absolute;
            bottom: 2px; right: 4px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="start-screen">
            <h1>WebCraft 3D</h1>
            <p>點擊畫面開始遊戲 (Esc 暫停)</p>
            <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> 移動 | <span class="key">空白鍵</span> 跳躍</p>
            <p><span class="key">左鍵</span> 破壞方塊 | <span class="key">右鍵</span> 放置方塊</p>
            <p><span class="key">1</span> - <span class="key">5</span> 切換方塊類型</p>
        </div>
        <div id="hotbar" style="display: none;">
            <div class="slot active" id="slot-1"><span>1</span></div>
            <div class="slot" id="slot-2"><span>2</span></div>
            <div class="slot" id="slot-3"><span>3</span></div>
            <div class="slot" id="slot-4"><span>4</span></div>
            <div class="slot" id="slot-5"><span>5</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 全域變數與遊戲設定 ---
        const MAX_INSTANCES = 100000;
        let scene, camera, renderer, controls;
        const clock = new THREE.Clock();
        const world = new Map(); // 記錄方塊位置: `${x}_${y}_${z}` -> blockData
        const terrainMeshes = [];

        // 玩家物理狀態
        const player = {
            box: new THREE.Vector3(0, 25, 0),
            velocity: new THREE.Vector3(),
            radius: 0.35,
            height: 1.7,
            onGround: false,
            speed: 6.5,
            jumpPower: 9
        };
        const keys = { w: false, a: false, s: false, d: false, space: false };

        // --- 程式化紋理生成 ---
        function generateNoiseTexture(baseColor, varColor, isLeaves = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, 16, 16);
            for(let i = 0; i < 16; i++) {
                for(let j = 0; j < 16; j++) {
                    if(Math.random() > 0.4) {
                        ctx.fillStyle = varColor;
                        ctx.fillRect(i, j, 1, 1);
                    }
                    if(isLeaves && Math.random() > 0.7) ctx.clearRect(i, j, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function generateGrassSideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5c4033'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<16; i++) {
                for(let j=0; j<16; j++) {
                    if(Math.random() > 0.5) {
                        ctx.fillStyle = '#6b4e3f'; ctx.fillRect(i, j, 1, 1);
                    }
                }
            }
            for(let i=0; i<16; i++) {
                let depth = 3 + Math.floor(Math.random() * 3);
                for(let j=0; j<depth; j++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#4d8b31' : '#5a9b3d';
                    ctx.fillRect(i, j, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrassTop = generateNoiseTexture('#4d8b31', '#5a9b3d');
        const texGrassSide = generateGrassSideTexture();
        const texDirt = generateNoiseTexture('#5c4033', '#6b4e3f');
        const texStone = generateNoiseTexture('#666666', '#777777');
        const texWoodTop = generateNoiseTexture('#4a3022', '#3d2519');
        const texWoodSide = generateNoiseTexture('#5c4033', '#4a3022');
        const texLeaves = generateNoiseTexture('#2d5a27', '#1e3f1b', true);

        const materials = {
            grassTop: new THREE.MeshLambertMaterial({ map: texGrassTop }),
            grassSide: new THREE.MeshLambertMaterial({ map: texGrassSide }),
            dirt: new THREE.MeshLambertMaterial({ map: texDirt }),
            stone: new THREE.MeshLambertMaterial({ map: texStone }),
            woodTop: new THREE.MeshLambertMaterial({ map: texWoodTop }),
            woodSide: new THREE.MeshLambertMaterial({ map: texWoodSide }),
            leaves: new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, alphaTest: 0.3 })
        };

        const blockTypes = {
            GRASS: { mats: [materials.grassSide, materials.grassSide, materials.grassTop, materials.dirt, materials.grassSide, materials.grassSide], count: 0, freeIds: [], uiTex: texGrassSide },
            DIRT:  { mats: materials.dirt, count: 0, freeIds: [], uiTex: texDirt },
            STONE: { mats: materials.stone, count: 0, freeIds: [], uiTex: texStone },
            WOOD:  { mats: [materials.woodSide, materials.woodSide, materials.woodTop, materials.woodTop, materials.woodSide, materials.woodSide], count: 0, freeIds: [], uiTex: texWoodSide },
            LEAVES:{ mats: materials.leaves, count: 0, freeIds: [], uiTex: texLeaves }
        };

        let currentBlockType = 'GRASS';
        const dummy = new THREE.Object3D();
        
        const highlightBox = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(1.005, 1.005, 1.005)),
            new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
        );

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), new THREE.MeshBasicMaterial({color: 0xffffee}));
            sunMesh.position.copy(sunLight.position);
            scene.add(sunMesh);

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            for(const key in blockTypes) {
                const type = blockTypes[key];
                type.mesh = new THREE.InstancedMesh(geometry, type.mats, MAX_INSTANCES);
                type.mesh.count = 0; // [優化] 預設繪製數量為 0，避免 GPU 繪製數十萬個隱藏方塊
                type.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                type.mesh.castShadow = true;
                type.mesh.receiveShadow = true;
                scene.add(type.mesh);
                terrainMeshes.push(type.mesh);
            }

            scene.add(highlightBox);
            highlightBox.visible = false;

            document.getElementById('slot-1').style.backgroundImage = `url(${blockTypes.GRASS.uiTex.image.toDataURL()})`;
            document.getElementById('slot-2').style.backgroundImage = `url(${blockTypes.DIRT.uiTex.image.toDataURL()})`;
            document.getElementById('slot-3').style.backgroundImage = `url(${blockTypes.STONE.uiTex.image.toDataURL()})`;
            document.getElementById('slot-4').style.backgroundImage = `url(${blockTypes.WOOD.uiTex.image.toDataURL()})`;
            document.getElementById('slot-5').style.backgroundImage = `url(${blockTypes.LEAVES.uiTex.image.toDataURL()})`;

            generateWorld();

            controls = new PointerLockControls(camera, document.body);
            const startScreen = document.getElementById('start-screen');
            const hotbar = document.getElementById('hotbar');
            
            startScreen.addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => {
                startScreen.style.opacity = '0';
                setTimeout(() => startScreen.style.display = 'none', 300);
                hotbar.style.display = 'flex';
            });
            controls.addEventListener('unlock', () => {
                startScreen.style.display = 'block';
                setTimeout(() => startScreen.style.opacity = '1', 10);
                hotbar.style.display = 'none';
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('resize', onWindowResize);
        }

        function generateWorld() {
            const size = 35;
            for(let x = -size; x <= size; x++) {
                for(let z = -size; z <= size; z++) {
                    let h = Math.sin(x * 0.1) * 2.5 + Math.cos(z * 0.1) * 2.5;
                    h += Math.sin(x * 0.05 + z * 0.05) * 4;
                    h += Math.sin(x * 0.2) * 1;
                    h = Math.floor(h);

                    setBlock(x, h, z, 'GRASS', false); // [優化] 批量生成期間不更新 GPU
                    for(let i = 1; i <= 3; i++) setBlock(x, h - i, z, 'DIRT', false);
                    for(let i = 4; i <= 8; i++) setBlock(x, h - i, z, 'STONE', false);
                    setBlock(x, -9, z, 'STONE', false);

                    if(Math.random() < 0.015 && x > -size+3 && x < size-3 && z > -size+3 && z < size-3) {
                        generateTree(x, h + 1, z);
                    }
                }
            }
            // [優化] 生成完畢後一次性上傳矩陣至 GPU
            for(const key in blockTypes) {
                blockTypes[key].mesh.instanceMatrix.needsUpdate = true;
            }

            let spawnY = 20;
            while(checkCollision(new THREE.Vector3(0, spawnY, 0))) spawnY++;
            player.box.set(0, spawnY + 1, 0);
        }

        function generateTree(x, y, z) {
            const height = 4 + Math.floor(Math.random() * 3);
            for(let i = 0; i < height; i++) setBlock(x, y + i, z, 'WOOD', false);
            for(let lx = -2; lx <= 2; lx++) {
                for(let lz = -2; lz <= 2; lz++) {
                    for(let ly = 0; ly <= 2; ly++) {
                        if(Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly === 2) continue;
                        if(lx === 0 && lz === 0 && ly < 2) continue;
                        setBlock(x + lx, y + height - 2 + ly, z + lz, 'LEAVES', false);
                    }
                }
            }
        }

        function setBlock(x, y, z, typeKey, updateGPU = true) {
            const key = `${x}_${y}_${z}`;
            if(world.has(key)) return;

            const type = blockTypes[typeKey];
            let id;
            if(type.freeIds.length > 0) {
                id = type.freeIds.pop();
            } else {
                if(type.count >= MAX_INSTANCES) return;
                id = type.count++;
            }

            // [優化] 確保 GPU 只繪製被使用的實例數量
            if (id >= type.mesh.count) {
                type.mesh.count = id + 1;
            }

            dummy.position.set(x, y, z);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();
            type.mesh.setMatrixAt(id, dummy.matrix);
            
            if (updateGPU) type.mesh.instanceMatrix.needsUpdate = true;

            world.set(key, { type: typeKey, instanceId: id, x, y, z });
        }

        function removeBlock(x, y, z) {
            const key = `${x}_${y}_${z}`;
            if(!world.has(key)) return;

            const block = world.get(key);
            const type = blockTypes[block.type];

            dummy.position.set(0, 0, 0);
            dummy.scale.set(0, 0, 0);
            dummy.updateMatrix();
            type.mesh.setMatrixAt(block.instanceId, dummy.matrix);
            type.mesh.instanceMatrix.needsUpdate = true;

            type.freeIds.push(block.instanceId);
            world.delete(key);
        }

        // --- 物理與碰撞系統 ---
        function checkCollision(pos) {
            const minX = Math.floor(pos.x - player.radius);
            const maxX = Math.floor(pos.x + player.radius);
            const minY = Math.floor(pos.y);
            const maxY = Math.floor(pos.y + player.height - 0.1);
            const minZ = Math.floor(pos.z - player.radius);
            const maxZ = Math.floor(pos.z + player.radius);

            for(let x = minX; x <= maxX; x++) {
                for(let y = minY; y <= maxY; y++) {
                    for(let z = minZ; z <= maxZ; z++) {
                        if(world.has(`${x}_${y}_${z}`)) return true;
                    }
                }
            }
            return false;
        }

        function checkPlayerOverlap(bx, by, bz) {
            const minX = player.box.x - player.radius;
            const maxX = player.box.x + player.radius;
            const minY = player.box.y;
            const maxY = player.box.y + player.height;
            const minZ = player.box.z - player.radius;
            const maxZ = player.box.z + player.radius;

            const bMinX = bx - 0.5, bMaxX = bx + 0.5;
            const bMinY = by - 0.5, bMaxY = by + 0.5;
            const bMinZ = bz - 0.5, bMaxZ = bz + 0.5;

            return (minX <= bMaxX && maxX >= bMinX) &&
                   (minY <= bMaxY && maxY >= bMinY) &&
                   (minZ <= bMaxZ && maxZ >= bMinZ);
        }

        // --- [核心優化] DDA Voxel Raycaster ---
        // 取代 Three.js 內建極慢的 raycaster.intersectObjects
        function raycastVoxel() {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const origin = camera.position;

            let x = Math.round(origin.x);
            let y = Math.round(origin.y);
            let z = Math.round(origin.z);

            const stepX = Math.sign(dir.x);
            const stepY = Math.sign(dir.y);
            const stepZ = Math.sign(dir.z);

            const boundX = x + (stepX > 0 ? 0.5 : -0.5);
            const boundY = y + (stepY > 0 ? 0.5 : -0.5);
            const boundZ = z + (stepZ > 0 ? 0.5 : -0.5);

            let tMaxX = dir.x !== 0 ? (boundX - origin.x) / dir.x : Infinity;
            let tMaxY = dir.y !== 0 ? (boundY - origin.y) / dir.y : Infinity;
            let tMaxZ = dir.z !== 0 ? (boundZ - origin.z) / dir.z : Infinity;

            const tDeltaX = dir.x !== 0 ? Math.abs(1 / dir.x) : Infinity;
            const tDeltaY = dir.y !== 0 ? Math.abs(1 / dir.y) : Infinity;
            const tDeltaZ = dir.z !== 0 ? Math.abs(1 / dir.z) : Infinity;

            const normal = new THREE.Vector3();
            const maxDist = 6;

            for (let i = 0; i < 30; i++) { 
                if (world.has(`${x}_${y}_${z}`)) {
                    return { x, y, z, normal };
                }

                if (tMaxX < tMaxY) {
                    if (tMaxX < tMaxZ) {
                        if (tMaxX > maxDist) break;
                        x += stepX;
                        tMaxX += tDeltaX;
                        normal.set(-stepX, 0, 0);
                    } else {
                        if (tMaxZ > maxDist) break;
                        z += stepZ;
                        tMaxZ += tDeltaZ;
                        normal.set(0, 0, -stepZ);
                    }
                } else {
                    if (tMaxY < tMaxZ) {
                        if (tMaxY > maxDist) break;
                        y += stepY;
                        tMaxY += tDeltaY;
                        normal.set(0, -stepY, 0);
                    } else {
                        if (tMaxZ > maxDist) break;
                        z += stepZ;
                        tMaxZ += tDeltaZ;
                        normal.set(0, 0, -stepZ);
                    }
                }
            }
            return null;
        }

        function updatePhysics(delta) {
            delta = Math.min(delta, 0.1);
            
            player.velocity.y -= 25 * delta;
            player.velocity.y = Math.max(player.velocity.y, -20);

            const moveDir = new THREE.Vector3();
            controls.getDirection(moveDir);
            moveDir.y = 0; moveDir.normalize();
            
            const rightDir = new THREE.Vector3();
            rightDir.copy(moveDir).cross(camera.up).normalize();

            let velX = 0, velZ = 0;
            if(keys.w) { velX += moveDir.x; velZ += moveDir.z; }
            if(keys.s) { velX -= moveDir.x; velZ -= moveDir.z; }
            if(keys.a) { velX -= rightDir.x; velZ -= rightDir.z; }
            if(keys.d) { velX += rightDir.x; velZ += rightDir.z; }

            const length = Math.sqrt(velX * velX + velZ * velZ);
            if(length > 0) {
                velX = (velX / length) * player.speed;
                velZ = (velZ / length) * player.speed;
            }

            player.velocity.x = velX;
            player.velocity.z = velZ;

            player.box.x += player.velocity.x * delta;
            if(checkCollision(player.box)) player.box.x -= player.velocity.x * delta;

            player.box.z += player.velocity.z * delta;
            if(checkCollision(player.box)) player.box.z -= player.velocity.z * delta;

            player.box.y += player.velocity.y * delta;
            if(checkCollision(player.box)) {
                if(player.velocity.y < 0) player.onGround = true;
                player.box.y -= player.velocity.y * delta;
                player.velocity.y = 0;
            } else {
                player.onGround = false;
            }

            camera.position.set(player.box.x, player.box.y + 1.5, player.box.z);
        }

        function onKeyDown(e) {
            if(e.code === 'KeyW') keys.w = true;
            if(e.code === 'KeyS') keys.s = true;
            if(e.code === 'KeyA') keys.a = true;
            if(e.code === 'KeyD') keys.d = true;
            if(e.code === 'Space' && player.onGround) {
                player.velocity.y = player.jumpPower;
                player.onGround = false;
            }
            if(e.key >= '1' && e.key <= '5') {
                const types = Object.keys(blockTypes);
                currentBlockType = types[parseInt(e.key) - 1];
                document.querySelectorAll('.slot').forEach(el => el.classList.remove('active'));
                document.getElementById(`slot-${e.key}`).classList.add('active');
            }
        }

        function onKeyUp(e) {
            if(e.code === 'KeyW') keys.w = false;
            if(e.code === 'KeyS') keys.s = false;
            if(e.code === 'KeyA') keys.a = false;
            if(e.code === 'KeyD') keys.d = false;
        }

        function onMouseDown(e) {
            if(!controls.isLocked) return;
            
            const hit = raycastVoxel();

            if(hit) {
                if(e.button === 0) {
                    removeBlock(hit.x, hit.y, hit.z);
                } else if(e.button === 2) {
                    const bx = hit.x + hit.normal.x;
                    const by = hit.y + hit.normal.y;
                    const bz = hit.z + hit.normal.z;
                    if(!checkPlayerOverlap(bx, by, bz)) {
                        setBlock(bx, by, bz, currentBlockType);
                    }
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if(controls.isLocked) {
                updatePhysics(clock.getDelta());

                // [優化] 使用極速 DDA 取得高光框位置
                const hit = raycastVoxel();
                if(hit) {
                    highlightBox.position.set(hit.x, hit.y, hit.z);
                    highlightBox.visible = true;
                } else {
                    highlightBox.visible = false;
                }
            } else {
                clock.getDelta();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
