<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Minecraft</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-top: -6px;
            margin-left: -6px;
            pointer-events: none;
            color: #ffffff;
            font-size: 24px;
            line-height: 12px;
            text-align: center;
            z-index: 5;
        }
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            color: #ffffff;
            z-index: 5;
        }
        .slot {
            width: 60px;
            height: 40px;
            border: 2px solid #555555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
        }
        .slot.active {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <div id="crosshair">+</div>
    <div id="blocker">
        <h1 style="margin-bottom: 5px;">Three.js Minecraft</h1>
        <p>Click anywhere to play</p>
        <p><strong>WASD</strong>: Move | <strong>Space / Shift</strong>: Up / Down</p>
        <p><strong>Left Click</strong>: Break Block | <strong>Right Click</strong>: Place Block</p>
        <p><strong>Keys 1, 2, 3</strong>: Select Material</p>
    </div>
    <div id="inventory">
        <div class="slot active" id="slot-1">1: Grass</div>
        <div class="slot" id="slot-2">2: Dirt</div>
        <div class="slot" id="slot-3">3: Stone</div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // Setup scene, camera, and WebGL renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // First-person PointerLock controls
        const controls = new THREE.PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');

        blocker.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'flex');
        scene.add(controls.getObject());

        // Keyboard navigation state
        const moveState = { forward: false, backward: false, left: false, right: false, up: false, down: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'Space': moveState.up = true; break;
                case 'ShiftLeft': moveState.down = true; break;
                case 'Digit1': selectBlock(1); break;
                case 'Digit2': selectBlock(2); break;
                case 'Digit3': selectBlock(3); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
                case 'Space': moveState.up = false; break;
                case 'ShiftLeft': moveState.down = false; break;
            }
        });

        // Block definition & selection
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const materials = {
            1: new THREE.MeshLambertMaterial({ color: 0x44aa44 }), // Grass
            2: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // Dirt
            3: new THREE.MeshLambertMaterial({ color: 0x808080 })  // Stone
        };

        let selectedBlockType = 1;
        function selectBlock(type) {
            selectedBlockType = type;
            document.querySelectorAll('.slot').forEach((el, idx) => {
                el.classList.toggle('active', idx + 1 === type);
            });
        }

        // Voxel World Grid Storage
        const blocks = new Map();
        const WORLD_SIZE = 12;

        function getBlockKey(x, y, z) {
            return `${x},${y},${z}`;
        }

        function createBlock(x, y, z, type) {
            const key = getBlockKey(x, y, z);
            if (blocks.has(key)) return;

            const mesh = new THREE.Mesh(geometry, materials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.set(key, mesh);
        }

        function removeBlock(x, y, z) {
            const key = getBlockKey(x, y, z);
            const mesh = blocks.get(key);
            if (mesh) {
                scene.remove(mesh);
                blocks.delete(key);
            }
        }

        // Procedural terrain generation
        for (let x = -WORLD_SIZE; x <= WORLD_SIZE; x++) {
            for (let z = -WORLD_SIZE; z <= WORLD_SIZE; z++) {
                const height = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2) + 2;
                for (let y = 0; y <= height; y++) {
                    let type = 3; // Stone base
                    if (y === height) type = 1; // Grass surface
                    else if (y >= height - 2) type = 2; // Dirt middle layer
                    createBlock(x, y, z, type);
                }
            }
        }

        // Camera initial position
        camera.position.set(0, 6, 12);

        // Raycasting for block interaction (mining & placing)
        const raycaster = new THREE.Raycaster();
        const centerPointer = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(centerPointer, camera);
            const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const pos = intersect.object.position;

                if (e.button === 0) { 
                    // Left Click: Destroy Block
                    removeBlock(pos.x, pos.y, pos.z);
                } else if (e.button === 2) { 
                    // Right Click: Place Block on targeted face
                    const normal = intersect.face.normal;
                    createBlock(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z, selectedBlockType);
                }
            }
        });

        // Prevent standard right-click context menu
        window.addEventListener('contextmenu', e => e.preventDefault());

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Game Loop
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (controls.isLocked) {
                const speed = 10.0;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.y = Number(moveState.up) - Number(moveState.down);
                direction.normalize();

                if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * 25.0 * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * speed * 25.0 * delta;
                if (moveState.up || moveState.down) velocity.y -= direction.y * speed * 25.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += velocity.y * delta;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
