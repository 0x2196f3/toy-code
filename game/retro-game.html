                        this.objects.push(new Triangle(top, b1, b2, cyanMat));
                        this.objects.push(new Triangle(top, b2, b0, cyanMat));

                        this.objects.push(new Sphere([7, 4, -6], 2.2, limeMat));
                    }

                    updateLight(time, isOrbiting) {
                        if (isOrbiting) {
                            const angle = time * 0.0012;
                            this.lightPos[0] = Math.cos(angle) * 18;
                            this.lightPos[1] = 14 + Math.sin(angle * 2) * 4;
                            this.lightPos[2] = Math.sin(angle) * 18;
                        }
                    }
                }

                class RayTracerEngine {
                    constructor(canvas) {
                        this.canvas = canvas;
                        this.ctx = canvas.getContext('2d', {alpha: false, willReadFrequently: false});
                        this.targetWidth = 400; this.targetHeight = 400;
                        this.imageData = this.ctx.createImageData(this.targetWidth, this.targetHeight);
                        this.pixelBuffer = this.imageData.data;
                        this.enableShadows = true; this.enableReflections = true;
                        this.maxRecursionDepth = 2;
                        this.camera = {yaw: 0.5, pitch: 0.3, distance: 38, fov: 55 * (Math.PI / 180)};

                        this.primaryRay = new Ray(); this.shadowRay = new Ray();
                        this.reflectRays = [new Ray(), new Ray(), new Ray(), new Ray()];
                        this.tempColors = [new Float32Array(3), new Float32Array(3), new Float32Array(3), new Float32Array(3)];
                        this.raysCastCount = 0;
                        this.scene = null;
                    }

                    setResolution(width) {
                        const aspect = 1;//4 / 3;
                        this.targetWidth = width; this.targetHeight = Math.floor(width / aspect);
                        this.canvas.width = this.targetWidth; this.canvas.height = this.targetHeight;
                        this.imageData = this.ctx.createImageData(this.targetWidth, this.targetHeight);
                        this.pixelBuffer = this.imageData.data;
                    }

                    compileScene(scene) {
                        const objs = scene.objects;
                        const mats = [];
                        const sph = [], pln = [], cyl = [], tri = [];
                        const sphM = [], plnM = [], cylM = [], triM = [];
                        const matIndex = (m) => {
                            let i = mats.indexOf(m);
                            if (i < 0) {i = mats.length; mats.push(m);}
                            return i;
                        };
                        for (let k = 0; k < objs.length; k++) {
                            const o = objs[k];
                            const mi = matIndex(o.material);
                            if (o.type === 'sphere') {
                                sph.push(o.cx, o.cy, o.cz, o.radiusSq, o.invRadius); sphM.push(mi);
                            } else if (o.type === 'plane') {
                                pln.push(o.px, o.py, o.pz, o.nx, o.ny, o.nz); plnM.push(mi);
                            } else if (o.type === 'cylinder') {
                                cyl.push(o.cx, o.cy, o.cz, o.radiusSq, o.invRadius, o.halfH); cylM.push(mi);
                            } else if (o.type === 'triangle') {
                                tri.push(o.v0x, o.v0y, o.v0z, o.e1x, o.e1y, o.e1z, o.e2x, o.e2y, o.e2z, o.nx, o.ny, o.nz);
                                triM.push(mi);
                            }
                        }
                        this.sph = Float64Array.from(sph); this.sphM = Int32Array.from(sphM); this.nSph = sphM.length;
                        this.pln = Float64Array.from(pln); this.plnM = Int32Array.from(plnM); this.nPl = plnM.length;
                        this.cyl = Float64Array.from(cyl); this.cylM = Int32Array.from(cylM); this.nCyl = cylM.length;
                        this.tri = Float64Array.from(tri); this.triM = Int32Array.from(triM); this.nTri = triM.length;

                        const n = mats.length;
                        const mR = new Float64Array(n), mG = new Float64Array(n), mB = new Float64Array(n);
                        const mRefl = new Float64Array(n), mSpec = new Float64Array(n), mCheck = new Uint8Array(n);
                        for (let i = 0; i < n; i++) {
                            const m = mats[i];
                            mR[i] = m.color[0]; mG[i] = m.color[1]; mB[i] = m.color[2];
                            mRefl[i] = m.reflectivity; mSpec[i] = m.specular; mCheck[i] = m.isCheckerboard ? 1 : 0;
                        }
                        this.matR = mR; this.matG = mG; this.matB = mB;
                        this.matRefl = mRefl; this.matSpec = mSpec; this.matCheck = mCheck;
                        this.scene = scene;
                    }

                    render(scene) {
                        if (this.scene !== scene) this.compileScene(scene);

                        const width = this.targetWidth, height = this.targetHeight, buffer = this.pixelBuffer;
                        const eye = Vec3.create(
                            this.camera.distance * Math.cos(this.camera.pitch) * Math.sin(this.camera.yaw),
                            this.camera.distance * Math.sin(this.camera.pitch),
                            this.camera.distance * Math.cos(this.camera.pitch) * Math.cos(this.camera.yaw)
                        );

                        const lookAt = Vec3.create(0, 0, 0);
                        const F = Vec3.create(); Vec3.sub(F, lookAt, eye); Vec3.normalize(F, F);
                        const R = Vec3.create(); Vec3.cross(R, F, Vec3.create(0, 1, 0)); Vec3.normalize(R, R);
                        const U = Vec3.create(); Vec3.cross(U, R, F); Vec3.normalize(U, U);

                        const aspectScale = (width / height) * Math.tan(this.camera.fov * 0.5);
                        const scale = Math.tan(this.camera.fov * 0.5);
                        const invWidth = 1.0 / width, invHeight = 1.0 / height;

                        let pixelIdx = 0;
                        this.raysCastCount = 0;
                        const outColor = new Float32Array(3);

                        const pr = this.primaryRay;
                        pr.ox = eye[0]; pr.oy = eye[1]; pr.oz = eye[2];

                        for (let y = 0; y < height; y++) {
                            const vy = (1 - 2 * ((y + 0.5) * invHeight)) * scale;
                            const vyUx = vy * U[0], vyUy = vy * U[1], vyUz = vy * U[2];

                            for (let x = 0; x < width; x++) {
                                const vx = (2 * ((x + 0.5) * invWidth) - 1) * aspectScale;

                                const dx = F[0] + vx * R[0] + vyUx;
                                const dy = F[1] + vx * R[1] + vyUy;
                                const dz = F[2] + vx * R[2] + vyUz;

                                const invDlen = 1.0 / Math.sqrt(dx * dx + dy * dy + dz * dz);
                                pr.dx = dx * invDlen;
                                pr.dy = dy * invDlen;
                                pr.dz = dz * invDlen;

                                this.traceRay(pr, scene, 0, outColor);

                                let r = (outColor[0] * 255) | 0;
                                let g = (outColor[1] * 255) | 0;
                                let b = (outColor[2] * 255) | 0;

                                buffer[pixelIdx] = r;
                                buffer[pixelIdx + 1] = g;
                                buffer[pixelIdx + 2] = b;
                                buffer[pixelIdx + 3] = 255;

                                pixelIdx += 4;
                            }
                        }
                        this.ctx.putImageData(this.imageData, 0, 0);
                    }

                    traceRay(ray, scene, depth, out) {
                        this.raysCastCount++;

                        const ox = ray.ox, oy = ray.oy, oz = ray.oz;
                        const dx = ray.dx, dy = ray.dy, dz = ray.dz;

                        const sph = this.sph, nSph = this.nSph;
                        const pln = this.pln, nPl = this.nPl;
                        const cyl = this.cyl, nCyl = this.nCyl;
                        const tri = this.tri, nTri = this.nTri;

                        let bestT = Infinity;
                        let bpx = 0, bpy = 0, bpz = 0, bnx = 0, bny = 0, bnz = 0, bm = -1;

                        for (let i = 0, j = 0; i < nSph; i++, j += 5) {
                            const ocx = ox - sph[j], ocy = oy - sph[j + 1], ocz = oz - sph[j + 2];
                            const b = ocx * dx + ocy * dy + ocz * dz;
                            const disc = b * b - (ocx * ocx + ocy * ocy + ocz * ocz - sph[j + 3]);
                            if (disc > 0) {
                                const sq = Math.sqrt(disc);
                                let t = -b - sq;
                                if (t < 0.001) t = -b + sq;
                                if (t > 0.001 && t < bestT) {
                                    bestT = t;
                                    bpx = ox + t * dx; bpy = oy + t * dy; bpz = oz + t * dz;
                                    const ir = sph[j + 4];
                                    bnx = (bpx - sph[j]) * ir; bny = (bpy - sph[j + 1]) * ir; bnz = (bpz - sph[j + 2]) * ir;
                                    bm = this.sphM[i];
                                }
                            }
                        }

                        for (let i = 0, j = 0; i < nPl; i++, j += 6) {
                            const nx = pln[j + 3], ny = pln[j + 4], nz = pln[j + 5];
                            const denom = nx * dx + ny * dy + nz * dz;
                            if (denom > 0.0001 || denom < -0.0001) {
                                const t = ((pln[j] - ox) * nx + (pln[j + 1] - oy) * ny + (pln[j + 2] - oz) * nz) / denom;
                                if (t > 0.001 && t < bestT) {
                                    bestT = t;
                                    bpx = ox + t * dx; bpy = oy + t * dy; bpz = oz + t * dz;
                                    if (denom > 0) {bnx = -nx; bny = -ny; bnz = -nz;}
                                    else {bnx = nx; bny = ny; bnz = nz;}
                                    bm = this.plnM[i];
                                }
                            }
                        }

                        for (let i = 0, j = 0; i < nCyl; i++, j += 6) {
                            const cx = cyl[j], cy = cyl[j + 1], cz = cyl[j + 2];
                            const hh = cyl[j + 5];
                            const oxc = ox - cx, ozc = oz - cz;
                            const a = dx * dx + dz * dz;
                            let selT = Infinity, found = false, nx = 0, ny = 0, nz = 0;
                            if (a >= 0.00001) {
                                const b = 2 * (oxc * dx + ozc * dz);
                                const disc = b * b - 4 * a * (oxc * oxc + ozc * ozc - cyl[j + 3]);
                                if (disc >= 0) {
                                    const sq = Math.sqrt(disc), inv2a = 0.5 / a;
                                    let t = (-b - sq) * inv2a;
                                    let dyOff = oy + t * dy - cy;
                                    if (t > 0.001 && t < bestT && (dyOff <= hh && dyOff >= -hh)) {
                                        selT = t; found = true;
                                        const ir = cyl[j + 4];
                                        nx = (ox + t * dx - cx) * ir; nz = (oz + t * dz - cz) * ir;
                                    } else {
                                        t = (-b + sq) * inv2a;
                                        dyOff = oy + t * dy - cy;
                                        if (t > 0.001 && t < bestT && (dyOff <= hh && dyOff >= -hh)) {
                                            selT = t; found = true;
                                            const ir = cyl[j + 4];
                                            nx = (ox + t * dx - cx) * ir; nz = (oz + t * dz - cz) * ir;
                                        }
                                    }
                                }
                            }
                            const invDy = 1.0 / dy;
                            const tTop = (cy + hh - oy) * invDy;
                            if (tTop > 0.001 && tTop < bestT && tTop < selT) {
                                const px = ox + tTop * dx - cx, pz = oz + tTop * dz - cz;
                                if (px * px + pz * pz <= cyl[j + 3]) {selT = tTop; found = true; nx = 0; ny = 1; nz = 0;}
                            }
                            const tBot = (cy - hh - oy) * invDy;
                            if (tBot > 0.001 && tBot < bestT && tBot < selT) {
                                const px = ox + tBot * dx - cx, pz = oz + tBot * dz - cz;
                                if (px * px + pz * pz <= cyl[j + 3]) {selT = tBot; found = true; nx = 0; ny = -1; nz = 0;}
                            }
                            if (found && selT < bestT) {
                                bestT = selT;
                                bpx = ox + selT * dx; bpy = oy + selT * dy; bpz = oz + selT * dz;
                                bnx = nx; bny = ny; bnz = nz;
                                bm = this.cylM[i];
                            }
                        }

                        for (let i = 0, j = 0; i < nTri; i++, j += 12) {
                            const e1x = tri[j + 3], e1y = tri[j + 4], e1z = tri[j + 5];
                            const e2x = tri[j + 6], e2y = tri[j + 7], e2z = tri[j + 8];
                            const hx = dy * e2z - dz * e2y;
                            const hy = dz * e2x - dx * e2z;
                            const hz = dx * e2y - dy * e2x;
                            const a = e1x * hx + e1y * hy + e1z * hz;
                            if (a > -0.00001 && a < 0.00001) continue;
                            const f = 1.0 / a;
                            const sx = ox - tri[j], sy = oy - tri[j + 1], sz = oz - tri[j + 2];
                            const u = f * (sx * hx + sy * hy + sz * hz);
                            if (u < 0.0 || u > 1.0) continue;
                            const qx = sy * e1z - sz * e1y;
                            const qy = sz * e1x - sx * e1z;
                            const qz = sx * e1y - sy * e1x;
                            const v = f * (dx * qx + dy * qy + dz * qz);
                            if (v < 0.0 || u + v > 1.0) continue;
                            const t = f * (e2x * qx + e2y * qy + e2z * qz);
                            if (t > 0.001 && t < bestT) {
                                bestT = t;
                                bpx = ox + t * dx; bpy = oy + t * dy; bpz = oz + t * dz;
                                bnx = tri[j + 9]; bny = tri[j + 10]; bnz = tri[j + 11];
                                bm = this.triM[i];
                            }
                        }

                        if (bm < 0) {
                            const t = 0.5 * (dy + 1.0);
                            const invT = 1 - t;
                            out[0] = 0.02 * invT + 0.05 * t;
                            out[1] = 0.04 * invT + 0.08 * t;
                            out[2] = 0.08 * invT + 0.18 * t;
                            return;
                        }

                        let cr = this.matR[bm], cg = this.matG[bm], cb = this.matB[bm];
                        if (this.matCheck[bm]) {
                            const check = (Math.floor(bpx * 0.3) + Math.floor(bpz * 0.3)) & 1;
                            if (check === 0) {cr = 0.12; cg = 0.15; cb = 0.22;}
                            else {cr = 0.85; cg = 0.88; cb = 0.92;}
                        }

                        const lpx = scene.lightPos[0], lpy = scene.lightPos[1], lpz = scene.lightPos[2];
                        const lcr = scene.lightColor[0], lcg = scene.lightColor[1], lcb = scene.lightColor[2];
                        const ambR = scene.ambientColor[0], ambG = scene.ambientColor[1], ambB = scene.ambientColor[2];

                        let ldx = lpx - bpx, ldy = lpy - bpy, ldz = lpz - bpz;
                        const lightDist = Math.sqrt(ldx * ldx + ldy * ldy + ldz * ldz);
                        const invLD = 1.0 / lightDist;
                        ldx *= invLD; ldy *= invLD; ldz *= invLD;

                        let r = cr * ambR, g = cg * ambG, b = cb * ambB;


                        const ndotl = bnx * ldx + bny * ldy + bnz * ldz;
                        if (ndotl > 0) {
                            let inShadow = false;
                            if (this.enableShadows) {
                                inShadow = this.occluded(bpx + bnx * 0.001, bpy + bny * 0.001, bpz + bnz * 0.001,
                                    ldx, ldy, ldz, lightDist);
                            }
                            if (!inShadow) {
                                const atten = 1.0 / (1.0 + 0.015 * lightDist + 0.0008 * lightDist * lightDist);
                                const ka = ndotl * atten;
                                r += cr * lcr * ka;
                                g += cg * lcg * ka;
                                b += cb * lcb * ka;

                                const spec = this.matSpec[bm];
                                if (spec > 0) {
                                    const d = ndotl * 2;
                                    let rx = d * bnx - ldx;
                                    let ry = d * bny - ldy;
                                    let rz = d * bnz - ldz;
                                    const len2 = rx * rx + ry * ry + rz * rz;
                                    if (len2 > 0.00000001) {
                                        const invRlen = 1.0 / Math.sqrt(len2);
                                        rx *= invRlen; ry *= invRlen; rz *= invRlen;
                                    }
                                    const rdotv = -(rx * dx + ry * dy + rz * dz);
                                    if (rdotv > 0) {
                                        let spBase = rdotv, spE = spec | 0, spAcc = 1;
                                        while (spE > 0) {if (spE & 1) spAcc *= spBase; spBase *= spBase; spE >>= 1;}
                                        const sp = spAcc * atten * 0.8;
                                        r += lcr * sp; g += lcg * sp; b += lcb * sp;
                                    }
                                }
                            }
                        }

                        const refl = this.matRefl[bm];
                        if (this.enableReflections && refl > 0 && depth < this.maxRecursionDepth) {
                            const refRay = this.reflectRays[depth];
                            refRay.ox = bpx + bnx * 0.001; refRay.oy = bpy + bny * 0.001; refRay.oz = bpz + bnz * 0.001;
                            const d = (dx * bnx + dy * bny + dz * bnz) * 2;
                            let rdx = dx - d * bnx;
                            let rdy = dy - d * bny;
                            let rdz = dz - d * bnz;
                            const len2 = rdx * rdx + rdy * rdy + rdz * rdz;
                            if (len2 > 0.00000001) {
                                const invDlen = 1.0 / Math.sqrt(len2);
                                rdx *= invDlen; rdy *= invDlen; rdz *= invDlen;
                            }
                            refRay.dx = rdx; refRay.dy = rdy; refRay.dz = rdz;

                            const tc = this.tempColors[depth];
                            this.traceRay(refRay, scene, depth + 1, tc);
                            const invRefl = 1 - refl;
                            r = r * invRefl + tc[0] * refl;
                            g = g * invRefl + tc[1] * refl;
                            b = b * invRefl + tc[2] * refl;
                        }

                        out[0] = r; out[1] = g; out[2] = b;
                    }

                    occluded(ox, oy, oz, dx, dy, dz, maxT) {
                        const sph = this.sph, nSph = this.nSph;
                        const pln = this.pln, nPl = this.nPl;
                        const cyl = this.cyl, nCyl = this.nCyl;
                        const tri = this.tri, nTri = this.nTri;

                        for (let i = 0, j = 0; i < nSph; i++, j += 5) {
                            const ocx = ox - sph[j], ocy = oy - sph[j + 1], ocz = oz - sph[j + 2];
                            const b = ocx * dx + ocy * dy + ocz * dz;
                            const disc = b * b - (ocx * ocx + ocy * ocy + ocz * ocz - sph[j + 3]);
                            if (disc > 0) {
                                const sq = Math.sqrt(disc);
                                let t = -b - sq;
                                if (t < 0.001) t = -b + sq;
                                if (t > 0.001 && t < maxT) return true;
                            }
                        }
                        for (let i = 0, j = 0; i < nPl; i++, j += 6) {
                            const nx = pln[j + 3], ny = pln[j + 4], nz = pln[j + 5];
                            const denom = nx * dx + ny * dy + nz * dz;
                            const num = (pln[j] - ox) * nx + (pln[j + 1] - oy) * ny + (pln[j + 2] - oz) * nz;
                            if ((num > 0) === (denom > 0) && (denom > 0.0001 || denom < -0.0001)) {
                                const t = num / denom;
                                if (t > 0.001 && t < maxT) return true;
                            }
                        }
                        for (let i = 0, j = 0; i < nCyl; i++, j += 6) {
                            const cx = cyl[j], cy = cyl[j + 1], cz = cyl[j + 2];
                            const hh = cyl[j + 5];
                            const oxc = ox - cx, ozc = oz - cz;
                            const a = dx * dx + dz * dz;
                            if (a >= 0.00001) {
                                const b = 2 * (oxc * dx + ozc * dz);
                                const disc = b * b - 4 * a * (oxc * oxc + ozc * ozc - cyl[j + 3]);
                                if (disc >= 0) {
                                    const sq = Math.sqrt(disc), inv2a = 0.5 / a;
                                    let t = (-b - sq) * inv2a;
                                    let dyOff = oy + t * dy - cy;
                                    if (t > 0.001 && t < maxT && (dyOff <= hh && dyOff >= -hh)) return true;
                                    t = (-b + sq) * inv2a;
                                    dyOff = oy + t * dy - cy;
                                    if (t > 0.001 && t < maxT && (dyOff <= hh && dyOff >= -hh)) return true;
                                }
                            }
                            const invDy = 1.0 / dy;
                            const tTop = (cy + hh - oy) * invDy;
                            if (tTop > 0.001 && tTop < maxT) {
                                const px = ox + tTop * dx - cx, pz = oz + tTop * dz - cz;
                                if (px * px + pz * pz <= cyl[j + 3]) return true;
                            }
                            const tBot = (cy - hh - oy) * invDy;
                            if (tBot > 0.001 && tBot < maxT) {
                                const px = ox + tBot * dx - cx, pz = oz + tBot * dz - cz;
                                if (px * px + pz * pz <= cyl[j + 3]) return true;
                            }
                        }
                        for (let i = 0, j = 0; i < nTri; i++, j += 12) {
                            const e1x = tri[j + 3], e1y = tri[j + 4], e1z = tri[j + 5];
                            const e2x = tri[j + 6], e2y = tri[j + 7], e2z = tri[j + 8];
                            const hx = dy * e2z - dz * e2y;
                            const hy = dz * e2x - dx * e2z;
                            const hz = dx * e2y - dy * e2x;
                            const a = e1x * hx + e1y * hy + e1z * hz;
                            if (a > -0.00001 && a < 0.00001) continue;
                            const f = 1.0 / a;
                            const sx = ox - tri[j], sy = oy - tri[j + 1], sz = oz - tri[j + 2];
                            const u = f * (sx * hx + sy * hy + sz * hz);
                            if (u < 0.0 || u > 1.0) continue;
                            const qx = sy * e1z - sz * e1y;
                            const qy = sz * e1x - sx * e1z;
                            const qz = sx * e1y - sy * e1x;
                            const v = f * (dx * qx + dy * qy + dz * qz);
                            if (v < 0.0 || u + v > 1.0) continue;
                            const t = f * (e2x * qx + e2y * qy + e2z * qz);
                            if (t > 0.001 && t < maxT) return true;
                        }
                        return false;
                    }
                }

                super(engine);
                this.engine = engine;
                this.id = '3DRTDemoGame';
                this.name = '3D Ray Tracer Demo';
                this.hint = 'enjoy';
                this.rtEngine = new RayTracerEngine(engine.canvas);
                this.scene = new Scene();
            }
            update(now) {
                this.scene.updateLight(now, true);
                this.rtEngine.camera.yaw += 0.008;
                this.rtEngine.render(this.scene);
            }
        }
    </script>

    <script>
        const engine = new GameEngine({
            canvas: '#gameCanvas',
            scoreEl: '#score',
            highScoreEl: '#highscore',
            overlay: '#overlay',
            overlayTitle: '#overlay-title',
            overlayMsg: '#overlay-msg',
            controlsHint: '#controls-hint',
        });

        window.themeManager = new ThemeManager();
        window.themeManager.register(new GameBoyTheme(), new FcTheme(), new SuperMarioTheme(), new StardewTheme(), new MinecraftTheme(), new CyberpunkTheme(), new RetroArcadeTheme(), new DoomTheme());

        window.themeManager.subscribe((activeTheme) => {
            if (activeTheme.audioProvider) {
                engine.setThemeAudioProvider(activeTheme.audioProvider);
            } else {
                engine.setThemeAudioProvider(new BaseAudioProvider());
            }
        });

        window.themeManager.applyTheme(0);

        document.getElementById('start-btn').addEventListener('click', () => engine.handleInput('A'));

        engine.registerGames([
            AirCombatGame,
            AlpineEscapeGame,
            BeatManiaGame,
            BreakoutGame,
            FlappyBirdGame,
            FrogHopperGame,
            GoldMinerGame,
            GomokuGame,
            GridTrapGame,
            KlotskiGame,
            MinesweeperGame,
            NeonRunnerGame,
            PuyuBubbleGame,
            SnakeGame,
            TankBattleGame,
            TetrisGame,
            G2048Game,
            G3DRTDemoGame,
        ]);
    </script>
