                        this.engine.gameOver('GAME OVER');
                        return;
                    }

                    for (let j = this.bullets.length - 1; j >= 0; j--) {
                        const b = this.bullets[j];
                        if (
                            b.x < e.x + e.w &&
                            b.x + b.w > e.x &&
                            b.y < e.y + e.h &&
                            b.y + b.h > e.y
                        ) {
                            if (Math.random() < 0.1) {
                                this.powerupDrops.push({
                                    x: e.x + e.w / 2 - 10,
                                    y: e.y + e.h / 2,
                                    w: 20,
                                    h: 20,
                                    type: Math.random() < 0.5 ? 'spread' : 'rapid',
                                    speed: 70
                                });
                            }

                            this.enemies.splice(i, 1);
                            this.bullets.splice(j, 1);
                            this.addScore(100);
                            this.playSound('score');
                            break;
                        }
                    }
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, 400, 400);

                ctx.fillStyle = '#ffffff';
                this.stars.forEach(s => {
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });

                this.bullets.forEach(b => {
                    ctx.fillStyle = b.color || '#ffee00';
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = b.color || '#ffee00';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                });
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ff3300';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ff0000';
                this.enemyBullets.forEach(eb => {
                    ctx.beginPath();
                    ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;

                this.powerupDrops.forEach(p => {
                    ctx.save();
                    const cx = p.x + p.w / 2;
                    const cy = p.y + p.h / 2;
                    const color = p.type === 'spread' ? '#00ffff' : '#ff00ee';

                    ctx.shadowColor = color;
                    ctx.shadowBlur = 8;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.fillStyle = 'rgba(10, 20, 40, 0.85)';

                    ctx.beginPath();
                    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.type === 'spread' ? 'S' : 'R', cx, cy);
                    ctx.restore();
                });

                this.enemies.forEach(e => {
                    this.drawEnemy(ctx, e);
                });

                if (this.boss) {
                    this.drawBoss(ctx, this.boss);
                }

                this.drawPlayer(ctx);

                if (this.weaponTimer > 0) {
                    ctx.save();
                    ctx.fillStyle = this.weapon === 'spread' ? '#00ffff' : '#ff00ee';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'left';
                    const weaponName = this.weapon === 'spread' ? 'SPREAD SHOT' : 'RAPID LASER';
                    ctx.fillText(`${weaponName}: ${this.weaponTimer.toFixed(1)}s`, 10, 390);
                    ctx.restore();
                }
            }

            drawPlayer(ctx) {
                const {x, y, w, h} = this.player;
                const cx = x + w / 2;

                ctx.save();

                const flameH = 8 + Math.sin(this.animTime * 30) * 4;
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(cx - 5, y + h);
                ctx.lineTo(cx, y + h + flameH);
                ctx.lineTo(cx + 5, y + h);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.moveTo(cx - 2, y + h);
                ctx.lineTo(cx, y + h + flameH * 0.6);
                ctx.lineTo(cx + 2, y + h);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#00aa55';
                ctx.beginPath();
                ctx.moveTo(cx, y);
                ctx.lineTo(x + w, y + h - 6);
                ctx.lineTo(x + w - 4, y + h);
                ctx.lineTo(cx, y + h - 8);
                ctx.lineTo(x + 4, y + h);
                ctx.lineTo(x, y + h - 6);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#00ff66';
                ctx.beginPath();
                ctx.moveTo(cx, y - 2);
                ctx.lineTo(cx + 6, y + h - 4);
                ctx.lineTo(cx - 6, y + h - 4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 2, y + h - 12, 2, 8);
                ctx.fillRect(x + w - 4, y + h - 12, 2, 8);

                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.ellipse(cx, y + 10, 3, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawEnemy(ctx, e) {
                const cx = e.x + e.w / 2;

                ctx.save();

                ctx.fillStyle = '#cc0044';
                ctx.beginPath();
                ctx.moveTo(cx, e.y + e.h);
                ctx.lineTo(e.x, e.y + 4);
                ctx.lineTo(e.x + 6, e.y);
                ctx.lineTo(cx, e.y + 6);
                ctx.lineTo(e.x + e.w - 6, e.y);
                ctx.lineTo(e.x + e.w, e.y + 4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                ctx.moveTo(cx, e.y + e.h - 4);
                ctx.lineTo(cx - 4, e.y + 8);
                ctx.lineTo(cx + 4, e.y + 8);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(cx, e.y + e.h - 10, 2.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawBoss(ctx, boss) {
                ctx.save();

                if (boss.hitTimer > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                    ctx.restore();
                    return;
                }

                const bx = boss.x;
                const by = boss.y;
                const bw = boss.w;
                const bh = boss.h;
                const cx = bx + bw / 2;

                ctx.fillStyle = '#222233';
                ctx.beginPath();
                ctx.moveTo(cx, by + bh);
                ctx.lineTo(bx + bw, by + bh - 20);
                ctx.lineTo(bx + bw - 10, by);
                ctx.lineTo(cx + 20, by + 10);
                ctx.lineTo(cx - 20, by + 10);
                ctx.lineTo(bx + 10, by);
                ctx.lineTo(bx, by + bh - 20);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#880022';
                ctx.fillRect(bx + 15, by + 15, 20, 25);
                ctx.fillRect(bx + bw - 35, by + 15, 20, 25);

                ctx.fillStyle = '#ff0044';
                ctx.fillRect(bx + 6, by + bh - 15, 8, 12);
                ctx.fillRect(bx + bw - 14, by + bh - 15, 8, 12);

                const pulse = Math.sin(this.animTime * 10) * 3 + 10;
                ctx.fillStyle = '#ff3300';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(cx, by + 25, pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(cx, by + 25, pulse * 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                ctx.save();
                const barW = 200;
                const barH = 8;
                const barX = (400 - barW) / 2;
                const barY = 14;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

                const hpRatio = Math.max(0, boss.hp / boss.maxHp);
                ctx.fillStyle = hpRatio > 0.3 ? '#ff2255' : '#ff9900';
                ctx.fillRect(barX, barY, barW * hpRatio, barH);

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('WARNING: BOSS AHEAD', 200, barY - 4);
                ctx.restore();
            }
        }

        class GomokuGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'gomoku';
                this.name = 'GOMOKU';
                this.hint = 'HINT: ARROWS TO MOVE CURSOR, A/TAP TO PLACE';
                this.gridSize = 15;
                this.cellSize = 25;
                this.offsetX = 25;
                this.offsetY = 25;
                this.board = [];
                this.cursor = {r: 7, c: 7};
                this.turn = 1;
                this.thinking = false;
            }

            init() {
                this.board = Array(this.gridSize).fill(0).map(() => Array(this.gridSize).fill(0));
                this.cursor = {r: 7, c: 7};
                this.turn = 1;
                this.thinking = false;
            }

            onInput(action, details) {
                if (this.turn !== 1 || this.thinking) return;

                if (action === 'Up') {
                    this.cursor.r = Math.max(0, this.cursor.r - 1);
                } else if (action === 'Down') {
                    this.cursor.r = Math.min(this.gridSize - 1, this.cursor.r + 1);
                } else if (action === 'Left') {
                    this.cursor.c = Math.max(0, this.cursor.c - 1);
                } else if (action === 'Right') {
                    this.cursor.c = Math.min(this.gridSize - 1, this.cursor.c + 1);
                } else if (action === 'A' || action === 'X') {
                    this.placeStone(this.cursor.r, this.cursor.c);
                } else if (action === 'PointerTap' && details) {
                    const canvasX = (details.x / details.width) * 400;
                    const canvasY = (details.y / details.height) * 400;
                    const c = Math.round((canvasX - this.offsetX) / this.cellSize);
                    const r = Math.round((canvasY - this.offsetY) / this.cellSize);
                    if (r >= 0 && r < this.gridSize && c >= 0 && c < this.gridSize) {
                        this.cursor = {r, c};
                        this.placeStone(r, c);
                    }
                }
            }

            placeStone(r, c) {
                if (this.board[r][c] !== 0) return;


                this.board[r][c] = 1;
                this.engine.playSound('beep');


                if (this.checkWin(r, c, 1)) {
                    this.engine.addScore(500);
                    this.engine.gameWin('YOU WIN!');
                    return;
                }


                if (this.isBoardFull()) {
                    this.engine.gameOver('DRAW GAME');
                    return;
                }


                this.turn = 2;
                this.thinking = true;
                setTimeout(() => this.makeAiMove(), 50);
            }

            makeAiMove() {
                const best = this.getBestMove();
                if (best) {
                    this.board[best.r][best.c] = 2;
                    this.engine.playSound('score');


                    if (this.checkWin(best.r, best.c, 2)) {
                        this.engine.gameOver('AI WINS!');
                        return;
                    }


                    if (this.isBoardFull()) {
                        this.engine.gameWin('DRAW GAME');
                        return;
                    }
                }
                this.turn = 1;
                this.thinking = false;
            }

            getBestMove() {
                let candidates = this.getCandidates();
                if (candidates.length === 0) return {r: 7, c: 7};


                let bestMove = candidates[0];
                let bestScore = -Infinity;


                for (let move of candidates) {
                    this.board[move.r][move.c] = 2;
                    if (this.checkWin(move.r, move.c, 2)) {
                        this.board[move.r][move.c] = 0;
                        return move;
                    }
                    let score = this.minimax(2, false, -Infinity, Infinity);
                    this.board[move.r][move.c] = 0;


                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }
                }
                return bestMove;
            }

            minimax(depth, isMaximizing, alpha, beta) {
                let score = this.evaluateBoard();
                if (depth === 0 || Math.abs(score) >= 90000) {
                    return score;
                }


                let candidates = this.getCandidates();
                if (candidates.length === 0) return 0;


                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let move of candidates) {
                        this.board[move.r][move.c] = 2;
                        let evalVal = this.minimax(depth - 1, false, alpha, beta);
                        this.board[move.r][move.c] = 0;
                        maxEval = Math.max(maxEval, evalVal);
                        alpha = Math.max(alpha, evalVal);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let move of candidates) {
                        this.board[move.r][move.c] = 1;
                        let evalVal = this.minimax(depth - 1, true, alpha, beta);
                        this.board[move.r][move.c] = 0;
                        minEval = Math.min(minEval, evalVal);
                        beta = Math.min(beta, evalVal);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            getCandidates() {
                let candidates = [];
                let visited = Array(this.gridSize).fill(0).map(() => Array(this.gridSize).fill(false));
                let hasStones = false;


                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.board[r][c] !== 0) {
                            hasStones = true;
                            for (let dr = -1; dr <= 1; dr++) {
                                for (let dc = -1; dc <= 1; dc++) {
                                    let nr = r + dr;
                                    let nc = c + dc;
                                    if (
                                        nr >= 0 && nr < this.gridSize &&
                                        nc >= 0 && nc < this.gridSize &&
                                        this.board[nr][nc] === 0 &&
                                        !visited[nr][nc]
                                    ) {
                                        visited[nr][nc] = true;
                                        candidates.push({r: nr, c: nc});
                                    }
                                }
                            }
                        }
                    }
                }


                if (!hasStones) {
                    return [{r: 7, c: 7}];
                }


                return candidates.slice(0, 12);
            }

            evaluateBoard() {
                let total = 0;


                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c <= this.gridSize - 5; c++) {
                        total += this.evaluateWindow([
                            this.board[r][c],
                            this.board[r][c + 1],
                            this.board[r][c + 2],
                            this.board[r][c + 3],
                            this.board[r][c + 4]
                        ]);
                    }
                }


                for (let c = 0; c < this.gridSize; c++) {
                    for (let r = 0; r <= this.gridSize - 5; r++) {
                        total += this.evaluateWindow([
                            this.board[r][c],
                            this.board[r + 1][c],
                            this.board[r + 2][c],
                            this.board[r + 3][c],
                            this.board[r + 4][c]
                        ]);
                    }
                }


                for (let r = 0; r <= this.gridSize - 5; r++) {
                    for (let c = 0; c <= this.gridSize - 5; c++) {
                        total += this.evaluateWindow([
                            this.board[r][c],
                            this.board[r + 1][c + 1],
                            this.board[r + 2][c + 2],
                            this.board[r + 3][c + 3],
                            this.board[r + 4][c + 4]
                        ]);
                    }
                }


                for (let r = 4; r < this.gridSize; r++) {
                    for (let c = 0; c <= this.gridSize - 5; c++) {
                        total += this.evaluateWindow([
                            this.board[r][c],
                            this.board[r - 1][c + 1],
                            this.board[r - 2][c + 2],
                            this.board[r - 3][c + 3],
                            this.board[r - 4][c + 4]
                        ]);
                    }
                }


                return total;
            }

            evaluateWindow(w) {
                let c1 = 0;
                let c2 = 0;
                for (let i = 0; i < 5; i++) {
                    if (w[i] === 1) c1++;
                    else if (w[i] === 2) c2++;
                }


                if (c1 > 0 && c2 > 0) return 0;
                if (c2 === 5) return 100000;
                if (c1 === 5) return -100000;
                if (c2 === 4) return 10000;
                if (c1 === 4) return -10000;
                if (c2 === 3) return 1000;
                if (c1 === 3) return -1000;
                if (c2 === 2) return 100;
                if (c1 === 2) return -100;
                if (c2 === 1) return 10;
                if (c1 === 1) return -10;
                return 0;
            }

            checkWin(r, c, p) {
                const dirs = [
                    [0, 1],
                    [1, 0],
                    [1, 1],
                    [1, -1]
                ];


                for (let [dr, dc] of dirs) {
                    let count = 1;


                    let nr = r + dr;
                    let nc = c + dc;
                    while (
                        nr >= 0 && nr < this.gridSize &&
                        nc >= 0 && nc < this.gridSize &&
                        this.board[nr][nc] === p
                    ) {
                        count++;
                        nr += dr;
                        nc += dc;
                    }


                    nr = r - dr;
                    nc = c - dc;
                    while (
                        nr >= 0 && nr < this.gridSize &&
                        nc >= 0 && nc < this.gridSize &&
                        this.board[nr][nc] === p
                    ) {
                        count++;
                        nr -= dr;
                        nc -= dc;
                    }


                    if (count >= 5) return true;
                }
                return false;
            }

            isBoardFull() {
                return this.board.every(row => row.every(cell => cell !== 0));
            }

            update(dt) { }

            draw(ctx) {
                const boardWidth = (this.gridSize - 1) * this.cellSize;
                const startX = this.offsetX;
                const startY = this.offsetY;

                ctx.fillStyle = '#e3a857';
                ctx.fillRect(startX - 25, startY - 25, boardWidth + 50, boardWidth + 50);

                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 1.5;

                for (let i = 0; i < this.gridSize; i++) {
                    ctx.beginPath();
                    ctx.moveTo(this.offsetX + i * this.cellSize, this.offsetY);
                    ctx.lineTo(this.offsetX + i * this.cellSize, this.offsetY + (this.gridSize - 1) * this.cellSize);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(this.offsetX, this.offsetY + i * this.cellSize);
                    ctx.lineTo(this.offsetX + (this.gridSize - 1) * this.cellSize, this.offsetY + i * this.cellSize);
                    ctx.stroke();
                }

                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const stone = this.board[r][c];
                        if (stone !== 0) {
                            const x = this.offsetX + c * this.cellSize;
                            const y = this.offsetY + r * this.cellSize;
                            const radius = this.cellSize * 0.42;


                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, Math.PI * 2);

                            ctx.shadowBlur = 6;
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                            ctx.shadowOffsetX = 2;
                            ctx.shadowOffsetY = 2;


                            if (stone === 1) {
                                const gradient = ctx.createRadialGradient(
                                    x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                                    x, y, radius
                                );
                                gradient.addColorStop(0, '#555555');
                                gradient.addColorStop(1, '#111111');
                                ctx.fillStyle = gradient;
                            } else {
                                const gradient = ctx.createRadialGradient(
                                    x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                                    x, y, radius
                                );
                                gradient.addColorStop(0, '#ffffff');
                                gradient.addColorStop(1, '#cccccc');
                                ctx.fillStyle = gradient;
                            }

                            ctx.fill();
                            ctx.restore();
                        }
                    }
                }

                if (this.turn === 1 && !this.thinking) {
                    const cx = this.offsetX + this.cursor.c * this.cellSize;
                    const cy = this.offsetY + this.cursor.r * this.cellSize;
                    ctx.strokeStyle = '#d9534f';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(cx - 12, cy - 12, 24, 24);
                }
            }
        }

        class GridTrapGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'gridtrap';
                this.name = 'GRID TRAP';
                this.hint = 'ARROWS: MOVE | A/B/X/Y: BUILD/DIR | TAP: BUILD';
            }


            init() {
                this.rects = [{x: 0, y: 0, w: 400, h: 400}];
                this.balls = [];
                this.wallDir = 'H';
                this.activeWall = null;
                this.areaTotal = 400 * 400;
                this.areaCaptured = 0;
                this.level = 1;
                this.cursor = {x: 200, y: 200};
                this.spawnBalls(this.level + 1);
            }


            spawnBalls(count) {
                this.balls = [];
                for (let i = 0; i < count; i++) {
                    this.balls.push({
                        x: 200 + Math.random() * 40 - 20,
                        y: 200 + Math.random() * 40 - 20,
                        dx: (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 60),
                        dy: (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 60),
                        r: 6
                    });
                }
            }


            buildWall(px, py) {
                if (this.activeWall) return false;
                const rect = this.rects.find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);


                if (rect) {
                    this.activeWall = {
                        rect: rect,
                        x: px,
                        y: py,
                        dir: this.wallDir,
                        l1: 0,
                        l2: 0,
                        stop1: false,
                        stop2: false
                    };
                    this.engine.playSound('beep');
                    return true;
                }
                return false;
            }


            onInput(action, details) {
                const act = typeof action === 'string' ? action.toUpperCase() : '';
                const step = 20;


                if (act === 'UP' || act === 'ARROWUP') {
                    this.cursor.y = Math.max(0, this.cursor.y - step);
                    this.wallDir = 'V';
                } else if (act === 'DOWN' || act === 'ARROWDOWN') {
                    this.cursor.y = Math.min(400, this.cursor.y + step);
                    this.wallDir = 'V';
                } else if (act === 'LEFT' || act === 'ARROWLEFT') {
                    this.cursor.x = Math.max(0, this.cursor.x - step);
                    this.wallDir = 'H';
                } else if (act === 'RIGHT' || act === 'ARROWRIGHT') {
                    this.cursor.x = Math.min(400, this.cursor.x + step);
                    this.wallDir = 'H';
                }

                if (act === 'A' || act === 'X') {
                    if (!this.buildWall(this.cursor.x, this.cursor.y)) {
                        this.wallDir = this.wallDir === 'H' ? 'V' : 'H';
                        this.engine.playSound('beep');
                    }

                }

                if (act === 'B' || act === 'Y') {
                    this.wallDir = this.wallDir === 'H' ? 'V' : 'H';
                    this.engine.playSound('beep');
                }


                if (action === 'PointerTap' && details) {
                    const px = details.x * (400 / details.width);
                    const py = details.y * (400 / details.height);
                    this.cursor.x = px;
                    this.cursor.y = py;
                    this.buildWall(px, py);
                }
            }


            update(dt) {
                this.balls.forEach(b => {
                    b.x += b.dx * dt;
                    b.y += b.dy * dt;
                    const r = this.rects.find(rect => b.x >= rect.x && b.x <= rect.x + rect.w && b.y >= rect.y && b.y <= rect.y + rect.h);
                    if (r) {
                        if (b.x - b.r < r.x) {b.x = r.x + b.r; b.dx *= -1;}
                        if (b.x + b.r > r.x + r.w) {b.x = r.x + r.w - b.r; b.dx *= -1;}
                        if (b.y - b.r < r.y) {b.y = r.y + b.r; b.dy *= -1;}
                        if (b.y + b.r > r.y + r.h) {b.y = r.y + r.h - b.r; b.dy *= -1;}
                    }
                });


                if (this.activeWall) {
                    const wspeed = 250 * dt;
                    let {rect, x, y, dir} = this.activeWall;


                    if (!this.activeWall.stop1) this.activeWall.l1 += wspeed;
                    if (!this.activeWall.stop2) this.activeWall.l2 += wspeed;


                    if (dir === 'H') {
                        if (x - this.activeWall.l1 <= rect.x) {this.activeWall.l1 = x - rect.x; this.activeWall.stop1 = true;}
                        if (x + this.activeWall.l2 >= rect.x + rect.w) {this.activeWall.l2 = rect.x + rect.w - x; this.activeWall.stop2 = true;}
                    } else {
                        if (y - this.activeWall.l1 <= rect.y) {this.activeWall.l1 = y - rect.y; this.activeWall.stop1 = true;}
                        if (y + this.activeWall.l2 >= rect.y + rect.h) {this.activeWall.l2 = rect.y + rect.h - y; this.activeWall.stop2 = true;}
                    }


                    let hit = false;
                    this.balls.forEach(b => {
                        if (dir === 'H') {
                            if (Math.abs(b.y - y) < b.r + 3 && b.x >= x - this.activeWall.l1 && b.x <= x + this.activeWall.l2) hit = true;
                        } else {
                            if (Math.abs(b.x - x) < b.r + 3 && b.y >= y - this.activeWall.l1 && b.y <= y + this.activeWall.l2) hit = true;
                        }
                    });


                    if (hit) {
                        this.engine.gameOver('WALL CRASH!');
                        return;
                    }


                    if (this.activeWall.stop1 && this.activeWall.stop2) {
                        this.engine.playSound('score');
                        let r1, r2;


                        if (dir === 'H') {
                            r1 = {x: rect.x, y: rect.y, w: rect.w, h: y - rect.y};
                            r2 = {x: rect.x, y: y, w: rect.w, h: rect.y + rect.h - y};
                        } else {
                            r1 = {x: rect.x, y: rect.y, w: x - rect.x, h: rect.h};
                            r2 = {x: x, y: rect.y, w: rect.x + rect.w - x, h: rect.h};
                        }


                        this.rects = this.rects.filter(r => r !== rect);


                        [r1, r2].forEach(nr => {
                            if (nr.w > 1 && nr.h > 1) {
                                const ballsInRect = this.balls.filter(b => b.x >= nr.x && b.x <= nr.x + nr.w && b.y >= nr.y && b.y <= nr.y + nr.h);
                                if (ballsInRect.length > 0) {
                                    this.rects.push(nr);
                                } else {
                                    const area = nr.w * nr.h;
                                    this.areaCaptured += area;
                                    this.engine.addScore(Math.floor(area / 100));
                                }
                            }
                        });


                        this.activeWall = null;


                        if (this.areaCaptured / this.areaTotal >= 0.75) {
                            this.level++;
                            this.areaCaptured = 0;
                            this.rects = [{x: 0, y: 0, w: 400, h: 400}];
                            this.cursor = {x: 200, y: 200};
                            this.spawnBalls(this.level + 1);
                            this.engine.addScore(1000);
                        }
                    }
                }
            }


            draw(ctx) {
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, 400, 400);


                ctx.fillStyle = '#12101f';
                ctx.fillRect(0, 0, 400, 400);


                ctx.fillStyle = '#05050a';
                this.rects.forEach(r => {
                    ctx.fillRect(r.x, r.y, r.w, r.h);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(r.x, r.y, r.w, r.h);
                });


                if (this.activeWall) {
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff0055';
                    const {x, y, dir, l1, l2} = this.activeWall;
                    if (dir === 'H') ctx.fillRect(x - l1, y - 2, l1 + l2, 4);
                    else ctx.fillRect(x - 2, y - l1, 4, l1 + l2);
                    ctx.shadowBlur = 0;
                }

                if (this.cursor) {
                    ctx.strokeStyle = '#ff00ff';
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#ff00ff';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(this.cursor.x, this.cursor.y, 5, 0, Math.PI * 2);
                    if (this.wallDir === 'H') {
                        ctx.moveTo(this.cursor.x - 10, this.cursor.y);
                        ctx.lineTo(this.cursor.x + 10, this.cursor.y);
                    } else {
                        ctx.moveTo(this.cursor.x, this.cursor.y - 10);
                        ctx.lineTo(this.cursor.x, this.cursor.y + 10);
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }


                ctx.fillStyle = '#00ff66';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ff66';
                this.balls.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;


                ctx.fillStyle = '#ffee00';
                ctx.font = '10px "Press Start 2P"';
                ctx.fillText(`CAPTURED: ${Math.floor((this.areaCaptured / this.areaTotal) * 100)}% / 75%`, 10, 20);
                ctx.fillText(`DIR: ${this.wallDir === 'H' ? 'HORZ' : 'VERT'}`, 10, 35);
            }
        }

        class AlpineEscapeGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'alpine';
                this.name = 'ALPINE ESCAPE';
                this.hint = 'L/R: STEER | A/TAP: JUMP ROCKS';
            }


            init() {
                this.player = {x: 200, y: 100, vx: 0, jumpTimer: 0};
                this.obstacles = [];
                this.bgDecor = [];
                this.skiTracks = [];
                this.baseSpeed = 180;
                this.distance = 0;
                this.yeti = null;
                this.spawnTimer = 0;
                this.decorSpawnTimer = 0;


                for (let i = 0; i < 30; i++) {
                    this.bgDecor.push({
                        x: Math.random() * 380 + 10,
                        y: Math.random() * 450,
                        type: ['grass', 'pebble', 'mound'][Math.floor(Math.random() * 3)]
                    });
                }
            }


            onInput(action, details) {
                if (action === 'Left') {
                    this.player.vx = -250;
                } else if (action === 'Right') {
                    this.player.vx = 250;
                } else if (action === 'A' || action === 'B' || action === 'X' || action === 'Y') {
                    if (this.player.jumpTimer <= 0) {
                        this.player.jumpTimer = 0.8;
                        this.engine.playSound('beep');
                    }
                } else if (action === 'PointerTap') {
                    if (this.player.jumpTimer <= 0) {
                        this.player.jumpTimer = 0.8;
                        this.engine.playSound('beep');
                    }
                } else if (action === 'PointerMove' && details) {
                    const px = details.x * (400 / details.width);
                    this.player.x = px;
                    this.player.vx = 0;
                }
            }


            update(dt) {
                this.player.x += this.player.vx * dt;
                this.player.vx *= Math.pow(0.01, dt);


                if (this.player.x < 15) this.player.x = 15;
                if (this.player.x > 385) this.player.x = 385;


                if (this.player.jumpTimer > 0) {
                    this.player.jumpTimer -= dt;
                }


                const currentSpeed = this.baseSpeed + (this.distance / 120);
                this.distance += currentSpeed * dt;

                if (Math.floor(this.distance / 100) > this.engine.score) {
                    this.engine.addScore(1);
                }


                this.spawnTimer -= dt;
                if (this.spawnTimer <= 0) {
                    this.spawnTimer = Math.random() * 0.3 + 0.15;
                    this.obstacles.push({
                        x: Math.random() * 370 + 15,
                        y: 420,
                        type: Math.random() > 0.4 ? 'tree' : 'rock'
                    });
                }


                this.decorSpawnTimer -= dt;
                if (this.decorSpawnTimer <= 0) {
                    this.decorSpawnTimer = Math.random() * 0.08 + 0.04;
                    this.bgDecor.push({
                        x: Math.random() * 390 + 5,
                        y: 430,
                        type: ['grass', 'pebble', 'mound'][Math.floor(Math.random() * 3)]
                    });
                }


                for (let i = this.bgDecor.length - 1; i >= 0; i--) {
                    let dec = this.bgDecor[i];
                    dec.y -= currentSpeed * dt;
                    if (dec.y < -20) {
                        this.bgDecor.splice(i, 1);
                    }
                }


                if (Math.random() < 0.6) {
                    this.skiTracks.push({
                        x: this.player.x,
                        y: this.player.y + 8,
                        alpha: 0.6
                    });
                }
                for (let i = this.skiTracks.length - 1; i >= 0; i--) {
                    let st = this.skiTracks[i];
                    st.y -= currentSpeed * dt;
                    st.alpha -= dt * 0.5;
                    if (st.y < -20 || st.alpha <= 0) {
                        this.skiTracks.splice(i, 1);
                    }
                }


                if (this.distance > 8000 && !this.yeti) {
                    this.yeti = {x: 200, y: -40};
                    this.engine.playSound('gameover');
                }


                if (this.yeti) {
                    this.yeti.x += (this.player.x - this.yeti.x) * 1.5 * dt;
                    this.yeti.y += (currentSpeed + 35) * dt;

                    if (Math.hypot(this.player.x - this.yeti.x, this.player.y - this.yeti.y) < 22) {
                        this.engine.gameOver('EATEN BY YETI!');
                        return;
                    }
                }


                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    let obs = this.obstacles[i];
                    obs.y -= currentSpeed * dt;

                    if (obs.y < -30) {
                        this.obstacles.splice(i, 1);
                        continue;
                    }


                    if (Math.abs(this.player.x - obs.x) < 14 && Math.abs(this.player.y - obs.y) < 14) {
                        if (obs.type === 'tree') {
                            this.engine.gameOver('CRASHED INTO TREE!');
                            return;
                        } else if (obs.type === 'rock') {
                            if (this.player.jumpTimer <= 0) {
                                this.engine.gameOver('TRIPPED ON ROCK!');
                                return;
                            }
                        }
                    }
                }
            }


            draw(ctx) {
                ctx.fillStyle = '#f0f5fa';
                ctx.fillRect(0, 0, 400, 400);


                ctx.fillStyle = '#e1e9f0';
                for (let i = 0; i < 8; i++) {
                    let ly = (this.distance * 1.2 + i * 55) % 400;
                    let lx = (i * 97) % 360 + 20;
                    ctx.fillRect(lx, ly, 12, 2);
                    ctx.fillRect((lx + 160) % 380, (ly + 25) % 400, 8, 2);
                }


                this.skiTracks.forEach(st => {
                    ctx.fillStyle = '#d0dfed';
                    ctx.globalAlpha = Math.max(0, st.alpha);
                    ctx.fillRect(st.x - 4, st.y, 2, 4);
                    ctx.fillRect(st.x + 2, st.y, 2, 4);
                });
                ctx.globalAlpha = 1.0;


                this.bgDecor.forEach(dec => {
                    if (dec.type === 'grass') {
                        ctx.fillStyle = '#6b7c52';
                        ctx.fillRect(dec.x, dec.y, 2, 5);
                        ctx.fillRect(dec.x - 2, dec.y + 2, 2, 3);
                        ctx.fillRect(dec.x + 2, dec.y + 1, 2, 4);
                        ctx.fillStyle = '#4a5738';
                        ctx.fillRect(dec.x, dec.y + 3, 2, 2);
                    } else if (dec.type === 'pebble') {
                        ctx.fillStyle = '#94a3b8';
                        ctx.fillRect(dec.x, dec.y, 4, 3);
                        ctx.fillStyle = '#64748b';
                        ctx.fillRect(dec.x + 1, dec.y + 2, 3, 1);
                    } else {
                        ctx.fillStyle = '#dbe7f3';
                        ctx.beginPath();
                        ctx.arc(dec.x, dec.y, 4, 0, Math.PI);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(dec.x - 2, dec.y - 2, 4, 2);
                    }
                });


                this.obstacles.forEach(obs => {
                    if (obs.type === 'tree') {
                        ctx.fillStyle = 'rgba(180, 200, 215, 0.6)';
                        ctx.beginPath();
                        ctx.ellipse(obs.x, obs.y + 10, 12, 5, 0, 0, Math.PI * 2);
                        ctx.fill();


                        ctx.fillStyle = '#5d4037';
                        ctx.fillRect(obs.x - 2, obs.y + 4, 4, 8);


                        ctx.fillStyle = '#1b4332';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y - 2);
                        ctx.lineTo(obs.x - 14, obs.y + 6);
                        ctx.lineTo(obs.x + 14, obs.y + 6);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(obs.x - 12, obs.y + 4, 24, 2);


                        ctx.fillStyle = '#2d6a4f';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y - 8);
                        ctx.lineTo(obs.x - 11, obs.y);
                        ctx.lineTo(obs.x + 11, obs.y);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(obs.x - 9, obs.y - 2, 18, 2);


                        ctx.fillStyle = '#40916c';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y - 15);
                        ctx.lineTo(obs.x - 7, obs.y - 6);
                        ctx.lineTo(obs.x + 7, obs.y - 6);
                        ctx.closePath();
                        ctx.fill();


                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y - 16);
                        ctx.lineTo(obs.x - 4, obs.y - 10);
                        ctx.lineTo(obs.x + 4, obs.y - 10);
                        ctx.closePath();
                        ctx.fill();


                    } else {
                        ctx.fillStyle = 'rgba(180, 200, 215, 0.6)';
                        ctx.beginPath();
                        ctx.ellipse(obs.x, obs.y + 6, 10, 4, 0, 0, Math.PI * 2);
                        ctx.fill();


                        ctx.fillStyle = '#4a5568';
                        ctx.fillRect(obs.x - 8, obs.y - 6, 16, 12);

                    }
                });


                if (this.yeti) {
                    let yx = this.yeti.x;

                    ctx.fillStyle = 'rgba(180, 200, 215, 0.7)';
                    ctx.beginPath();
                    ctx.ellipse(yx, yy + 14, 18, 6, 0, 0, Math.PI * 2);
                    ctx.fill();


                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(yx - 16, yy - 16, 32, 30);

                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillRect(yx - 18, yy - 12, 36, 22);
                    ctx.fillRect(yx - 14, yy - 18, 28, 34);


                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(yx - 10, yy - 10, 20, 14);


                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(yx - 7, yy - 7, 5, 5);
                    ctx.fillRect(yx + 2, yy - 7, 5, 5);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(yx - 6, yy - 6, 2, 2);
                    ctx.fillRect(yx + 3, yy - 6, 2, 2);


                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(yx - 8, yy + 1, 16, 6);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(yx - 6, yy + 1, 3, 3);

                    ctx.fillRect(yx + 16, yy - 4, 4, 10);

                ctx.save();
                ctx.translate(this.player.x, this.player.y);


                let isJumping = this.player.jumpTimer > 0;

                if (isJumping) {

                }


                ctx.fillStyle = 'rgba(160, 180, 200, 0.6)';
                let shadowRadius = isJumping ? 8 : 12;
