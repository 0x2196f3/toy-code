        class TankBattleGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'tank';
                this.name = 'TANK BATTLE';
                this.hint = 'HINT: ARROWS/D-PAD TO MOVE, A/SPACE TO SHOOT';

                this.gridSize = 16;
                this.tileSize = 25;
                this.map = [];
                this.player = null;
                this.enemies = [];
                this.bullets = [];
                this.base = {x: 7, y: 15, alive: true};
                this.spawnTimer = 0;
                this.maxEnemies = 4;
                this.totalEnemies = 15;
                this.enemiesSpawned = 0;
                this.keys = {};
            }

            init() {
                this.generateMap();
                this.player = {
                    x: 5 * this.tileSize,
                    y: 15 * this.tileSize,
                    w: 20,
                    h: 20,
                    dir: 0,
                    speed: 90,
                    cooldown: 0,
                    alive: true
                };
                this.enemies = [];
                this.bullets = [];
                this.base.alive = true;
                this.enemiesSpawned = 0;
                this.spawnTimer = 0;
                this.keys = {};
                this.spawnEnemy();
            }

            generateMap() {
                this.map = Array(this.gridSize).fill(0).map(() => Array(this.gridSize).fill(0));

                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const rand = Math.random();
                        if (rand < 0.28) {
                            this.map[r][c] = 1;
                        } else if (rand < 0.35) {
                            this.map[r][c] = 2;
                        }
                    }
                }

                const safeZones = [
                    [0, 0], [0, 1], [1, 0],
                    [0, 7], [0, 8], [1, 7], [1, 8],
                    [0, 14], [0, 15], [1, 15],
                    [15, 4], [15, 5], [14, 5],
                    [15, 7], [15, 8], [14, 7], [14, 8], [13, 7], [13, 8]
                ];

                safeZones.forEach(([r, c]) => {
                    if (this.map[r] && this.map[r][c] !== undefined) {
                        this.map[r][c] = 0;
                    }
                });

                this.map[14][6] = 1;
                this.map[14][7] = 1;
                this.map[14][8] = 1;
                this.map[14][9] = 1;
                this.map[15][6] = 1;
                this.map[15][9] = 1;

                this.ensureMapConnectivity();
            }

            ensureMapConnectivity() {
                const playerSpawn = [15, 5];
                const keyNodes = [
                    playerSpawn,
                    [0, 0], [0, 7], [0, 15],
                    [13, 7], [13, 8]
                ];

                keyNodes.forEach(([r, c]) => {this.map[r][c] = 0;});

                for (let i = 1; i < keyNodes.length; i++) {
                    const target = keyNodes[i];
                    if (!this.hasPath(playerSpawn[0], playerSpawn[1], target[0], target[1])) {
                        this.carvePath(playerSpawn[0], playerSpawn[1], target[0], target[1]);
                    }
                }

                let visited = this.getVisitedFrom(playerSpawn[0], playerSpawn[1]);
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.map[r][c] === 0 && !visited[r][c]) {
                            this.carveToVisited(r, c, visited);
                            visited = this.getVisitedFrom(playerSpawn[0], playerSpawn[1]);
                        }
                    }
                }
            }

            hasPath(r1, c1, r2, c2) {
                const queue = [[r1, c1]];
                const visited = Array(this.gridSize).fill(false).map(() => Array(this.gridSize).fill(false));
                visited[r1][c1] = true;

                while (queue.length > 0) {
                    const [r, c] = queue.shift();
                    if (r === r2 && c === c2) return true;

                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < this.gridSize && nc >= 0 && nc < this.gridSize) {
                            if (!visited[nr][nc] && this.map[nr][nc] === 0) {
                                visited[nr][nc] = true;
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }
                return false;
            }

            getVisitedFrom(r1, c1) {
                const queue = [[r1, c1]];
                const visited = Array(this.gridSize).fill(false).map(() => Array(this.gridSize).fill(false));
                visited[r1][c1] = true;

                while (queue.length > 0) {
                    const [r, c] = queue.shift();
                    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < this.gridSize && nc >= 0 && nc < this.gridSize) {
                            if (!visited[nr][nc] && this.map[nr][nc] === 0) {
                                visited[nr][nc] = true;
                                queue.push([nr, nc]);
                            }
                        }
                    }
                }
                return visited;
            }

            carvePath(r1, c1, r2, c2) {
                let r = r1, c = c1;
                while (r !== r2 || c !== c2) {
                    this.map[r][c] = 0;
                    if (r !== r2 && (c === c2 || Math.random() < 0.5)) {
                        r += (r2 > r) ? 1 : -1;
                    } else if (c !== c2) {
                        c += (c2 > c) ? 1 : -1;
                    }
                }
                this.map[r2][c2] = 0;
            }

            carveToVisited(sr, sc, visited) {
                let currR = sr, currC = sc;
                let safety = 0;
                while (!visited[currR][currC] && safety < 100) {
                    safety++;
                    this.map[currR][currC] = 0;
                    let closestR = currR, closestC = currC;
                    let minDist = Infinity;

                    for (let r = 0; r < this.gridSize; r++) {
                        for (let c = 0; c < this.gridSize; c++) {
                            if (visited[r][c]) {
                                const d = Math.abs(r - currR) + Math.abs(c - currC);
                                if (d < minDist) {
                                    minDist = d;
                                    closestR = r;
                                    closestC = c;
                                }
                            }
                        }
                    }

                    if (minDist === Infinity) break;

                    if (currR !== closestR) {
                        currR += (closestR > currR) ? 1 : -1;
                    } else if (currC !== closestC) {
                        currC += (closestC > currC) ? 1 : -1;
                    }
                }
            }

            spawnEnemy() {
                if (this.enemiesSpawned >= this.totalEnemies || this.enemies.length >= this.maxEnemies) return;
                const spawns = [
                    {x: 0 * this.tileSize, y: 0 * this.tileSize},
                    {x: 7 * this.tileSize, y: 0 * this.tileSize},
                    {x: 15 * this.tileSize, y: 0 * this.tileSize}
                ];
                const spot = spawns[this.enemiesSpawned % spawns.length];

                const blocked = this.enemies.some(e => Math.abs(e.x - spot.x) < 20 && Math.abs(e.y - spot.y) < 20);
                if (blocked) return;

                this.enemies.push({
                    x: spot.x,
                    y: spot.y,
                    w: 20,
                    h: 20,
                    dir: 2,
                    speed: 38,
                    cooldown: 1.0,
                    changeDirTimer: 0,
                    targetType: Math.random() < 0.65 ? 'base' : 'player'
                });
                this.enemiesSpawned++;
            }

            getBestDirTowards(enemy, targetX, targetY) {
                const curC = Math.floor((enemy.x + enemy.w / 2) / this.tileSize);
                const curR = Math.floor((enemy.y + enemy.h / 2) / this.tileSize);
                const tarC = Math.floor(targetX / this.tileSize);
                const tarR = Math.floor(targetY / this.tileSize);

                const dirs = [
                    {dir: 0, dr: -1, dc: 0},
                    {dir: 1, dr: 0, dc: 1},
                    {dir: 2, dr: 1, dc: 0},
                    {dir: 3, dr: 0, dc: -1}
                ];

                let bestDir = enemy.dir;
                let minCost = Infinity;

                const shuffledDirs = [...dirs].sort(() => Math.random() - 0.5);

                for (const d of shuffledDirs) {
                    const nr = curR + d.dr;
                    const nc = curC + d.dc;

                    if (nr >= 0 && nr < this.gridSize && nc >= 0 && nc < this.gridSize) {
                        if (this.map[nr][nc] === 2) continue;

                        const wallCost = (this.map[nr][nc] === 1) ? 4 : 0;
                        const dist = Math.abs(nr - tarR) + Math.abs(nc - tarC) + wallCost;

                        if (dist < minCost) {
                            minCost = dist;
                            bestDir = d.dir;
                        }
                    }
                }
                return bestDir;
            }

            checkEnemyLineOfFire(enemy) {
                if (enemy.cooldown > 0) return false;

                const tileC = Math.floor((enemy.x + enemy.w / 2) / this.tileSize);
                const tileR = Math.floor((enemy.y + enemy.h / 2) / this.tileSize);

                const dc = [0, 1, 0, -1][enemy.dir];
                const dr = [-1, 0, 1, 0][enemy.dir];

                let cc = tileC + dc;
                let cr = tileR + dr;

                while (cc >= 0 && cc < this.gridSize && cr >= 0 && cr < this.gridSize) {
                    const tileVal = this.map[cr][cc];

                    if (this.player.alive) {
                        const px = Math.floor((this.player.x + 10) / this.tileSize);
                        const py = Math.floor((this.player.y + 10) / this.tileSize);
                        if (px === cc && py === cr) return true;
                    }

                    if (this.base.alive && cr >= 14 && cc >= 6 && cc <= 9) {
                        return true;
                    }

                    if (tileVal === 2) {
                        return false;
                    } else if (tileVal === 1) {
                        return Math.random() < 0.4;
                    }

                    cc += dc;
                    cr += dr;
                }
                return false;
            }

            onInput(action, details) {
                if (action === 'A' || action === 'X' || action === 'Up' || action === 'Down' || action === 'Left' || action === 'Right') {
                    if (action === 'A' || action === 'X') {
                        this.shoot(this.player, true);
                    } else {
                        this.keys[action] = true;
                    }
                }

                if (action === 'PointerTap' && details) {
                    const px = (details.x / details.width) * 400;
                    const py = (details.y / details.height) * 400;
                    const dx = px - (this.player.x + 10);
                    const dy = py - (this.player.y + 10);
                    if (Math.abs(dx) > Math.abs(dy)) {
                        this.player.dir = dx > 0 ? 1 : 3;
                    } else {
                        this.player.dir = dy > 0 ? 2 : 0;
                    }
                    this.shoot(this.player, true);
                }
            }

            shoot(shooter, isPlayer) {
                if (!shooter || shooter.cooldown > 0) return;
                const speed = 220;
                const vx = [0, speed, 0, -speed][shooter.dir];
                const vy = [-speed, 0, speed, 0][shooter.dir];
                this.bullets.push({
                    x: shooter.x + 10,
                    y: shooter.y + 10,
                    vx,
                    vy,
                    isPlayer
                });
                shooter.cooldown = isPlayer ? 0.3 : 1.8;
                if (this.engine && this.engine.playSound) {
                    this.engine.playSound('beep');
                }
            }

            update(dt) {
                if (!this.player.alive || !this.base.alive) return;

                if (this.player.cooldown > 0) this.player.cooldown -= dt;

                let dx = 0, dy = 0;
                if (this.keys['Up']) {dy = -1; this.player.dir = 0;}
                else if (this.keys['Right']) {dx = 1; this.player.dir = 1;}
                else if (this.keys['Down']) {dy = 1; this.player.dir = 2;}
                else if (this.keys['Left']) {dx = -1; this.player.dir = 3;}

                this.keys = {};

                if (dx !== 0 || dy !== 0) {
                    const nextX = this.player.x + dx * this.tileSize;
                    const nextY = this.player.y + dy * this.tileSize;

                    if (nextX >= 0 && nextX <= (this.gridSize - 1) * this.tileSize &&
                        nextY >= 0 && nextY <= (this.gridSize - 1) * this.tileSize) {
                        if (!this.checkCollision(nextX, nextY, this.player.w, this.player.h)) {
                            this.player.x = nextX;
                            this.player.y = nextY;
                        }
                    }
                }

                this.spawnTimer += dt;
                if (this.spawnTimer > 3.0) {
                    this.spawnTimer = 0;
                    this.spawnEnemy();
                }

                this.enemies.forEach((enemy) => {
                    if (enemy.cooldown > 0) enemy.cooldown -= dt;
                    enemy.changeDirTimer -= dt;


                    if (enemy.changeDirTimer <= 0) {
                        enemy.changeDirTimer = 1.2 + Math.random() * 1.5;
                        const roll = Math.random();
                        if (roll < 0.3) {
                            enemy.canAttack = false;
                        } else if (roll < 0.6) {
                            enemy.canAttack = true;
                            enemy.dir = Math.floor(Math.random() * 4);
                        } else {
                            enemy.canAttack = true;
                            const targetX = enemy.targetType === 'base' ? 7.5 * this.tileSize : this.player.x;
                            const targetY = enemy.targetType === 'base' ? 15 * this.tileSize : this.player.y;
                            enemy.dir = this.getBestDirTowards(enemy, targetX, targetY);
                        }
                    }

                    const evx = [0, 1, 0, -1][enemy.dir] * enemy.speed * dt;
                    const evy = [-1, 0, 1, 0][enemy.dir] * enemy.speed * dt;
                    const enextX = enemy.x + evx;
                    const enextY = enemy.y + evy;

                    if (!this.checkCollision(enextX, enextY, enemy.w, enemy.h)) {
                        enemy.x = Math.max(0, Math.min(380, enextX));
                        enemy.y = Math.max(0, Math.min(380, enextY));
                    } else {
                        enemy.changeDirTimer = 0;
                    }

                    if (this.checkEnemyLineOfFire(enemy)) {
                        this.shoot(enemy, false);
                    }
                });

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;

                    if (b.x < 0 || b.x > 400 || b.y < 0 || b.y > 400) {
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    const tileC = Math.floor(b.x / this.tileSize);
                    const tileR = Math.floor(b.y / this.tileSize);
                    if (tileR >= 0 && tileR < this.gridSize && tileC >= 0 && tileC < this.gridSize) {
                        if (this.map[tileR][tileC] === 1) {
                            this.map[tileR][tileC] = 0;
                            this.bullets.splice(i, 1);
                            continue;
                        } else if (this.map[tileR][tileC] === 2) {
                            this.bullets.splice(i, 1);
                            continue;
                        }
                    }

                    if (b.x >= 7 * this.tileSize && b.x <= 9 * this.tileSize && b.y >= 15 * this.tileSize) {
                        this.base.alive = false;
                        if (this.engine && this.engine.gameOver) this.engine.gameOver('BASE DESTROYED');
                        return;
                    }

                    if (b.isPlayer) {
                        for (let j = this.enemies.length - 1; j >= 0; j--) {
                            const e = this.enemies[j];
                            if (b.x >= e.x && b.x <= e.x + e.w && b.y >= e.y && b.y <= e.y + e.h) {
                                this.enemies.splice(j, 1);
                                this.bullets.splice(i, 1);
                                if (this.engine && this.engine.addScore) this.engine.addScore(100);
                                if (this.engine && this.engine.playSound) this.engine.playSound('score');
                                if (this.enemies.length === 0 && this.enemiesSpawned >= this.totalEnemies) {
                                    if (this.engine && this.engine.gameOver) this.engine.gameWin('VICTORY!');
                                }
                                break;
                            }
                        }
                    } else {
                        if (b.x >= this.player.x && b.x <= this.player.x + this.player.w &&
                            b.y >= this.player.y && b.y <= this.player.y + this.player.h) {
                            this.player.alive = false;
                            if (this.engine && this.engine.gameOver) this.engine.gameOver('TANK DESTROYED');
                            return;
                        }
                    }
                }
            }

            checkCollision(x, y, w, h) {
                const minC = Math.floor(x / this.tileSize);
                const maxC = Math.floor((x + w - 1) / this.tileSize);
                const minR = Math.floor(y / this.tileSize);
                const maxR = Math.floor((y + h - 1) / this.tileSize);

                for (let r = minR; r <= maxR; r++) {
                    for (let c = minC; c <= maxC; c++) {
                        if (r >= 0 && r < this.gridSize && c >= 0 && c < this.gridSize) {
                            if (this.map[r][c] !== 0) return true;
                        }
                    }
                }
                return false;
            }

            draw(ctx) {
                this.drawGround(ctx);

                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const x = c * this.tileSize;
                        const y = r * this.tileSize;
                        if (this.map[r][c] === 1) {
                            this.drawBrick(ctx, x, y);
                        } else if (this.map[r][c] === 2) {
                            this.drawSteel(ctx, x, y);
                        }
                    }
                }

                this.drawBase(ctx);

                if (this.player.alive) {
                    this.drawShermanTank(ctx, this.player.x, this.player.y, this.player.dir);
                }

                this.enemies.forEach(e => {
                    this.drawPanzerTank(ctx, e.x, e.y, e.dir);
                });

                this.bullets.forEach(b => {
                    this.drawBullet(ctx, b);
                });
            }

            drawGround(ctx) {
                ctx.fillStyle = '#14171a';
                ctx.fillRect(0, 0, 400, 400);

                ctx.strokeStyle = '#1d2228';
                ctx.lineWidth = 1;
                for (let r = 0; r <= this.gridSize; r++) {
                    ctx.beginPath();
                    ctx.moveTo(0, r * this.tileSize);
                    ctx.lineTo(400, r * this.tileSize);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(r * this.tileSize, 0);
                    ctx.lineTo(r * this.tileSize, 400);
                    ctx.stroke();
                }

                ctx.fillStyle = '#283038';
                for (let r = 0; r <= this.gridSize; r++) {
                    for (let c = 0; c <= this.gridSize; c++) {
                        ctx.fillRect(c * this.tileSize - 1, r * this.tileSize - 1, 2, 2);
                    }
                }
            }

            drawBrick(ctx, x, y) {
                ctx.fillStyle = '#2b140e';
                ctx.fillRect(x, y, this.tileSize, this.tileSize);

                const rows = 4;
                const rh = (this.tileSize - 1) / rows;
                for (let r = 0; r < rows; r++) {
                    const ry = y + r * rh + 0.5;
                    const offset = (r % 2 === 0) ? 0 : 6;
                    for (let c = -12; c < this.tileSize; c += 12) {
                        const bx = x + c + offset;
                        const bw = 11;
                        const drawX = Math.max(x, bx);
                        const drawW = Math.min(x + this.tileSize, bx + bw) - drawX;
                        if (drawW > 0) {
                            ctx.fillStyle = '#9e3b22';
                            ctx.fillRect(drawX, ry, drawW, rh - 1);
                            ctx.fillStyle = '#bf4e32';
                            ctx.fillRect(drawX, ry, drawW, 1);
                        }
                    }
                }
            }

            drawSteel(ctx, x, y) {
                const s = this.tileSize;
                ctx.fillStyle = '#343a40';
                ctx.fillRect(x, y, s, s);

                ctx.fillStyle = '#6c757d';
                ctx.fillRect(x + 2, y + 2, s - 4, s - 4);
                ctx.fillStyle = '#868e96';
                ctx.fillRect(x + 3, y + 3, s - 6, (s - 6) / 2);

                ctx.fillStyle = '#212529';
                ctx.fillRect(x + 3, y + 3, 2, 2);
                ctx.fillRect(x + s - 5, y + 3, 2, 2);
                ctx.fillRect(x + 3, y + s - 5, 2, 2);
                ctx.fillRect(x + s - 5, y + s - 5, 2, 2);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 4, y + s - 4);
                ctx.lineTo(x + s - 4, y + 4);
                ctx.stroke();
            }

            drawBase(ctx) {
                const bx = 7 * this.tileSize;
                const by = 15 * this.tileSize;
                const bw = 2 * this.tileSize;
                const bh = this.tileSize;

                if (this.base.alive) {
                    ctx.fillStyle = '#3a3f45';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = '#545c66';
                    ctx.fillRect(bx + 2, by + 2, bw - 4, bh - 4);

                    ctx.fillStyle = '#d6a01d';
                    ctx.fillRect(bx + 2, by + 2, bw - 4, 3);

                    ctx.fillStyle = '#1c2024';
                    ctx.beginPath();
                    ctx.arc(bx + bw / 2, by + bh / 2 + 1, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f5c211';
                    this.drawStar(ctx, bx + bw / 2, by + bh / 2 + 1, 5, 6, 2.5);

                    ctx.strokeStyle = '#aaaaaa';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(bx + 6, by + 6);
                    ctx.lineTo(bx + 6, by - 4);
                    ctx.stroke();
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(bx + 6, by - 4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = '#2d251e';
                    ctx.fillRect(bx + 3, by + 3, bw - 6, bh - 6);

                    ctx.strokeStyle = '#e25c1d';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(bx + 10, by + 5);
                    ctx.lineTo(bx + 20, by + 18);
                    ctx.lineTo(bx + 35, by + 8);
                    ctx.stroke();
                }
            }

            drawShermanTank(ctx, x, y, dir) {
                ctx.save();
                ctx.translate(x + 10, y + 10);
                const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
                ctx.rotate(angles[dir]);

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(-9, -8, 20, 20);

                ctx.fillStyle = '#1c201d';
                ctx.fillRect(-10, -10, 4, 20);
                ctx.fillRect(6, -10, 4, 20);

                ctx.fillStyle = '#333834';
                for (let i = -9; i <= 8; i += 4) {
                    ctx.fillRect(-10, i, 4, 1.5);
                    ctx.fillRect(6, i, 4, 1.5);
                }

                ctx.fillStyle = '#3f4829';
                ctx.fillRect(-7, -9, 14, 18);
                ctx.fillStyle = '#4e5a33';
                ctx.fillRect(-6, -8, 12, 16);

                ctx.fillStyle = '#2a311b';
                ctx.fillRect(-1.5, -14, 3, 8);
                ctx.fillRect(-2.5, -15, 5, 2);

                ctx.fillStyle = '#5c6a3c';
                ctx.beginPath();
                ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2d341d';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                this.drawStar(ctx, 0, 0, 5, 4, 1.8);

                ctx.restore();
            }

            drawPanzerTank(ctx, x, y, dir) {
                ctx.save();
                ctx.translate(x + 10, y + 10);
                const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
                ctx.rotate(angles[dir]);

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(-9, -8, 20, 20);

                ctx.fillStyle = '#232629';
                ctx.fillRect(-10, -10, 4, 20);
                ctx.fillRect(6, -10, 4, 20);

                ctx.fillStyle = '#42474d';
                for (let i = -9; i <= 8; i += 3.5) {
                    ctx.fillRect(-10, i, 4, 1.5);
                    ctx.fillRect(6, i, 4, 1.5);
                }

                ctx.fillStyle = '#3a3f45';
                ctx.fillRect(-7, -9, 14, 18);
                ctx.fillStyle = '#4d545d';
                ctx.fillRect(-6, -8, 12, 16);

                ctx.fillStyle = '#26292e';
                ctx.fillRect(-1.5, -16, 3, 10);
                ctx.fillStyle = '#1b1d20';
                ctx.fillRect(-3, -17, 6, 2.5);

                ctx.fillStyle = '#5a626d';
                ctx.beginPath();
                ctx.moveTo(-5, -4);
                ctx.lineTo(5, -4);
                ctx.lineTo(6, 4);
                ctx.lineTo(-6, 4);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#292c31';
                ctx.lineWidth = 1;
                ctx.stroke();

                this.drawBalkenkreuz(ctx, 0, 0);

                ctx.restore();
            }

            drawBullet(ctx, bullet) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(bullet.x - 1.5, bullet.y - 1.5, 3, 3);
                ctx.fillStyle = bullet.isPlayer ? '#ffcc00' : '#ff3300';
                ctx.fillRect(bullet.x - 2.5, bullet.y - 2.5, 5, 5);
                ctx.restore();
            }

            drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
                let rot = (Math.PI / 2) * 3;
                let x = cx, y = cy;
                let step = Math.PI / spikes;

                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }

            drawBalkenkreuz(ctx, cx, cy) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - 3, cy - 3, 6, 6);
                ctx.fillStyle = '#000000';
                ctx.fillRect(cx - 2, cy - 2, 4, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - 2, cy - 0.7, 4, 1.4);
                ctx.fillRect(cx - 0.7, cy - 2, 1.4, 4);
            }
        }



        class GoldMinerGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'goldminer';
                this.name = 'GOLD MINER';
                this.hint = 'HINT: A / DOWN / TAP TO LAUNCH HOOK';

                this.origin = {x: 200, y: 50};
                this.angle = 0;
                this.angularSpeed = 1.3;
                this.hookLength = 25;
                this.hookState = 'SWING';
                this.caughtItem = null;
                this.items = [];
                this.timer = 60;
                this.targetScore = 1000;
            }


            init() {
                this.angle = 0;
                this.angularSpeed = 1.3;
                this.hookLength = 25;
                this.hookState = 'SWING';
                this.caughtItem = null;
                this.timer = 60;
                this.generateItems();
            }


            generateItems() {
                this.items = [];
                const types = [
                    {type: 'gold_s', r: 10, val: 100, weight: 1.0, color: '#ffee00'},
                    {type: 'gold_m', r: 18, val: 250, weight: 2.2, color: '#ffee00'},
                    {type: 'gold_l', r: 28, val: 500, weight: 4.0, color: '#ffee00'},
                    {type: 'rock_s', r: 12, val: 20, weight: 3.5, color: '#888888'},
                    {type: 'rock_l', r: 22, val: 50, weight: 6.0, color: '#666666'},
                    {type: 'diamond', r: 8, val: 600, weight: 0.7, color: '#00ffff'}
                ];


                for (let i = 0; i < 11; i++) {
                    const template = types[Math.floor(Math.random() * types.length)];
                    let x, y, overlap;
                    let attempts = 0;
                    do {
                        overlap = false;
                        x = 30 + Math.random() * 340;
                        y = 110 + Math.random() * 260;
                        for (let item of this.items) {
                            if (Math.hypot(item.x - x, item.y - y) < item.r + template.r + 5) {
                                overlap = true;
                                break;
                            }
                        }
                        attempts++;
                    } while (overlap && attempts < 100);


                    if (!overlap) {
                        let vertices = [];
                        if (template.type.startsWith('gold') || template.type.startsWith('rock')) {
                            const count = template.type.startsWith('gold') ? 7 : 8;
                            for (let v = 0; v < count; v++) {
                                const a = (v / count) * Math.PI * 2;
                                const factor = 0.75 + Math.random() * 0.45;
                                vertices.push({
                                    x: Math.cos(a) * template.r * factor,
                                    y: Math.sin(a) * template.r * factor
                                });
                            }
                        }


                        this.items.push({
                            x, y,
                            r: template.r,
                            val: template.val,
                            weight: template.weight,
                            color: template.color,
                            type: template.type,
                            vertices: vertices
                        });
                    }
                }
            }


            onInput(action) {
                if ((action === 'A' || action === 'Down' || action === 'PointerTap') && this.hookState === 'SWING') {
                    this.hookState = 'SHOOT';
                    this.engine.playSound('beep');
                }
            }


            update(dt) {
                this.timer -= dt;
                if (this.timer <= 0) {
                    if (this.engine.score >= this.targetScore) {
                        this.engine.gameWin('STAGE CLEAR!');
                    } else {
                        this.engine.gameOver('TIME UP!');
                    }
                    return;
                }


                if (this.hookState === 'SWING') {
                    this.angle += this.angularSpeed * dt;
                    if (this.angle > 1.25 || this.angle < -1.25) {
                        this.angularSpeed *= -1;
                    }
                } else if (this.hookState === 'SHOOT') {
                    this.hookLength += 220 * dt;
                    const hx = this.origin.x + Math.sin(this.angle) * this.hookLength;
                    const hy = this.origin.y + Math.cos(this.angle) * this.hookLength;


                    if (hx < 10 || hx > 390 || hy > 390) {
                        this.hookState = 'RETRACT';
                    } else {
                        for (let i = 0; i < this.items.length; i++) {
                            const item = this.items[i];
                            if (Math.hypot(hx - item.x, hy - item.y) < item.r) {
                                this.caughtItem = item;
                                this.items.splice(i, 1);
                                this.hookState = 'RETRACT';
                                this.engine.playSound('beep');
                                break;
                            }
                        }
                    }
                } else if (this.hookState === 'RETRACT') {
                    const weight = this.caughtItem ? this.caughtItem.weight : 0.8;
                    const speed = 200 / weight;
                    this.hookLength -= speed * dt;


                    const hx = this.origin.x + Math.sin(this.angle) * this.hookLength;
                    const hy = this.origin.y + Math.cos(this.angle) * this.hookLength;


                    if (this.caughtItem) {
                        this.caughtItem.x = hx;
                        this.caughtItem.y = hy;
                    }


                    if (this.hookLength <= 25) {
                        this.hookLength = 25;
                        this.hookState = 'SWING';
                        if (this.caughtItem) {
                            this.engine.addScore(this.caughtItem.val);
                            this.engine.playSound('score');
                            this.caughtItem = null;
                        }
                    }
                }
            }


            drawBackground(ctx) {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, 400, 60);


                const dirtGrad = ctx.createLinearGradient(0, 60, 0, 400);
                dirtGrad.addColorStop(0, '#5c3a21');
                dirtGrad.addColorStop(0.3, '#3d2314');
                dirtGrad.addColorStop(1, '#1a0c05');
                ctx.fillStyle = dirtGrad;
                ctx.fillRect(0, 60, 400, 340);


                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.beginPath();
                ctx.moveTo(0, 160);
                ctx.bezierCurveTo(120, 140, 260, 175, 400, 155);
                ctx.lineTo(400, 400);
                ctx.lineTo(0, 400);
                ctx.fill();


                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.moveTo(0, 280);
                ctx.bezierCurveTo(140, 295, 280, 265, 400, 285);
                ctx.lineTo(400, 400);
                ctx.lineTo(0, 400);
                ctx.fill();


                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                for (let px = 15; px < 400; px += 28) {
                    for (let py = 75; py < 400; py += 25) {
                        const shiftX = ((px * 17 + py * 31) % 19) - 9;
                        const shiftY = ((px * 13 + py * 23) % 17) - 8;
                        const size = ((px + py) % 3) + 1.2;
                        ctx.beginPath();
                        ctx.arc(px + shiftX, py + shiftY, size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }


                ctx.fillStyle = '#15803d';
                ctx.fillRect(0, 56, 400, 4);
                ctx.fillStyle = '#854d0e';
                ctx.fillRect(0, 60, 400, 3);
            }


            drawItem(ctx, item) {
                ctx.save();
                ctx.translate(item.x, item.y);


                if (item.type.startsWith('gold')) {
                    const gGrad = ctx.createRadialGradient(-item.r * 0.3, -item.r * 0.3, item.r * 0.1, 0, 0, item.r * 1.2);
                    gGrad.addColorStop(0, '#ffffae');
                    gGrad.addColorStop(0.35, '#ffd700');
                    gGrad.addColorStop(0.8, '#d4af37');
                    gGrad.addColorStop(1, '#8b6508');


                    ctx.fillStyle = gGrad;
                    ctx.beginPath();
                    const verts = item.vertices;
                    ctx.moveTo(verts[0].x, verts[0].y);
                    for (let i = 1; i < verts.length; i++) {
                        ctx.lineTo(verts[i].x, verts[i].y);
                    }
                    ctx.closePath();
                    ctx.fill();


                    ctx.strokeStyle = '#b8860b';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();


                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(verts[0].x * 0.5, verts[0].y * 0.5);
                    ctx.lineTo(verts[2].x * 0.6, verts[2].y * 0.6);
                    ctx.lineTo(verts[4].x * 0.5, verts[4].y * 0.5);
                    ctx.stroke();


                } else if (item.type.startsWith('rock')) {
                    const rGrad = ctx.createLinearGradient(-item.r, -item.r, item.r, item.r);
                    rGrad.addColorStop(0, '#a1a1aa');
                    rGrad.addColorStop(0.5, '#52525b');
                    rGrad.addColorStop(1, '#27272a');


                    ctx.fillStyle = rGrad;
                    ctx.beginPath();
                    const rVerts = item.vertices;
                    ctx.moveTo(rVerts[0].x, rVerts[0].y);
                    for (let i = 1; i < rVerts.length; i++) {
                        ctx.lineTo(rVerts[i].x, rVerts[i].y);
                    }
                    ctx.closePath();
                    ctx.fill();


                    ctx.strokeStyle = '#18181b';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();


                    ctx.strokeStyle = '#27272a';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(rVerts[1].x * 0.7, rVerts[1].y * 0.7);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(rVerts[5].x * 0.6, rVerts[5].y * 0.6);
                    ctx.stroke();


                } else if (item.type === 'diamond') {
                    const r = item.r * 1.1;


                    ctx.beginPath();
                    ctx.moveTo(-r * 0.6, -r * 0.7);
                    ctx.lineTo(r * 0.6, -r * 0.7);
                    ctx.lineTo(r, -r * 0.1);
                    ctx.lineTo(0, r);
                    ctx.lineTo(-r, -r * 0.1);
                    ctx.closePath();


                    const dGrad = ctx.createLinearGradient(-r, -r, r, r);
                    dGrad.addColorStop(0, '#ffffff');
                    dGrad.addColorStop(0.25, '#b2fefa');
                    dGrad.addColorStop(0.7, '#0eb3e6');
                    dGrad.addColorStop(1, '#005c97');


                    ctx.fillStyle = dGrad;
                    ctx.fill();


                    ctx.strokeStyle = '#e0ffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();


                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.6, -r * 0.7);
                    ctx.lineTo(-r * 0.2, -r * 0.1);
                    ctx.lineTo(r * 0.2, -r * 0.1);
                    ctx.lineTo(r * 0.6, -r * 0.7);


                    ctx.moveTo(-r, -r * 0.1);
                    ctx.lineTo(-r * 0.2, -r * 0.1);
                    ctx.lineTo(0, r);
                    ctx.lineTo(r * 0.2, -r * 0.1);
                    ctx.lineTo(r, -r * 0.1);


                    ctx.moveTo(-r * 0.2, -r * 0.1);
                    ctx.lineTo(0, -r * 0.7);
                    ctx.lineTo(r * 0.2, -r * 0.1);
                    ctx.stroke();


                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-r * 0.3, -r * 0.4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }


                ctx.restore();
            }


            drawHook(ctx, hx, hy) {
                ctx.save();
                ctx.translate(hx, hy);
                ctx.rotate(-this.angle);


                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -7, 3, 0, Math.PI * 2);
                ctx.stroke();


                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(0, -2, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#7f1d1d';
                ctx.lineWidth = 1;
                ctx.stroke();


                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.quadraticCurveTo(-12, 6, -10, 16);
                ctx.quadraticCurveTo(-5, 18, -2, 12);
                ctx.stroke();


                ctx.beginPath();
                ctx.moveTo(2, 0);
                ctx.quadraticCurveTo(12, 6, 10, 16);
                ctx.quadraticCurveTo(5, 18, 2, 12);
                ctx.stroke();


                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.moveTo(-10, 16);
                ctx.lineTo(-13, 19);
                ctx.lineTo(-7, 17);
                ctx.closePath();
                ctx.fill();


                ctx.beginPath();
                ctx.moveTo(10, 16);
                ctx.lineTo(13, 19);
                ctx.lineTo(7, 17);
                ctx.closePath();
                ctx.fill();


                ctx.restore();
            }


            draw(ctx) {
                this.drawBackground(ctx);


                ctx.fillStyle = '#475569';
                ctx.fillRect(this.origin.x - 14, this.origin.y - 12, 28, 12);
                ctx.fillStyle = '#64748b';
                ctx.fillRect(this.origin.x - 10, this.origin.y - 8, 20, 8);
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(this.origin.x, this.origin.y, 3, 0, Math.PI * 2);
                ctx.fill();


                this.items.forEach(item => this.drawItem(ctx, item));


                if (this.caughtItem) {
                    this.drawItem(ctx, this.caughtItem);
                }


                const hx = this.origin.x + Math.sin(this.angle) * this.hookLength;
                const hy = this.origin.y + Math.cos(this.angle) * this.hookLength;


                ctx.strokeStyle = '#d6d3d1';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 2]);
                ctx.beginPath();
                ctx.moveTo(this.origin.x, this.origin.y);
                ctx.lineTo(hx, hy);
                ctx.stroke();
                ctx.setLineDash([]);


                this.drawHook(ctx, hx, hy);


                ctx.fillStyle = '#ffee00';
                ctx.font = '8px "Press Start 2P"';
                ctx.fillText(`TIME: ${Math.max(0, Math.ceil(this.timer))}`, 10, 20);
                ctx.fillText(`TARGET: ${this.targetScore}`, 260, 20);
            }
        }

        class G3DRTDemoGame extends BaseGame {
            constructor(engine) {
                const Vec3 = {
                    create: (x = 0, y = 0, z = 0) => new Float32Array([x, y, z]),
                    set: (out, x, y, z) => {out[0] = x; out[1] = y; out[2] = z; return out;},
                    copy: (out, a) => {out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; return out;},
                    add: (out, a, b) => {out[0] = a[0] + b[0]; out[1] = a[1] + b[1]; out[2] = a[2] + b[2]; return out;},
                    sub: (out, a, b) => {out[0] = a[0] - b[0]; out[1] = a[1] - b[1]; out[2] = a[2] - b[2]; return out;},
                    scale: (out, a, s) => {out[0] = a[0] * s; out[1] = a[1] * s; out[2] = a[2] * s; return out;},
                    multiply: (out, a, b) => {out[0] = a[0] * b[0]; out[1] = a[1] * b[1]; out[2] = a[2] * b[2]; return out;},
                    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
                    cross: (out, a, b) => {
                        const ax = a[0], ay = a[1], az = a[2];
                        const bx = b[0], by = b[1], bz = b[2];
                        out[0] = ay * bz - az * by;
                        out[1] = az * bx - ax * bz;
                        out[2] = ax * by - ay * bx;
                        return out;
                    },
                    length: (a) => Math.hypot(a[0], a[1], a[2]),
                    normalize: (out, a) => {
                        const len = Math.hypot(a[0], a[1], a[2]);
                        if (len > 0.00001) {
                            out[0] = a[0] / len;
                            out[1] = a[1] / len;
                            out[2] = a[2] / len;
                        } else {
                            out[0] = 0; out[1] = 0; out[2] = 0;
                        }
                        return out;
                    },
                    reflect: (out, incident, normal) => {
                        const d = Vec3.dot(incident, normal) * 2;
                        out[0] = incident[0] - d * normal[0];
                        out[1] = incident[1] - d * normal[1];
                        out[2] = incident[2] - d * normal[2];
                        return out;
                    }
                };

                class Ray {
                    constructor() {
                        this.ox = 0; this.oy = 0; this.oz = 0;
                        this.dx = 0; this.dy = 0; this.dz = 0;
                    }
                }

                class Material {
                    constructor(color, reflectivity = 0, specular = 32, isCheckerboard = false) {
                        this.color = Float32Array.from(color);
                        this.reflectivity = reflectivity;
                        this.specular = specular;
                        this.isCheckerboard = isCheckerboard;
                    }
                }

                class Sphere {
                    constructor(center, radius, material) {
                        this.type = 'sphere';
                        this.cx = center[0];
                        this.cy = center[1];
                        this.cz = center[2];
                        this.radius = radius;
                        this.radiusSq = radius * radius;
                        this.invRadius = 1.0 / radius;
                        this.material = material;
                    }

                    intersect(ray, hit) {
                        const ocX = ray.ox - this.cx;
                        const ocY = ray.oy - this.cy;
                        const ocZ = ray.oz - this.cz;

                        const b = ocX * ray.dx + ocY * ray.dy + ocZ * ray.dz;
                        const c = (ocX * ocX + ocY * ocY + ocZ * ocZ) - this.radiusSq;
                        const disc = b * b - c;

                        if (disc > 0) {
                            const sqrtD = Math.sqrt(disc);
                            let t = -b - sqrtD;
                            if (t < 0.001) t = -b + sqrtD;

                            if (t > 0.001 && t < hit.t) {
                                hit.t = t;
                                hit.material = this.material;
                                hit.px = ray.ox + t * ray.dx;
                                hit.py = ray.oy + t * ray.dy;
                                hit.pz = ray.oz + t * ray.dz;

                                hit.nx = (hit.px - this.cx) * this.invRadius;
                                hit.ny = (hit.py - this.cy) * this.invRadius;
                                hit.nz = (hit.pz - this.cz) * this.invRadius;
                                return true;
                            }
                        }
                        return false;
                    }

                    testIntersect(ray, maxT) {
                        const ocX = ray.ox - this.cx, ocY = ray.oy - this.cy, ocZ = ray.oz - this.cz;
                        const b = ocX * ray.dx + ocY * ray.dy + ocZ * ray.dz;
                        const disc = b * b - ((ocX * ocX + ocY * ocY + ocZ * ocZ) - this.radiusSq);

                        if (disc > 0) {
                            const sqrtD = Math.sqrt(disc);
                            let t = -b - sqrtD;
                            if (t < 0.001) t = -b + sqrtD;
                            return t > 0.001 && t < maxT;
                        }
                        return false;
                    }
                }

                class Plane {
                    constructor(point, normal, material) {
                        this.type = 'plane';
                        this.px = point[0]; this.py = point[1]; this.pz = point[2];
                        const len = Math.sqrt(normal[0] * normal[0] + normal[1] * normal[1] + normal[2] * normal[2]);
                        const invLen = 1.0 / len;
                        this.nx = normal[0] * invLen; this.ny = normal[1] * invLen; this.nz = normal[2] * invLen;
                        this.material = material;
                    }

                    intersect(ray, hit) {
                        const denom = this.nx * ray.dx + this.ny * ray.dy + this.nz * ray.dz;
                        if (denom > 0.0001 || denom < -0.0001) {
                            const t = ((this.px - ray.ox) * this.nx + (this.py - ray.oy) * this.ny + (this.pz - ray.oz) * this.nz) / denom;
                            if (t > 0.001 && t < hit.t) {
                                hit.t = t; hit.material = this.material;
                                hit.px = ray.ox + t * ray.dx; hit.py = ray.oy + t * ray.dy; hit.pz = ray.oz + t * ray.dz;
                                hit.nx = denom > 0 ? -this.nx : this.nx;
                                hit.ny = denom > 0 ? -this.ny : this.ny;
                                hit.nz = denom > 0 ? -this.nz : this.nz;
                                return true;
                            }
                        }
                        return false;
                    }

                    testIntersect(ray, maxT) {
                        const denom = this.nx * ray.dx + this.ny * ray.dy + this.nz * ray.dz;
                        if (denom > 0.0001 || denom < -0.0001) {
                            const t = ((this.px - ray.ox) * this.nx + (this.py - ray.oy) * this.ny + (this.pz - ray.oz) * this.nz) / denom;
                            return t > 0.001 && t < maxT;
                        }
                        return false;
                    }
                }

                class Cylinder {
                    constructor(center, radius, height, material) {
                        this.type = 'cylinder';
                        this.cx = center[0]; this.cy = center[1]; this.cz = center[2];
                        this.radiusSq = radius * radius;
                        this.invRadius = 1.0 / radius;
                        this.halfH = height * 0.5;
                        this.material = material;
                    }

                    intersect(ray, hit) {
                        const dx = ray.dx, dz = ray.dz;
                        const ox = ray.ox - this.cx, oz = ray.oz - this.cz;
                        const a = dx * dx + dz * dz;
                        if (a < 0.00001) return false;

                        const b = 2 * (ox * dx + oz * dz);
                        const disc = b * b - 4 * a * (ox * ox + oz * oz - this.radiusSq);
                        if (disc < 0) return false;

                        const sqrtD = Math.sqrt(disc);
                        const inv2a = 0.5 / a;
                        const t1 = (-b - sqrtD) * inv2a;
                        const t2 = (-b + sqrtD) * inv2a;

                        let hitFound = false;
                        let selectedT = Infinity;
                        let nx = 0, ny = 0, nz = 0;

                        if (t1 > 0.001 && t1 < hit.t && Math.abs(ray.oy + t1 * ray.dy - this.cy) <= this.halfH) {
                            selectedT = t1; hitFound = true;
                            nx = (ray.ox + t1 * dx - this.cx) * this.invRadius;
                            nz = (ray.oz + t1 * dz - this.cz) * this.invRadius;
                        } else if (t2 > 0.001 && t2 < hit.t && Math.abs(ray.oy + t2 * ray.dy - this.cy) <= this.halfH) {
                            selectedT = t2; hitFound = true;
                            nx = (ray.ox + t2 * dx - this.cx) * this.invRadius;
                            nz = (ray.oz + t2 * dz - this.cz) * this.invRadius;
                        }

                        const invDy = 1.0 / ray.dy;
                        const tTop = (this.cy + this.halfH - ray.oy) * invDy;
                        if (tTop > 0.001 && tTop < hit.t && tTop < selectedT) {
                            const px = ray.ox + tTop * dx - this.cx, pz = ray.oz + tTop * dz - this.cz;
                            if (px * px + pz * pz <= this.radiusSq) {selectedT = tTop; hitFound = true; nx = 0; ny = 1; nz = 0;}
                        }

                        const tBot = (this.cy - this.halfH - ray.oy) * invDy;
                        if (tBot > 0.001 && tBot < hit.t && tBot < selectedT) {
                            const px = ray.ox + tBot * dx - this.cx, pz = ray.oz + tBot * dz - this.cz;
                            if (px * px + pz * pz <= this.radiusSq) {selectedT = tBot; hitFound = true; nx = 0; ny = -1; nz = 0;}
                        }

                        if (hitFound && selectedT < hit.t) {
                            hit.t = selectedT; hit.material = this.material;
                            hit.px = ray.ox + selectedT * dx; hit.py = ray.oy + selectedT * ray.dy; hit.pz = ray.oz + selectedT * dz;
                            hit.nx = nx; hit.ny = ny; hit.nz = nz;
                            return true;
                        }
                        return false;
                    }

                    testIntersect(ray, maxT) {
                        const dx = ray.dx, dz = ray.dz;
                        const ox = ray.ox - this.cx, oz = ray.oz - this.cz;
                        const a = dx * dx + dz * dz;
                        if (a >= 0.00001) {
                            const b = 2 * (ox * dx + oz * dz);
                            const disc = b * b - 4 * a * (ox * ox + oz * oz - this.radiusSq);
                            if (disc >= 0) {
                                const sqrtD = Math.sqrt(disc), inv2a = 0.5 / a;
                                const t1 = (-b - sqrtD) * inv2a;
                                if (t1 > 0.001 && t1 < maxT && Math.abs(ray.oy + t1 * ray.dy - this.cy) <= this.halfH) return true;
                                const t2 = (-b + sqrtD) * inv2a;
                                if (t2 > 0.001 && t2 < maxT && Math.abs(ray.oy + t2 * ray.dy - this.cy) <= this.halfH) return true;
                            }
                        }
                        const invDy = 1.0 / ray.dy;
                        const tTop = (this.cy + this.halfH - ray.oy) * invDy;
                        if (tTop > 0.001 && tTop < maxT) {
                            const px = ray.ox + tTop * dx - this.cx, pz = ray.oz + tTop * dz - this.cz;
                            if (px * px + pz * pz <= this.radiusSq) return true;
                        }
                        const tBot = (this.cy - this.halfH - ray.oy) * invDy;
                        if (tBot > 0.001 && tBot < maxT) {
                            const px = ray.ox + tBot * dx - this.cx, pz = ray.oz + tBot * dz - this.cz;
                            if (px * px + pz * pz <= this.radiusSq) return true;
                        }
                        return false;
                    }
                }

                class Triangle {
                    constructor(v0, v1, v2, material) {
                        this.type = 'triangle';
                        this.v0x = v0[0]; this.v0y = v0[1]; this.v0z = v0[2];
                        this.e1x = v1[0] - v0[0]; this.e1y = v1[1] - v0[1]; this.e1z = v1[2] - v0[2];
                        this.e2x = v2[0] - v0[0]; this.e2y = v2[1] - v0[1]; this.e2z = v2[2] - v0[2];
                        this.material = material;

                        const nx = this.e1y * this.e2z - this.e1z * this.e2y;
                        const ny = this.e1z * this.e2x - this.e1x * this.e2z;
                        const nz = this.e1x * this.e2y - this.e1y * this.e2x;
                        const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
                        this.nx = nx * invLen; this.ny = ny * invLen; this.nz = nz * invLen;
                    }

                    intersect(ray, hit) {
                        const hx = ray.dy * this.e2z - ray.dz * this.e2y;
                        const hy = ray.dz * this.e2x - ray.dx * this.e2z;
                        const hz = ray.dx * this.e2y - ray.dy * this.e2x;
                        const a = this.e1x * hx + this.e1y * hy + this.e1z * hz;

                        if (a > -0.00001 && a < 0.00001) return false;

                        const f = 1.0 / a;
                        const sx = ray.ox - this.v0x, sy = ray.oy - this.v0y, sz = ray.oz - this.v0z;
                        const u = f * (sx * hx + sy * hy + sz * hz);

                        if (u < 0.0 || u > 1.0) return false;

                        const qx = sy * this.e1z - sz * this.e1y;
                        const qy = sz * this.e1x - sx * this.e1z;
                        const qz = sx * this.e1y - sy * this.e1x;
                        const v = f * (ray.dx * qx + ray.dy * qy + ray.dz * qz);

                        if (v < 0.0 || u + v > 1.0) return false;

                        const t = f * (this.e2x * qx + this.e2y * qy + this.e2z * qz);
                        if (t > 0.001 && t < hit.t) {
                            hit.t = t; hit.material = this.material;
                            hit.px = ray.ox + t * ray.dx; hit.py = ray.oy + t * ray.dy; hit.pz = ray.oz + t * ray.dz;
                            hit.nx = this.nx; hit.ny = this.ny; hit.nz = this.nz;
                            return true;
                        }
                        return false;
                    }

                    testIntersect(ray, maxT) {
                        const hx = ray.dy * this.e2z - ray.dz * this.e2y;
                        const hy = ray.dz * this.e2x - ray.dx * this.e2z;
                        const hz = ray.dx * this.e2y - ray.dy * this.e2x;
                        const a = this.e1x * hx + this.e1y * hy + this.e1z * hz;

                        if (a > -0.00001 && a < 0.00001) return false;

                        const f = 1.0 / a;
                        const sx = ray.ox - this.v0x, sy = ray.oy - this.v0y, sz = ray.oz - this.v0z;
                        const u = f * (sx * hx + sy * hy + sz * hz);

                        if (u < 0.0 || u > 1.0) return false;

                        const qx = sy * this.e1z - sz * this.e1y;
                        const qy = sz * this.e1x - sx * this.e1z;
                        const qz = sx * this.e1y - sy * this.e1x;
                        const v = f * (ray.dx * qx + ray.dy * qy + ray.dz * qz);

                        if (v < 0.0 || u + v > 1.0) return false;

                        const t = f * (this.e2x * qx + this.e2y * qy + this.e2z * qz);
                        return t > 0.001 && t < maxT;
                    }
                }

                class Scene {
                    constructor() {
                        this.objects = [];
                        this.lightPos = Vec3.create(0, 18, 0);
                        this.lightColor = Vec3.create(1, 0.95, 0.85);
                        this.lightRadius = 0.5;
                        this.ambientColor = Vec3.create(0.08, 0.1, 0.16);

                        this.setupScene();
                    }

                    setupScene() {
                        const mirrorMat = new Material([0.9, 0.9, 0.95], 0.82, 128);
                        const goldMat = new Material([1.0, 0.78, 0.2], 0.45, 64);
                        const cyanMat = new Material([0.0, 0.9, 1.0], 0.25, 32);
                        const magentaMat = new Material([1.0, 0.0, 0.47], 0.35, 48);
                        const limeMat = new Material([0.1, 0.95, 0.4], 0.15, 16);
                        const checkerMat = new Material([0.8, 0.8, 0.8], 0.25, 16, true);

                        this.objects.push(new Plane([0, -4, 0], [0, 1, 0], checkerMat));

                        this.objects.push(new Sphere([0, 1, 0], 5.0, mirrorMat));

                        this.objects.push(new Sphere([-9, -0.5, 6], 3.2, goldMat));

                        this.objects.push(new Cylinder([9, 0, 5], 2.8, 7.0, magentaMat));

                        const top = [-7, 6, -7];
                        const b0 = [-11, -4, -4];
                        const b1 = [-3, -4, -4];
                        const b2 = [-7, -4, -11];
