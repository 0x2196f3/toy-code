<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NINTENDO GAME HUB</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }


        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            background-color: #111;
            color: #fff;
        }


        #theme-switcher {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 1000;
            padding: 8px 14px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #fff;
            background: #000;
            color: #fff;
            border-radius: 4px;
            opacity: 0.2;
        }

        #theme-switcher:hover {
            opacity: 1;
        }


        .cabinet {
            padding: 12px;
            width: 96vw;
            max-width: 420px;
            height: 98vh;
            max-height: 760px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }


        .stage-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            max-height: 42vh;
            overflow: hidden;
        }


        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }


        .info-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            font-size: 12px;
        }


        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            z-index: 10;
        }

        .virtual-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 10px;
            margin-top: 2px;
        }


        .dpad,
        .abxy-pad {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 4px;
        }


        .dpad-empty,
        .abxy-empty {
            visibility: hidden;
        }


        .controls-hint {
            font-size: 10px;
            text-align: center;
            min-height: 20px;
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <button id="theme-switcher">THEME: DEFAULT</button>
    <div id="fx-container"></div>
    <div class="cabinet" id="cabinet">
        <h1 id="app-title">NINTENDO GAME HUB</h1>

        <div class="stage-container" id="stage">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div id="overlay" class="overlay">
                <h2 id="overlay-title">READY</h2>
                <p id="overlay-msg">PRESS START TO PLAY</p>
                <button class="btn" id="start-btn">START</button>
            </div>
        </div>

        <div class="info-panel">
            <div>SCORE: <span id="score">0</span></div>
            <div>HIGH: <span id="highscore">0</span></div>
        </div>

        <div class="virtual-controls">
            <div class="dpad">
                <div class="dpad-empty"></div>
                <button class="dbtn" data-input="Up">▲</button>
                <div class="dpad-empty"></div>
                <button class="dbtn" data-input="Left">◄</button>
                <div class="dpad-empty"></div>
                <button class="dbtn" data-input="Right">►</button>
                <div class="dpad-empty"></div>
                <button class="dbtn" data-input="Down">▼</button>
                <div class="dpad-empty"></div>
            </div>

            <div class="abxy-pad">
                <div class="abxy-empty"></div>
                <button class="abtn" data-input="X">X</button>
                <div class="abxy-empty"></div>
                <button class="abtn" data-input="Y">Y</button>
                <div class="abxy-empty"></div>
                <button class="abtn" data-input="A">A</button>
                <div class="abxy-empty"></div>
                <button class="abtn" data-input="B">B</button>
                <div class="abxy-empty"></div>
            </div>
        </div>

        <div class="controls-hint" id="controls-hint"></div>
    </div>

    <script>
        class BaseTheme {
            constructor(name, audioProvider = null) {
                this.name = name;
                this.styleElement = null;
                this.audioProvider = audioProvider;
            }

            mount() {
                const css = this.getStyle();
                if (css) {
                    this.styleElement = document.createElement('style');
                    this.styleElement.id = `theme-style-${this.name}`;
                    this.styleElement.textContent = css;
                    document.head.appendChild(this.styleElement);
                }
                this.onMount();
            }

            unmount() {
                if (this.styleElement && this.styleElement.parentNode) {
                    this.styleElement.parentNode.removeChild(this.styleElement);
                }
                this.onUnmount();
            }

            getStyle() {
                return '';
            }

            onMount() { }
            onUnmount() { }
        }

        class BaseAudioProvider {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSound(type) {
                this.init();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    const now = this.ctx.currentTime;

                    switch (type) {
                        case 'beep':
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(420, now);
                            gain.gain.setValueAtTime(0.04, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                            osc.start(now);
                            osc.stop(now + 0.05);
                            break;

                        case 'score':
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(523.25, now);
                            osc.frequency.setValueAtTime(880, now + 0.07);
                            gain.gain.setValueAtTime(0.06, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                            osc.start(now);
                            osc.stop(now + 0.16);
                            break;

                        case 'gameover':
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(280, now);
                            osc.frequency.linearRampToValueAtTime(70, now + 0.32);
                            gain.gain.setValueAtTime(0.08, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                            osc.start(now);
                            osc.stop(now + 0.32);
                            break;

                        case 'win':
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(440, now);
                            osc.frequency.setValueAtTime(554.37, now + 0.1);
                            osc.frequency.setValueAtTime(659.25, now + 0.2);
                            osc.frequency.setValueAtTime(880, now + 0.3);
                            gain.gain.setValueAtTime(0.08, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                            osc.start(now);
                            osc.stop(now + 0.5);
                            break;

                        default:
                            return false;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            playThemeBGM() {return null;}

            playGameBGM() {return null;}
        }

        class BaseGame {
            constructor(engine) {
                this.engine = engine;
                this.id = 'base';
                this.name = 'BASE GAME';
                this.hint = '';
            }

            init() { }
            destroy() { }
            pause() { }
            resume() { }
            update(dt) { }
            draw(ctx) { }
            onInput(action, details) { }
        }

        class StorageManager {
            constructor(prefix = 'arcade_') {
                this.prefix = prefix;
                this.memoryStorage = new Map();
                this.isAvailable = this.checkAvailability();
            }

            checkAvailability() {
                try {
                    const testKey = '__storage_test__';
                    window.localStorage.setItem(testKey, testKey);
                    window.localStorage.removeItem(testKey);
                    return true;
                } catch (e) {
                    console.warn('StorageManager: localStorage unavailable, using in-memory storage.');
                    return false;
                }
            }

            getKey(key) {
                return `${this.prefix}${key}`;
            }

            get(key, defaultValue = null) {
                const fullKey = this.getKey(key);
                try {
                    if (this.isAvailable) {
                        const item = window.localStorage.getItem(fullKey);
                        return item !== null ? JSON.parse(item) : defaultValue;
                    } else {
                        const item = this.memoryStorage.get(fullKey);
                        return item !== undefined ? JSON.parse(item) : defaultValue;
                    }
                } catch (e) {
                    console.error(`StorageManager: Read error [${key}]`, e);
                    return defaultValue;
                }
            }

            set(key, value) {
                const fullKey = this.getKey(key);
                try {
                    const serialized = JSON.stringify(value);
                    if (this.isAvailable) {
                        window.localStorage.setItem(fullKey, serialized);
                    } else {
                        this.memoryStorage.set(fullKey, serialized);
                    }
                    return true;
                } catch (e) {
                    console.error(`StorageManager: Write error [${key}]`, e);
                    this.memoryStorage.set(fullKey, JSON.stringify(value));
                    return false;
                }
            }

            remove(key) {
                const fullKey = this.getKey(key);
                try {
                    if (this.isAvailable) {
                        window.localStorage.removeItem(fullKey);
                    }
                    this.memoryStorage.delete(fullKey);
                } catch (e) {
                    console.error(`StorageManager: Remove error [${key}]`, e);
                }
            }


            getHighScore(gameId) {
                const highScores = this.get('highscores', {});
                return highScores[gameId] || 0;
            }


            setHighScore(gameId, score) {
                const highScores = this.get('highscores', {});
                const currentHigh = highScores[gameId] || 0;


                if (score > currentHigh) {
                    highScores[gameId] = score;
                    this.set('highscores', highScores);
                    return true;
                }
                return false;
            }

            getSetting(key, defaultValue = null) {
                const settings = this.get('settings', {});
                return settings[key] !== undefined ? settings[key] : defaultValue;
            }


            setSetting(key, value) {
                const settings = this.get('settings', {});
                settings[key] = value;
                return this.set('settings', settings);
            }
        }

        class ThemeManager {
            constructor() {
                this.themes = [];
                this.currentIndex = 0;
                this.btn = document.getElementById('theme-switcher');
                this.btn.addEventListener('click', () => this.nextTheme());
                this.onThemeChangeCallbacks = [];
            }

            subscribe(callback) {
                this.onThemeChangeCallbacks.push(callback);
            }

            register(...themeInstances) {
                this.themes.push(...themeInstances);

                if (this.themes.length === themeInstances.length) {
                    this.applyTheme(0);
                }
            }

            nextTheme() {
                if (this.themes.length === 0) return;
                const nextIdx = (this.currentIndex + 1) % this.themes.length;
                this.applyTheme(nextIdx);
            }

            applyTheme(index) {
                if (this.themes[this.currentIndex]) {
                    this.themes[this.currentIndex].unmount();
                }
                this.currentIndex = index;
                const activeTheme = this.themes[this.currentIndex];
                activeTheme.mount();
                this.btn.textContent = `THEME: ${activeTheme.name.toUpperCase()}`;
                this.onThemeChangeCallbacks.forEach(cb => cb(activeTheme));
            }
        }

        class AudioManager {
            constructor(baseAudioProvider) {
                this.baseAudioProvider = baseAudioProvider;
                this.themeAudioProvider = null;
                this.gameAudioProvider = null;
                this.themeBgmStopFn = null;
                this.gameBgmStopFn = null;
            }

            setThemeAudioProvider(provider) {
                this.stopThemeBGM();
                this.themeAudioProvider = provider;
            }

            setGameAudioProvider(provider) {
                this.stopGameBGM();
                this.gameAudioProvider = provider;
            }

            playThemeBGM() {
                this.playBGM(
                    this.themeAudioProvider || this.baseAudioProvider,
                    'playThemeBGM',
                    'themeBgmStopFn'
                );
            }

            playGameBGM() {
                this.playBGM(
                    this.gameAudioProvider,
                    'playGameBGM',
                    'gameBgmStopFn'
                );
            }

            playBGM(provider, method, stopFnKey) {
                this.stopThemeBGM();
                this.stopGameBGM();

                if (typeof provider?.[method] === 'function') {
                    this[stopFnKey] = provider[method]();
                }
            }

            stopThemeBGM() {
                this.stopBGM('themeBgmStopFn');
            }

            stopGameBGM() {
                this.stopBGM('gameBgmStopFn');
            }

            stopBGM(stopFnKey) {
                this[stopFnKey]?.();
                this[stopFnKey] = null;
            }


            playSound(type) {
                const providers = [this.gameAudioProvider, this.themeAudioProvider, this.baseAudioProvider];
                for (let provider of providers) {
                    if (!provider) continue;

                    try {
                        if (typeof provider.playSound === 'function' && provider.playSound(type) === true) {
                            return;
                        }
                    } catch (e) { }
                }
            }
        }

        class InputManager {
            constructor(targetElement, inputHandler, options = {}) {
                this.target = targetElement;
                this.inputHandler = inputHandler;
                this.repeatInitialDelay = options.repeatInitialDelay || 200;
                this.repeatInterval = options.repeatInterval || 50;
                this.activeKeyTimers = new Map();

                if (this.target) {
                    this.target.style.touchAction = 'none';
                }

                this.initKeyboard();
                this.initPointerEvents();
                this.initVirtualButtons();
                this.initWheelEvents();
                this.preventContextMenu();
            }

            dispatchAction(action, details = null) {
                if (!action) return;
                this.inputHandler(action, details);
            }

            startRepeatingAction(id, action) {
                if (this.activeKeyTimers.has(id)) return;

                this.dispatchAction(action);

                const timeoutId = setTimeout(() => {
                    const intervalId = setInterval(() => {
                        this.dispatchAction(action);
                    }, this.repeatInterval);

                    const timerInfo = this.activeKeyTimers.get(id);
                    if (timerInfo) {
                        timerInfo.intervalId = intervalId;
                    }
                }, this.repeatInitialDelay);

                this.activeKeyTimers.set(id, {timeoutId, intervalId: null});
            }

            stopRepeatingAction(id) {
                if (this.activeKeyTimers.has(id)) {
                    const {timeoutId, intervalId} = this.activeKeyTimers.get(id);
                    clearTimeout(timeoutId);
                    if (intervalId) clearInterval(intervalId);
                    this.activeKeyTimers.delete(id);
                }
            }

            stopAllRepeatingActions() {
                this.activeKeyTimers.forEach(({timeoutId, intervalId}) => {
                    clearTimeout(timeoutId);
                    if (intervalId) clearInterval(intervalId);
                });
                this.activeKeyTimers.clear();
            }

            getMappedPointerDetails(clientX, clientY) {
                if (!this.target) return null;
                const rect = this.target.getBoundingClientRect();

                const internalWidth = this.target.width || rect.width;
                const internalHeight = this.target.height || rect.height;

                const scaleX = rect.width ? (internalWidth / rect.width) : 1;
                const scaleY = rect.height ? (internalHeight / rect.height) : 1;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY,
                    width: internalWidth,
                    height: internalHeight
                };
            }

            preventContextMenu() {
                window.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            virbate(duration = 30) {navigator.vibrate?.(duration);}

            initKeyboard() {
                const keyMap = {
                    'ArrowUp': 'Up', 'KeyW': 'Up',
                    'ArrowDown': 'Down', 'KeyS': 'Down',
                    'ArrowLeft': 'Left', 'KeyA': 'Left',
                    'ArrowRight': 'Right', 'KeyD': 'Right',
                    'KeyJ': 'A', 'Space': 'A', 'Enter': 'A',
                    'KeyK': 'B', 'Escape': 'B', 'Backspace': 'B',
                    'KeyU': 'X', 'KeyI': 'Y'
                };

                window.addEventListener('keydown', (e) => {
                    const action = keyMap[e.code];
                    if (!action) return;

                    e.preventDefault();
                    document.activeElement?.blur();

                    this.startRepeatingAction(e.code, action);
                });

                window.addEventListener('keyup', (e) => {
                    this.stopRepeatingAction(e.code);
                });

                window.addEventListener('blur', () => {
                    this.stopAllRepeatingActions();
                });
            }

            initVirtualButtons() {
                document.querySelectorAll('[data-input]').forEach(btn => {
                    btn.setAttribute('tabindex', '-1');
                    const action = btn.getAttribute('data-input');

                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        this.virbate();
                        btn.setPointerCapture(e.pointerId);
                        this.startRepeatingAction(btn, action);
                    });

                    const handlePointerUpOrCancel = (e) => {
                        e.preventDefault();
                        this.stopRepeatingAction(btn);
                        if (btn.hasPointerCapture(e.pointerId)) {
                            btn.releasePointerCapture(e.pointerId);
                        }
                    };

                    btn.addEventListener('pointerup', handlePointerUpOrCancel);
                    btn.addEventListener('pointercancel', handlePointerUpOrCancel);
                });
            }

            initPointerEvents() {
                if (!this.target) return;
                let activePointer = null;

                window.addEventListener('pointerdown', (e) => {
                    if (activePointer !== null) return;

                    if (e.pointerType === 'mouse' && e.button === 2) {
                        e.preventDefault();
                        this.dispatchAction('B', this.getMappedPointerDetails(e.clientX, e.clientY));
                        return;
                    }

                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    const rect = this.target.getBoundingClientRect();
                    const isInCanvas = (
                        e.clientX >= rect.left &&
                        e.clientX <= rect.right &&
                        e.clientY >= rect.top &&
                        e.clientY <= rect.bottom
                    );

                    if (!isInCanvas) return;
                    this.virbate();
                    activePointer = {
                        id: e.pointerId,
                        startX: e.clientX,
                        startY: e.clientY,
                        hasDragged: false
                    };
                });

                window.addEventListener('pointermove', (e) => {
                    if (!activePointer || activePointer.id !== e.pointerId) return;
                    if (e.pointerType === 'mouse' && e.buttons !== 1) return;

                    const dx = e.clientX - activePointer.startX;
                    const dy = e.clientY - activePointer.startY;

                    if (!activePointer.hasDragged && Math.hypot(dx, dy) >= 15) {
                        activePointer.hasDragged = true;
                    }

                    if (activePointer.hasDragged) {
                        this.dispatchAction('PointerMove', this.getMappedPointerDetails(e.clientX, e.clientY));
                    }
                });

                const handlePointerEnd = (e) => {
                    if (!activePointer || activePointer.id !== e.pointerId) return;

                    if (!activePointer.hasDragged) {
                        this.dispatchAction('PointerTap', this.getMappedPointerDetails(e.clientX, e.clientY));
                    }

                    activePointer = null;
                };

                window.addEventListener('pointerup', handlePointerEnd);
                window.addEventListener('pointercancel', handlePointerEnd);
            }

            initWheelEvents() {
                this.target.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        this.dispatchAction('Up');
                    } else if (e.deltaY > 0) {
                        this.dispatchAction('Down');
                    }
                }, {passive: false});
            }
        }

        class GameEngine {
            static State = Object.freeze({
                MENU: 'MENU',
                READY: 'READY',
                PLAYING: 'PLAYING',
                PAUSED: 'PAUSED',
                GAMEOVER: 'GAMEOVER'
            });

            constructor(config = {}) {
                this.canvas = document.querySelector(config.canvas || '#gameCanvas');
                this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
                this.scoreEl = document.querySelector(config.scoreEl || '#score');
                this.highScoreEl = document.querySelector(config.highScoreEl || '#highscore');
                this.overlay = document.querySelector(config.overlay || '#overlay');
                this.overlayTitle = document.querySelector(config.overlayTitle || '#overlay-title');
                this.overlayMsg = document.querySelector(config.overlayMsg || '#overlay-msg');
                this.controlsHint = document.querySelector(config.controlsHint || '#controls-hint');
                this.games = new Map();
                this.gameList = [];
                this.currentGame = null;
                this.score = 0;
                this.state = GameEngine.State.MENU;
                this.selectedIndex = 0;
                this.scrollOffset = 0;

                this.animationFrameId = null;
                this.lastTime = 0;

                this.storageManager = new StorageManager();
                this.audioManager = new AudioManager(new BaseAudioProvider());
                this.inputManager = new InputManager(this.canvas, (action, details) => this.handleInput(action, details));
                this.initWindowEvents();
            }

            setThemeAudioProvider(audioProvider) {
                this.audioManager.setThemeAudioProvider(audioProvider);
                if (this.state === GameEngine.State.MENU) {
                    this.audioManager.playThemeBGM();
                }
            }

            playSound(type) {
                this.audioManager.playSound(type);
            }

            playGameBGM() {
                this.audioManager.playGameBGM();
            }

            stopGameBGM() {
                this.audioManager.stopGameBGM();
            }

            registerGames(classes) {
                const classList = Array.isArray(classes) ? classes : [classes];

                classList.forEach(cls => {
                    if (cls && cls.prototype) {
                        const instance = new cls(this);
                        this.games.set(instance.id, instance);
                    }
                });

                this.gameList = Array.from(this.games.values());
                this.showMenu();
            }

            destroyCurrentGame() {
                if (this.currentGame && typeof this.currentGame.destroy === 'function') {
                    this.currentGame.destroy();
                    this.currentGame = null;
                }
            }

            showMenu() {
                this.destroyCurrentGame();
                this.stopGameLoop();
                this.stopGameBGM();

                this.state = GameEngine.State.MENU;
                this.audioManager.setGameAudioProvider(null);
                this.updateScoreDisplay();

                if (this.overlay) {
                    this.overlay.style.display = 'none';
                }
                if (this.controlsHint) {
                    this.controlsHint.innerText = 'HINT: ▲/▼ SELECT | A: ENTER | B: BACK';
                }

                this.audioManager.playThemeBGM();
                this.menuLoop();
            }

            menuLoop() {
                if (this.state !== GameEngine.State.MENU) return;
                if (this.ctx) {
                    this.drawMenu(this.ctx);
                }
                this.animationFrameId = requestAnimationFrame(() => this.menuLoop());
            }

            drawMenu(ctx) {
                const w = ctx.canvas.width, h = ctx.canvas.height;

                ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 4;

                ctx.font = '14px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillStyle = '#550022'; ctx.fillText('SELECT GAME', w / 2 + 2, 24);
                ctx.fillStyle = '#ff0055'; ctx.fillText('SELECT GAME', w / 2, 22);

                if (this.gameList.length === 0) return;

                const itemHeight = 32, startY = 68, visibleCount = 7;
                this.selectedIndex = Math.max(0, Math.min(this.selectedIndex || 0, this.gameList.length - 1));
                this.scrollOffset = Math.max(0, Math.min(this.scrollOffset || 0, this.selectedIndex));
                if (this.selectedIndex >= this.scrollOffset + visibleCount) {
                    this.scrollOffset = this.selectedIndex - visibleCount + 1;
                }

                ctx.font = '8px "Press Start 2P"';
                if (this.scrollOffset > 0) {
                    ctx.fillStyle = '#ffee00';
                    ctx.fillText('▲ MORE', w / 2, startY - 14);
                }

                for (let i = 0; i < visibleCount; i++) {
                    const gameIdx = this.scrollOffset + i;
                    if (gameIdx >= this.gameList.length) break;

                    const game = this.gameList[gameIdx];
                    const y = startY + i * itemHeight;
                    const isSelected = gameIdx === this.selectedIndex;

                    ctx.font = '10px "Press Start 2P"';
                    if (isSelected) {
                        ctx.fillStyle = '#00ff66'; ctx.fillRect(24, y - 2, w - 48, 24);
                        ctx.fillStyle = '#05180d'; ctx.fillRect(26, y, w - 52, 20);
                        ctx.fillStyle = '#00ff66'; ctx.fillText(`> ${game.name} <`, w / 2, y + 5);
                    } else {
                        ctx.fillStyle = '#004455'; ctx.fillText(game.name, w / 2 + 1, y + 6);
                        ctx.fillStyle = '#00ffff'; ctx.fillText(game.name, w / 2, y + 5);
                    }
                }

                ctx.font = '8px "Press Start 2P"';

                if (this.scrollOffset + visibleCount < this.gameList.length) {
                    ctx.fillStyle = '#ffee00';
                    ctx.fillText('▼ MORE', w / 2, startY + visibleCount * itemHeight + 2);
                }

                ctx.fillStyle = '#ffaa00';
                ctx.fillText('▲/▼ SELECT | A: ENTER', w / 2, h - 24);
            }

            selectGameAndReady(id) {
                this.destroyCurrentGame();
                this.stopGameLoop();
                this.stopGameBGM();
                this.audioManager.stopThemeBGM();
                this.audioManager.setGameAudioProvider(null);

                this.state = GameEngine.State.READY;
                this.currentGame = this.games.get(id) || null;

                if (this.controlsHint && this.currentGame) {
                    this.controlsHint.innerText = this.currentGame.hint || '';
                }

                this.score = 0;
                this.updateScoreDisplay();

                if (this.overlay) {
                    if (this.overlayTitle) this.overlayTitle.innerText = this.currentGame ? this.currentGame.name : 'SELECT GAME';
                    if (this.overlayMsg) this.overlayMsg.innerText = 'PRESS A TO START | B: MENU';
                    this.overlay.style.display = 'flex';
                }
            }

            startGame() {
                if (!this.currentGame) return;
                this.stopGameLoop();
                this.state = GameEngine.State.PLAYING;
                if (this.overlay) this.overlay.style.display = 'none';

                this.score = 0;
                this.updateScoreDisplay();
                this.audioManager.setGameAudioProvider(this.currentGame.audioProvider || null);
                this.currentGame.init();
                this.lastTime = performance.now();
                this.gameLoop(this.lastTime);
            }

            pauseGame() {
                if (this.state !== GameEngine.State.PLAYING) return;
                this.state = GameEngine.State.PAUSED;
                this.currentGame.pause();
                //this.stopGameBGM();

                if (this.overlay) {
                    if (this.overlayTitle) this.overlayTitle.innerText = 'PAUSED';
                    if (this.overlayMsg) this.overlayMsg.innerText = 'PRESS A: RESUME | B: QUIT TO MENU';
                    this.overlay.style.display = 'flex';
                }
            }

            resumeGame() {
                if (this.state !== GameEngine.State.PAUSED) return;
                this.state = GameEngine.State.PLAYING;
                this.currentGame.resume();
                if (this.overlay) this.overlay.style.display = 'none';

                //this.playGameBGM();
                this.lastTime = performance.now();
            }

            stopGameLoop() {
                this.audioManager.setGameAudioProvider(null);
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
            }

            gameLoop(timestamp) {
                if (this.state !== GameEngine.State.PLAYING && this.state !== GameEngine.State.PAUSED) return;

                const rawDt = (timestamp - this.lastTime) / 1000;
                const dt = Math.min(Math.max(rawDt, 0), 0.1);
                this.lastTime = timestamp;

                if (this.currentGame) {
                    if (this.state === GameEngine.State.PLAYING) {
                        this.currentGame.update(dt);
                    }
                    if (this.ctx) {
                        this.currentGame.draw(this.ctx);
                    }
                }
                if (this.state === GameEngine.State.PLAYING || this.state === GameEngine.State.PAUSED) {
                    this.animationFrameId = requestAnimationFrame((t) => this.gameLoop(t));
                }
            }

            endGame(isWin, msg) {
                this.state = GameEngine.State.GAMEOVER;
                this.stopGameLoop();
                this.stopGameBGM();
                this.playSound(isWin ? 'win' : 'gameover');

                this.audioManager.setGameAudioProvider(null);
                if (this.overlay) {
                    if (this.overlayTitle) this.overlayTitle.innerText = msg;
                    if (this.overlayMsg) this.overlayMsg.innerText = 'FINAL SCORE: ' + this.score + '\nPRESS A: RESTART | B: MENU';
                    this.overlay.style.display = 'flex';
                }
            }

            gameOver(msg = 'GAME OVER') {
                this.endGame(false, msg);
            }

            gameWin(msg = 'YOU WIN!') {
                this.endGame(true, msg);
            }

            addScore(pts) {
                this.score += pts;
                this.updateScoreDisplay();
            }

            updateScoreDisplay() {
                if (this.state === GameEngine.State.MENU) {
                    if (this.scoreEl) this.scoreEl.innerText = 0;
                    if (this.highScoreEl) this.highScoreEl.innerText = 0;
                    return;
                }
                if (this.scoreEl) this.scoreEl.innerText = this.score;
                if (this.currentGame) {
                    this.storageManager.setHighScore(this.currentGame.id, this.score);
                    const currentHigh = this.storageManager.getHighScore(this.currentGame.id);
                    if (this.highScoreEl) this.highScoreEl.innerText = currentHigh;
                }
            }

            initWindowEvents() {
                window.addEventListener('blur', () => {
                    if (this.state === GameEngine.State.PLAYING) {
                        this.pauseGame();
                    }
                });
            }
            handleInput(action, details = null) {
                switch (this.state) {
                    case GameEngine.State.MENU:
                        this.handleMenuInput(action, details);
                        break;
                    case GameEngine.State.READY:
                    case GameEngine.State.GAMEOVER:
                        if (action === 'A') {
                            this.playSound('beep');
                            this.startGame();
                        } else if (action === 'B') {
                            this.playSound('beep');
                            this.showMenu();
                        }
                        break;
                    case GameEngine.State.PLAYING:
                        if (action === 'B') {
                            this.playSound('beep');
                            this.pauseGame();
                        } else if (this.currentGame) {
                            this.currentGame.onInput(action, details);
                        }
                        break;
                    case GameEngine.State.PAUSED:
                        if (action === 'A') {
                            this.playSound('beep');
                            this.resumeGame();
                        } else if (action === 'B') {
                            this.playSound('beep');
                            this.showMenu();
                        }
                        break;
                }
            }

            handleMenuInput(action, details) {
                const total = this.gameList.length;
                if (total === 0) return;

                if (action === 'Up') {
                    this.playSound('beep');
                    this.selectedIndex = (this.selectedIndex - 1 + total) % total;
                } else if (action === 'Down') {
                    this.playSound('beep');
                    this.selectedIndex = (this.selectedIndex + 1) % total;
                } else if (action === 'A' || action === 'X') {
                    this.playSound('beep');
                    const selectedGame = this.gameList[this.selectedIndex];
                    if (selectedGame) {
                        this.selectGameAndReady(selectedGame.id);
                    }
                } else if (action === 'PointerTap' && details && details.x >= 26 && details.x <= 374) {
                    const index = Math.floor((details.y - 68) / 32);
                    const clickedIdx = this.scrollOffset + index;
                    if (index >= 0 && index < 7 && clickedIdx >= 0 && clickedIdx < total) {
                        this.selectedIndex = clickedIdx;
                        this.playSound('beep');
                        this.selectGameAndReady(this.gameList[clickedIdx].id);
                    }

                }
            }
        } </script>

        class SuperMarioAudioProvider extends BaseAudioProvider {
            playSound(type) {
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    if (type === 'beep') {
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                        osc.start(now);
                        osc.stop(now + 0.12);
                        return true;
                    } else if (type === 'score') {
                        osc.frequency.setValueAtTime(987.77, now);
                        osc.frequency.setValueAtTime(1318.51, now + 0.08);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.setValueAtTime(0.08, now + 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        return true;
                    } else if (type === 'gameover') {
                        const notes = [
                            {f: 493.88, t: 0.00},
                            {f: 698.46, t: 0.12},
                            {f: 698.46, t: 0.38},
                            {f: 698.46, t: 0.58},
                            {f: 659.25, t: 0.78},
                            {f: 587.33, t: 0.88},
                            {f: 523.25, t: 0.98}
                        ];

                        notes.forEach(note => {
                            osc.frequency.setValueAtTime(note.f, now + note.t);
                        });
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                        osc.start(now);
                        osc.stop(now + 1.2);
                        return true;
                    } else if (type === 'win') {
                        const notes = [
                            {f: 392.00, t: 0.00},
                            {f: 523.25, t: 0.07},
                            {f: 659.25, t: 0.14},
                            {f: 783.99, t: 0.21},
                            {f: 1046.50, t: 0.28},
                            {f: 1318.51, t: 0.35},
                            {f: 1567.98, t: 0.42},
                        ];

                        notes.forEach(note => {
                            osc.frequency.setValueAtTime(note.f, now + note.t);
                        });

                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.setValueAtTime(0.1, now + 0.60);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.90);
                        osc.start(now);
                        osc.stop(now + 0.90);
                        return true;
                    }
                } catch (e) { }
                return false;
            }
        }

            onMount() {
                const fx = document.getElementById('fx-container');
                if (fx) {
                    this.bloodCanvas = document.createElement('canvas');
                    this.bloodCanvas.className = 'blood-canvas';
                    fx.appendChild(this.bloodCanvas);
                    this.fxContainer = document.createElement('div');
                    this.fxContainer.className = 'doom-vignette';
                    fx.appendChild(this.fxContainer);
                    this.initBloodAnimation();
                }
            }

            initBloodAnimation() {
                const canvas = this.bloodCanvas;
                const ctx = canvas.getContext('2d');

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                this.resizeHandler = resize;
                window.addEventListener('resize', resize);
                resize();

                const dropCount = Math.floor(window.innerWidth / 12);
                const drops = [];

                for (let i = 0; i < dropCount; i++) {
                    drops.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height - canvas.height,
                        length: Math.random() * 90 + 30,
                        speed: Math.random() * 1.5 + 0.8,
                        width: Math.random() * 4.5 + 1.5,
                        alpha: Math.random() * 0.7 + 0.3,
                        color: Math.random() > 0.25 ? '139, 0, 0' : '255, 17, 0'
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    drops.forEach(drop => {
                        ctx.beginPath();

                        let gradient = ctx.createLinearGradient(drop.x, drop.y, drop.x, drop.y + drop.length);
                        gradient.addColorStop(0, `rgba(${drop.color}, 0)`);
                        gradient.addColorStop(1, `rgba(${drop.color}, ${drop.alpha})`);
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = drop.width;
                        ctx.lineCap = 'round';
                        ctx.moveTo(drop.x, drop.y);
                        ctx.lineTo(drop.x, drop.y + drop.length);
                        ctx.stroke();
                        drop.y += drop.speed;

                        if (drop.y > canvas.height) {
                            drop.y = -drop.length - Math.random() * 120;
                            drop.x = Math.random() * canvas.width;
                            drop.speed = Math.random() * 2.5 + 1.2;
                        }
                    });

                    this.animId = requestAnimationFrame(render);
                };

                render();
            }

            onUnmount() {
                if (this.animId) {
                    cancelAnimationFrame(this.animId);
                    this.animId = null;
                }

                if (this.resizeHandler) {
                    window.removeEventListener('resize', this.resizeHandler);
                    this.resizeHandler = null;
                }

                if (this.fxContainer && this.fxContainer.parentNode) {
                    this.fxContainer.parentNode.removeChild(this.fxContainer);
                }

                if (this.bloodCanvas && this.bloodCanvas.parentNode) {
                    this.bloodCanvas.parentNode.removeChild(this.bloodCanvas);
                }
            }
        }

                if (!AudioContext) return alert('Web Audio API Not Supported');
                const ctx = new AudioContext();

                const masterGain = ctx.createGain();
                masterGain.gain.value = 0.7;
                masterGain.connect(ctx.destination);


                const delayNode = ctx.createDelay();
                delayNode.delayTime.value = 0.3;
                const delayFeedback = ctx.createGain();
                delayFeedback.gain.value = 0.4;
                delayNode.connect(delayFeedback);
                delayFeedback.connect(delayNode);
                delayNode.connect(masterGain);


                const distortion = ctx.createWaveShaper();
                function makeDistortionCurve(amount) {
                    const k = typeof amount === 'number' ? amount : 50,
                        n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180;
                    for (let i = 0; i < n_samples; ++i) {
                        const x = i * 2 / n_samples - 1;
                        curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                    }
                    return curve;
                }
                distortion.connect(masterGain);


                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;




                const tempo = 105;
                const stepTime = 60 / tempo / 4;

                const chords = [
                    {root: 45, arp: [0, 3, 7, 12]},
                    {root: 41, arp: [0, 4, 7, 12]},
                    {root: 38, arp: [0, 3, 7, 12]},
                    {root: 40, arp: [0, 4, 7, 12]}
                ];

                const scale = [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81];


                let motif = [];
                function generateMotif() {
                    let newMotif = [];
                    let noteIndex = 5;
                    for (let i = 0; i < 32; i++) {
                        let prob = (i % 4 === 0) ? 0.6 : ((i % 2 === 0) ? 0.3 : 0.1);
                        if (Math.random() < prob) {
                            let step = Math.floor(Math.random() * 5) - 2;
                            noteIndex += step;
                            if (noteIndex < 0) noteIndex = 0;
                            if (noteIndex >= scale.length) noteIndex = scale.length - 1;
                            newMotif.push(noteIndex);
                        } else {
                            newMotif.push(null);
                        }
                    }
                    return newMotif;
                }
                motif = generateMotif();

                function playKick(time) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(masterGain);

                    osc.frequency.setValueAtTime(150, time);
                    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);

                    gain.gain.setValueAtTime(1, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);

                    osc.start(time); osc.stop(time + 0.3);
                }


                function playNoise(time, duration, vol, type) {
                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const filter = ctx.createBiquadFilter();
                    const gain = ctx.createGain();

                    filter.type = (type === 'snare') ? 'bandpass' : 'highpass';
                    filter.frequency.value = (type === 'snare') ? 1500 : 8000;

                    gain.gain.setValueAtTime(vol, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + duration);

                    noise.connect(filter); filter.connect(gain); gain.connect(masterGain);
                    noise.start(time); noise.stop(time + duration);
                }

                function playReeseBass(note, time, duration) {
                    const freq = 440 * Math.pow(2, (note - 69) / 12);
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gain = ctx.createGain();


                    osc1.type = 'sawtooth';
                    osc2.type = 'sawtooth';
                    osc1.frequency.value = freq;
                    osc2.frequency.value = freq * 1.01;


                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, time);
                    filter.frequency.exponentialRampToValueAtTime(100, time + duration);


                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.4, time + 0.05);
                    gain.gain.linearRampToValueAtTime(0, time + duration);


                    osc1.connect(filter); osc2.connect(filter);
                    filter.connect(gain);

                    osc1.start(time); osc2.start(time);
                    osc1.stop(time + duration); osc2.stop(time + duration);
                }


                function playSynth(note, time, duration, vol, hasDelay) {
                    const osc = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gain = ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.value = 440 * Math.pow(2, (note - 69) / 12);


                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3000, time);
                    filter.frequency.exponentialRampToValueAtTime(300, time + duration * 0.8);


                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(vol, time + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + duration);


                    osc.connect(filter); filter.connect(gain);
                    gain.connect(masterGain);
                    if (hasDelay) gain.connect(delayNode);


                    osc.start(time); osc.stop(time + duration);
                }


                let currentStep = 0;
                let nextStepTime = ctx.currentTime + 0.1;
                let timerId;


                function schedule() {
                    while (nextStepTime < ctx.currentTime + 0.1) {
                        let bar = Math.floor(currentStep / 16);
                        let chordObj = chords[bar % 4];
                        let chordRoot = chordObj.root;


                        if (currentStep % 8 === 0) {
                            playKick(nextStepTime);
                        }
                        if (currentStep % 16 === 8) {
                            playNoise(nextStepTime, 0.2, 0.5, 'snare');
                        }
                        if (currentStep % 2 === 0) {
                            let hatVol = (currentStep % 4 === 0) ? 0.15 : 0.05;
                            playNoise(nextStepTime, 0.05, hatVol, 'hat');
                        }


                        if (currentStep % 2 === 0) {
                            playReeseBass(chordRoot - 24, nextStepTime, stepTime * 1.8);
                        }


                        let arpNote = chordRoot + chordObj.arp[currentStep % 4];
                        playSynth(arpNote, nextStepTime, stepTime * 0.8, 0.05, false);


                        let mNoteIdx = motif[currentStep % 32];
                        if (mNoteIdx !== null) {
                            playSynth(scale[mNoteIdx], nextStepTime, stepTime * 2.5, 0.15, true);
                        }


                        if (currentStep > 0 && currentStep % 64 === 0) {
                            motif = generateMotif();
                        }


                        currentStep++;
                        nextStepTime += stepTime;
                    }
                    timerId = requestAnimationFrame(schedule);
                }


                schedule();


                return function stop() {
                    cancelAnimationFrame(timerId);
                    ctx.close();
                };
            }
        }

        class FcAudioProvider extends BaseAudioProvider {
            playSound(type) {
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'beep') {
                        osc.type = 'square';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(3000, now);
                        osc.frequency.setValueAtTime(1200, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                        return true;
                    } else if (type === 'score') {
                        osc.type = 'square';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(4000, now);

                        osc.frequency.setValueAtTime(987.77, now);
                        osc.frequency.setValueAtTime(1318.51, now + 0.08);

                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.setValueAtTime(0.1, now + 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        return true;
                    } else if (type === 'gameover') {
                        osc.type = 'triangle';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(2000, now);

                        const notes = [493.88, 415.30, 349.23, 293.66, 246.94, 207.65];
                        notes.forEach((freq, i) => {
                            osc.frequency.setValueAtTime(freq, now + i * 0.1);
                        });

                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                        return true;
                    } else if (type === 'win') {
                        osc.type = 'square';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(3000, now);

                        const chord = [523.25, 659.25, 783.99];
                        let time = now;

                        for (let i = 0; i < 12; i++) {
                            osc.frequency.setValueAtTime(chord[i % 3], time);
                            time += 0.04;
                        }
                        osc.frequency.setValueAtTime(1046.50, time);

                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.setValueAtTime(0.1, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);

                        osc.start(now);
                        osc.stop(time + 0.5);
                        return true;
                    }
                } catch (e) { }
                return false;
            }
        }

                            osc.frequency.setValueAtTime(freq, startTime);
                            gain.gain.setValueAtTime(0.08, startTime);

                        osc.frequency.setValueAtTime(329.63, now + 0.12);
                        osc.frequency.setValueAtTime(261.63, now + 0.24);
                        osc.frequency.setValueAtTime(196.00, now + 0.36);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
                        osc.start(now);
                        osc.stop(now + 0.55);
                        return true;
                    }
                } catch (e) { }
                return false;
            }

            playThemeBGM() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return alert('Web Audio API Not Supported');
                const ctx = new AudioContext();

                const tempo = 90;
                const stepTime = 60 / tempo / 4;

                const chords = [36, 41, 38, 43];
                const chordTypes = ['Maj7', 'Maj7', 'm7', 'Dom7'];

                const scale = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81];

                let motif = [];
                function generateMotif() {
                    let newMotif = [];
                    let noteIndex = 4;

                    for (let i = 0; i < 32; i++) {
                        let prob = (i % 8 === 0) ? 0.85 : ((i % 4 === 0) ? 0.5 : 0.1);

                        if (Math.random() < prob) {
                            let step = Math.floor(Math.random() * 5) - 2;
                            noteIndex += step;

                            if (noteIndex < 0) noteIndex = 0;
                            if (noteIndex >= scale.length) noteIndex = scale.length - 1;

                            let durationMulti = Math.random() > 0.5 ? 2.5 : 4.5;
                            newMotif.push({note: noteIndex, dur: durationMulti});
                        } else {
                            newMotif.push(null);
                        }
                    }
                    return newMotif;
                }

                motif = generateMotif();

                function playTone(note, time, duration, waveType, volume) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = waveType;
                    osc.frequency.value = 440 * Math.pow(2, (note - 69) / 12);

                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(volume, time + 0.05);
                    gain.gain.setValueAtTime(volume, time + duration * 0.5);
                    gain.gain.linearRampToValueAtTime(0, time + duration + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(time);
                    osc.stop(time + duration + 0.3);
                }

                let currentStep = 0;
                let nextStepTime = ctx.currentTime + 0.1;
                let timerId;

                function schedule() {
                    while (nextStepTime < ctx.currentTime + 0.1) {
                        let bar = Math.floor(currentStep / 16);
                        let chordIdx = bar % 4;
                        let chordRoot = chords[chordIdx];
                        let type = chordTypes[chordIdx];

                        if (currentStep % 4 === 0) {
                            playTone(chordRoot, nextStepTime, stepTime * 2.5, 'triangle', 0.25);
                        } else if (currentStep % 4 === 2) {
                            playTone(chordRoot + 7, nextStepTime, stepTime * 2, 'triangle', 0.15);
                        }

                        if (currentStep % 2 === 0) {
                            let arpOffsets;
                            if (type === 'Maj7') arpOffsets = [0, 4, 7, 11];
                            else if (type === 'm7') arpOffsets = [0, 3, 7, 10];
                            else arpOffsets = [0, 4, 7, 10];

                            let arpNote = chordRoot + 12 + arpOffsets[(currentStep / 2) % 4];
                            playTone(arpNote, nextStepTime, stepTime * 2, 'sine', 0.08);
                        }

                        let mData = motif[currentStep % 32];
                        if (mData !== null) {
                            playTone(scale[mData.note], nextStepTime, stepTime * mData.dur, 'triangle', 0.15);
                        }

                        if (currentStep > 0 && currentStep % 64 === 0) {
                            motif = generateMotif();
                        }
                        currentStep++;
                        nextStepTime += stepTime;
                    }
                    timerId = requestAnimationFrame(schedule);
                }

                schedule();

                return function stop() {
                    cancelAnimationFrame(timerId);
                    ctx.close();
                };
            }
        }

        class MinecraftAudioProvider extends BaseAudioProvider {
            playSound(type) {
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'win') {
                        const notes = [987.77, 1318.51, 1567.98, 1975.53];
                        const noteDuration = 0.035;
                        notes.forEach((freq, index) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            const startTime = now + index * noteDuration;
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, startTime);
                            gain.gain.setValueAtTime(0.1, startTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.07);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(startTime);
                            osc.stop(startTime + 0.07);
                        });
                        return true;
                    } else if (type === 'score') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(1200, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.02);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.02);
                        return true;
                    } else if (type === 'gameover') {
                        osc.type = 'sawtooth';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(2000, now);
                        filter.frequency.linearRampToValueAtTime(100, now + 0.6);
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        return true;
                    } else if (type === 'beep') {
                        osc.type = 'triangle';
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(600, now);
                        filter.frequency.exponentialRampToValueAtTime(80, now + 0.09);
                        osc.frequency.setValueAtTime(140, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.09);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                        osc.start(now);
                        osc.stop(now + 0.09);
                        const bufferSize = Math.floor(this.ctx.sampleRate * 0.08);
                        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = Math.random() * 2 - 1;
                        }
                        const noise = this.ctx.createBufferSource();
                        noise.buffer = buffer;
                        const noiseFilter = this.ctx.createBiquadFilter();
                        noiseFilter.type = 'lowpass';
                        noiseFilter.frequency.setValueAtTime(1000, now);
                        noiseFilter.frequency.exponentialRampToValueAtTime(250, now + 0.08);
                        const noiseGain = this.ctx.createGain();
                        noiseGain.gain.setValueAtTime(0.2, now);
                        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        noise.connect(noiseFilter);
                        noiseFilter.connect(noiseGain);
                        noiseGain.connect(this.ctx.destination);
                        noise.start(now);
                        noise.stop(now + 0.08);
                        return true;
                    }
                } catch (e) { }
                return false;
            }
        }
    </script>

    <script>
        class SnakeGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'snake';
                this.name = 'SNAKE';
                this.hint = 'HINT: SWIPE / D-PAD / ARROW KEYS TO MOVE';
                this.gridSize = 20;
                this.tileCount = 20;
                this.snake = [];
                this.dir = {x: 1, y: 0};
                this.nextDir = {x: 1, y: 0};
                this.food = {x: 0, y: 0};
                this.moveInterval = 0.09;
                this.timer = 0;
            }


            init() {
                this.snake = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                this.dir = {x: 1, y: 0};
                this.nextDir = {x: 1, y: 0};
                this.timer = 0;
                this.spawnFood();
            }


            spawnFood() {
                const emptyCells = [];
                for (let x = 0; x < this.tileCount; x++) {
                    for (let y = 0; y < this.tileCount; y++) {
                        if (!this.snake.some(segment => segment.x === x && segment.y === y)) {
                            emptyCells.push({x, y});
                        }
                    }
                }


                if (emptyCells.length > 0) {
                    const randomIndex = Math.floor(Math.random() * emptyCells.length);
                    this.food = emptyCells[randomIndex];
                }
            }


            onInput(action) {
                if (action === 'Up' && this.dir.y === 0) this.nextDir = {x: 0, y: -1};
                if (action === 'Down' && this.dir.y === 0) this.nextDir = {x: 0, y: 1};
                if (action === 'Left' && this.dir.x === 0) this.nextDir = {x: -1, y: 0};
                if (action === 'Right' && this.dir.x === 0) this.nextDir = {x: 1, y: 0};
            }


            update(dt) {
                this.timer += dt;
                if (this.timer < this.moveInterval) return;
                this.timer = 0;


                this.dir = {...this.nextDir};
                const head = {x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y};


                if (
                    head.x < 0 || head.x >= this.tileCount ||
                    head.y < 0 || head.y >= this.tileCount ||
                    this.snake.some(segment => segment.x === head.x && segment.y === head.y)
                ) {
                    this.engine.gameOver('GAME OVER');
                    return;
                }


                this.snake.unshift(head);


                if (head.x === this.food.x && head.y === this.food.y) {
                    this.engine.addScore(10);
                    this.engine.playSound('score');
                    this.spawnFood();
                } else {
                    this.snake.pop();
                }
            }


            draw(ctx) {
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);


                ctx.strokeStyle = '#121226';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= this.tileCount; i++) {
                    ctx.moveTo(i * this.gridSize, 0);
                    ctx.lineTo(i * this.gridSize, this.tileCount * this.gridSize);
                    ctx.moveTo(0, i * this.gridSize);
                    ctx.lineTo(this.tileCount * this.gridSize, i * this.gridSize);
                }
                ctx.stroke();


                ctx.strokeStyle = '#1d1d3a';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, this.tileCount * this.gridSize, this.tileCount * this.gridSize);


                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff0055';
                ctx.fillRect(this.food.x * this.gridSize + 2, this.food.y * this.gridSize + 2, 16, 16);


                ctx.fillStyle = '#00ff66';
                ctx.shadowColor = '#00ff66';
                this.snake.forEach(s => {
                    ctx.fillRect(s.x * this.gridSize + 1, s.y * this.gridSize + 1, 18, 18);
                });


                ctx.shadowBlur = 0;
            }
        }

        class BreakoutGame extends BaseGame {
            constructor(engine) {
                super(engine);
                this.id = 'breakout';
                this.name = 'BREAKOUT';
                this.hint = 'HINT: SWIPE/DRAG OR LEFT/RIGHT TO MOVE PADDLE';
                this.paddle = {x: 160, y: 370, w: 80, h: 12};
                this.ball = {x: 200, y: 300, vx: 180, vy: -180, r: 6};
                this.bricks = [];


                this.brickTheme = [
                    {top: '#ff6b6b', mid: '#ee5253', bot: '#a71d2a', border: '#ff9ff3'},
                    {top: '#ff9f43', mid: '#f368e0', bot: '#d35400', border: '#ffeaa7'},
                    {top: '#feca57', mid: '#ff9f43', bot: '#b7791f', border: '#fff200'},
                    {top: '#1dd1a1', mid: '#10ac84', bot: '#016241', border: '#55efc4'},
                    {top: '#48dbfb', mid: '#0abde3', bot: '#0077b6', border: '#81ecec'}
                ];
            }


            init() {
                this.paddle.x = 160;
                this.ball = {x: 200, y: 300, vx: 180, vy: -180, r: 6};
                this.bricks = [];
                const colors = ['#ff0055', '#ff8800', '#ffee00', '#00ff66', '#00ffff'];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 8; c++) {
                        this.bricks.push({
                            x: c * 48 + 8,
                            y: r * 20 + 40,
                            w: 44,
                            h: 14,
                            active: true,
                            row: r,
                            color: colors[r]
                        });
                    }
                }
            }


            onInput(action, details) {
                if (action === 'Left') {
                    this.paddle.x = Math.max(0, this.paddle.x - 30);
                } else if (action === 'Right') {
                    this.paddle.x = Math.min(400 - this.paddle.w, this.paddle.x + 30);
                } else if ((action === 'PointerMove' || action === 'PointerTap') && details) {
                    const px = (details.x / details.width) * 400;
                    this.paddle.x = Math.min(Math.max(0, px - this.paddle.w / 2), 400 - this.paddle.w);
                }
            }


            update(dt) {
                if (dt > 0.1) dt = 0.1;
                this.ball.x += this.ball.vx * dt;
                this.ball.y += this.ball.vy * dt;


                if (this.ball.x - this.ball.r < 0) {
                    this.ball.x = this.ball.r;
                    this.ball.vx *= -1;
                    this.engine.playSound('beep');
                } else if (this.ball.x + this.ball.r > 400) {
                    this.ball.x = 400 - this.ball.r;
                    this.ball.vx *= -1;
                    this.engine.playSound('beep');
                }


                if (this.ball.y - this.ball.r < 0) {
                    this.ball.y = this.ball.r;
                    this.ball.vy *= -1;
                    this.engine.playSound('beep');
                }


                if (
                    this.ball.y + this.ball.r >= this.paddle.y &&
                    this.ball.y - this.ball.r <= this.paddle.y + this.paddle.h &&
                    this.ball.x >= this.paddle.x &&
                    this.ball.x <= this.paddle.x + this.paddle.w
                ) {
                    this.ball.vy = -Math.abs(this.ball.vy);
                    const hitPos = (this.ball.x - (this.paddle.x + this.paddle.w / 2)) / (this.paddle.w / 2);
                    this.ball.vx = hitPos * 220;
                    this.engine.playSound('beep');
                }


                if (this.ball.y > 400) {
                    this.engine.gameOver('GAME OVER');
                    return;
                }


                let activeBricks = 0;
                this.bricks.forEach(b => {
                    if (b.active) {
                        activeBricks++;
                        if (
                            this.ball.x > b.x &&
                            this.ball.x < b.x + b.w &&
                            this.ball.y - this.ball.r < b.y + b.h &&
                            this.ball.y + this.ball.r > b.y
                        ) {
                            b.active = false;
                            this.ball.vy *= -1;
                            this.engine.addScore(20);
                            this.engine.playSound('score');
                        }
                    }
                });


                if (activeBricks === 0) {
                    this.engine.gameWin('VICTORY!');
                }
            }


            drawRoundRectPath(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }


            drawBackground(ctx) {
                ctx.save();


                const bgGradient = ctx.createLinearGradient(0, 0, 0, 400);
                bgGradient.addColorStop(0, '#2b2f38');
                bgGradient.addColorStop(0.5, '#1e2128');
                bgGradient.addColorStop(1, '#14161a');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, 400, 400);


                ctx.lineWidth = 1;
                for (let y = 0; y < 400; y += 4) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(400, y);
                    ctx.stroke();
